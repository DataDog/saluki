[package]
name = "saluki-components"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
default = []
fips = ["saluki-io/fips"]
# Compiles measurement probes and entry points: the DogStatsD datagram receiver's lock-wait histograms, the
# `sources::dogstatsd_measurement` decoder that the `dogstatsd_codec` bench drives, and saluki-core's probes. Not enabled
# in normal builds, nor in the workspace's test builds (`make test-measurement` enables it).
measurement = ["saluki-core/measurement"]
test-util = ["saluki-metric-kernels/test-util"]

[dependencies]
agent-data-plane-config = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true, features = ["std"] }
bytes = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
datadog-agent-commons = { workspace = true }
datadog-agent-metrics-v3 = { workspace = true }
datadog-protos = { workspace = true }
ddsketch = { workspace = true }
faster-hex = { workspace = true }
fnv = { workspace = true }
futures = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http-serde-ext = { workspace = true }
hyper = { workspace = true, features = ["client"] }
hyper-http-proxy = { workspace = true }
libdd-trace-obfuscation = { workspace = true }
lru-slab = { workspace = true }
memchr = { workspace = true }
metrics = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true, features = [
  "semconv_experimental",
] }
otlp-protos = { workspace = true }
piecemeal = { workspace = true }
pin-project = { workspace = true }
prometheus-exposition = { workspace = true }
prost = { workspace = true }
protobuf = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng"] }
regex = { workspace = true, features = ["unicode-perl"] }
rmp = { workspace = true }
rmp-serde = { workspace = true }

# TLS dependencies used by the OTLP receiver to configure server-side TLS.
rustls = { workspace = true }
saluki-antithesis = { workspace = true }
saluki-api = { workspace = true }
saluki-common = { workspace = true }
saluki-config = { workspace = true }
saluki-core = { workspace = true }
saluki-env = { workspace = true }
saluki-error = { workspace = true }
saluki-io = { workspace = true }
saluki-metadata = { workspace = true }
saluki-metric-kernels = { workspace = true }
saluki-metrics = { workspace = true }
saluki-tls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simdutf8 = { workspace = true }
snafu = { workspace = true }
stringtheory = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tokio-rustls = { workspace = true }
tonic = { workspace = true, features = ["router", "server", "channel"] }
tower = { workspace = true, features = ["limit", "retry", "timeout", "util"] }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-rolling-file = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
libc = { workspace = true }
proptest = { workspace = true }
saluki-config = { workspace = true, features = ["test-util"] }
saluki-core = { workspace = true, features = ["test-util"] }
saluki-env = { workspace = true, features = ["test-util"] }
saluki-metric-kernels = { workspace = true, features = ["test-util"] }
saluki-metrics = { workspace = true, features = ["test"] }
saluki-tls = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
test-strategy = { workspace = true }
tokio = { workspace = true, features = ["time", "io-util", "net", "rt", "test-util"] }

[[bench]]
name = "dogstatsd_codec"
harness = false
required-features = ["measurement"]

[[bench]]
name = "encode_host"
harness = false
