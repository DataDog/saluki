[package]
name = "datadog-agent-runtime"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
default = []
# Collects a Tokio task dump into flares. Requires Linux on a Tokio-supported architecture and `--cfg tokio_unstable`;
# Tokio fails to compile otherwise, so only enable this for targets that meet both requirements.
taskdump = ["tokio/taskdump"]

[dependencies]
async-trait = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
datadog-agent-commons = { workspace = true }
datadog-protos = { workspace = true }
futures = { workspace = true }
process-memory = { workspace = true }
prost-types = { workspace = true }
saluki-app = { workspace = true }
saluki-common = { workspace = true }
saluki-config = { workspace = true }
saluki-core = { workspace = true }
saluki-error = { workspace = true }
saluki-io = { workspace = true }
saluki-metadata = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
