[package]
name = "datadog-agent-config-corpus"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

# A leaf crate: it reads the config recorder's corpus from its contract alone, so it depends on no
# config crate and no protobuf code.
[dependencies]
serde_json = { workspace = true }

# Dev-only: the corpus_checks module also loads the vendored schema and overlay to check the
# corpus's case groups against them, and hashes the recorder's inputs to check staleness. Neither
# use makes this crate depend on datadog-agent-config.
[dev-dependencies]
datadog-agent-config-overlay-model = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
