name: yaml-dotted-keys
group: behavior
why: [yaml-dotted-key-split-before-schema]
yaml: |
  data_plane.api_listen_address: tcp://127.0.0.1:5199
  unknown_labels_xyz:
    host.name: a
  additional_endpoints:
    https://x.test: [k]
keys: [additional_endpoints, data_plane.api_listen_address, unknown_labels_xyz.host.name]
