# Sets additional_endpoints from JSON in an environment variable.
# Shows that the Agent decodes the JSON at load, so the value is stored, streamed and read as a map
# rather than as the raw string.
name: additional-endpoints-env
group: behavior
why: [env-map-json-decoded]
env:
  DD_ADDITIONAL_ENDPOINTS: '{"https://x.test": ["k"]}'
keys: [additional_endpoints]
