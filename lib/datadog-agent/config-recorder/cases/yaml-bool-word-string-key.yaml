# Sets a known string key to unquoted "yes" and an unknown key to unquoted "Off" in YAML.
# Shows that YAML reads both as booleans before the known string key is converted to text.
name: yaml-bool-word-string-key
group: behavior
why: [yaml-bool-word-coercion]
yaml: |
  env: yes
  unknown_word_xyz: Off
keys: [env, unknown_word_xyz]
