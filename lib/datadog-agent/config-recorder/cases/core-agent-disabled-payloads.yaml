# Disables core_agent in YAML and reads all four payload switches.
# Shows that the Agent turns them off at load time and reports Agent-written values.
name: core-agent-disabled-payloads
group: behavior
why: [core-agent-disabled-forces-payloads-off]
yaml: |
  core_agent:
    enabled: false
keys:
  - core_agent.enabled
  - enable_payloads.events
  - enable_payloads.series
  - enable_payloads.service_checks
  - enable_payloads.sketches
