# Gives dogstatsd_socket a map and apm_config.features a list in YAML, then reads them.
# Shows that a string getter warns and returns empty text for map or list values.
name: yaml-map-for-string-key
group: behavior
why: [getter-string-on-map-returns-empty]
yaml: |
  dogstatsd_socket:
    a: b
  apm_config:
    features: [cr-a]
keys:
  - dogstatsd_socket
  - {key: apm_config.features, getters: [GetStringSlice, GetString]}
