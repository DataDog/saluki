# Sets several list-valued environment variables to the same comma-and-space text.
# Shows that each key's parser, rather than one universal separator, determines its list.
name: env-list-separator-per-key
group: behavior
why: [env-list-separator-is-per-key]
env:
  DD_ADMISSION_CONTROLLER_AUTO_INSTRUMENTATION_CONTAINER_REGISTRY_ALLOW_LIST: "a,b c"
  DD_APM_FEATURES: "a,b c"
  DD_APM_IGNORE_RESOURCES: "a,b c"
  DD_APM_OBFUSCATION_CREDIT_CARDS_KEEP_VALUES: "a,b c"
  DD_APM_OBFUSCATION_MONGODB_KEEP_VALUES: "a,b c"
  DD_OTELCOLLECTOR_CONVERTER_FEATURES: "a,b c"
  DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_COMMANDS: "a,b c"
keys: [admission_controller.auto_instrumentation.container_registry_allow_list, apm_config.features, apm_config.ignore_resources, apm_config.obfuscation.credit_cards.keep_values, apm_config.obfuscation.mongodb.keep_values, otelcollector.converter.features, private_action_runner.restricted_shell.allowed_commands]
