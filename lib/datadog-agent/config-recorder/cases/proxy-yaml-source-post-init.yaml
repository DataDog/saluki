# Sets an HTTPS proxy and cloud metadata proxy use in YAML.
# Shows that proxy values get a load-time source, not the YAML source,
# and the resulting empty no_proxy list can stream as null.
name: proxy-yaml-source-post-init
group: behavior
why: [proxy-source-config-post-init, empty-list-streams-null-or-empty]
yaml: |
  use_proxy_for_cloud_metadata: true
  proxy:
    https: http://yaml.test:3128
keys: [proxy.https, proxy.no_proxy]
