[package]
name = "saluki-common"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
# Exposes test-only helpers, such as the fake thread CPU clock of `resource_tracking::testing`, as plain `pub` items so
# that other crates can use them in their own tests. Not enabled in normal builds.
test-util = []

[dependencies]
bytes = { workspace = true }
foldhash = { workspace = true }
http-body = { workspace = true }
indexmap = { workspace = true }
itoa = { workspace = true }
papaya = { workspace = true }
pin-project = { workspace = true }
regex = { workspace = true, features = ["unicode-perl", "unicode-case"] }
saluki-antithesis = { workspace = true }
saluki-error = { workspace = true }
saluki-metrics = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
shake = { workspace = true }
smallvec = { workspace = true }
stringtheory = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
metrics = { workspace = true }
proptest = { workspace = true }
saluki-metrics = { workspace = true, features = ["test"] }
serde_json = { workspace = true }
tokio-test = { workspace = true }
