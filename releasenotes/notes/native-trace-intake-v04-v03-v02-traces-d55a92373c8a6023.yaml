features:
  - |
    The experimental native trace intake, enabled with ``data_plane.experimental.apm.native_trace_intake``, now serves
    MessagePack payloads on ``/v0.4/traces``, ``/v0.3/traces`` and ``/v0.2/traces`` itself, as it does
    ``/v1.0/traces``. As the trace-agent does, ``/v0.4/traces`` answers with the rates by service, ``/v0.3/traces``
    answers ``OK``, and ``/v0.2/traces`` rejects MessagePack with ``415 Unsupported Media Type``. The tracer's language,
    language version and tracer version come from the ``Datadog-Meta-*`` headers, and its container from the request.
  - |
    The native trace intake counts payloads that end early under ``reason:msgp_short_bytes`` in
    ``datadog.trace_agent.normalizer.traces_dropped``, as the trace-agent does, and answers them with the trace-agent's
    message.
upgrade:
  - |
    With the native trace intake, Datadog traces are now sampled under their tracer payload's env, and their APM stats
    take the version, git commit SHA and language from the tracer payload, as the trace-agent does. Before, an ``env``,
    ``version`` or ``_dd.git.commit.sha`` span tag, or a ``language`` tag on the root span, could take precedence.
    OTLP traces are unchanged.
  - |
    The native trace intake ignores the ``disable-convert-traces`` entry of ``apm_config.features``, and logs a warning
    at startup when it is set: ADP processes the traces it serves as the trace-agent does without it. Payloads ADP
    forwards to the trace-agent still follow it.
