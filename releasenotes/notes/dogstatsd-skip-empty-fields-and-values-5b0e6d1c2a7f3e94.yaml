fixes:
  - |
    DogStatsD no longer silently drops the fields after an empty ``|`` field. With
    ``dogstatsd_permissive_decoding`` enabled (the default), empty fields are skipped
    as in the Datadog Agent: for example, ``metric:1|c||#env:prod`` now keeps its
    tags, and events and service checks keep their tags, aggregation key and
    message. Empty values in a multi-value metric, such as ``metric:1::2|d``, are
    also skipped rather than rejecting the whole line. With permissive decoding
    disabled, these payloads are now rejected and counted as decode errors.
