security:
  - |
    FIPS builds now use the AWS-LC FIPS 4 branch, upgrading from the FIPS 3 branch. NIST
    certifies the AWS-LC FIPS 4.0.0 release of this branch for FIPS 140-3 under CMVP
    certificates #5595 and #5596. FIPS builds bundle AWS-LC 4.2.0 from this branch.
  - |
    Upgrade ``rustls`` and its certificate verification dependencies to fix RUSTSEC-2026-0285,
    RUSTSEC-2026-0346, RUSTSEC-2026-0348, RUSTSEC-2026-0349, RUSTSEC-2026-0382, and
    RUSTSEC-2026-0383.
