---
fixes:
  - |
    OTLP logs handled natively now convert non-string attribute values into strings where the Datadog Agent does:
    resource and scope attributes, the body, ``service.name``, and the ``message``, ``status``, and ``ddtags``
    attributes. Such values are no longer dropped or ignored. Bytes become base64 and empty values become empty
    strings. Log attribute arrays stay JSON arrays. As in the Agent, a log is dropped when a NaN or infinite number
    from a log attribute stays in its final properties, because no later value with the same key replaces it.
