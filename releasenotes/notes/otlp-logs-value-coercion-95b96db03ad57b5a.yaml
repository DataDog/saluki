---
fixes:
  - |
    OTLP logs handled natively now convert non-string attribute values into strings where the Datadog Agent does:
    resource and scope attributes, the body, ``service.name``, and the ``message``, ``status``, and ``ddtags``
    attributes. Such values are no longer dropped or ignored. Bytes become base64 and empty values become empty strings. Log
    attribute arrays stay JSON arrays. As in the Agent, a log is dropped when a log attribute holds a NaN or infinite
    number that no resource or scope attribute with the same key overwrites.
