---
fixes:
  - |
    Logs requests now carry the ``DD-PROTOCOL: agent-json``, ``DD-EVP-ORIGIN: agent``, and
    ``DD-EVP-ORIGIN-VERSION`` headers, as the Datadog Agent sends them. The intake then reads only the standard log
    fields of each log, and takes any other attributes from its message. ``DD-EVP-ORIGIN-VERSION`` is the version of
    the Datadog Agent that Agent Data Plane was built for, or Agent Data Plane's own version when that isn't known.
