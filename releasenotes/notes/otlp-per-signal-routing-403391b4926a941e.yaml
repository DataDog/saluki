---
upgrade:
  - |
    ADP now serves only the OTLP signals that are enabled, whether it processes them itself or proxies them to the
    Datadog Agent. Metrics follow ``otlp_config.metrics.enabled`` and traces follow ``otlp_config.traces.enabled``.
    Logs need both ``otlp_config.logs.enabled`` and ``logs_enabled``, as in the Datadog Agent. Before, ADP accepted
    all three signals whenever OTLP ingest was on. A client that sends a signal that isn't enabled gets HTTP 404 or
    gRPC ``UNIMPLEMENTED``. To keep sending OTLP logs, set ``otlp_config.logs.enabled`` and ``logs_enabled`` to
    ``true``.
fixes:
  - |
    Each of ``data_plane.experimental.otlp.proxy.logs``, ``data_plane.experimental.otlp.proxy.metrics``, and
    ``data_plane.experimental.otlp.proxy.traces`` now applies only to its own signal. Before, any of them made ADP
    proxy both OTLP logs and OTLP metrics to the Datadog Agent.
  - |
    A proxied OTLP request now gets the Datadog Agent's response, including its errors and partial successes. Before,
    ADP answered the client before the Agent did, and dropped the errors that the Agent returned. When the Agent
    doesn't answer, the client gets HTTP 502 or gRPC ``UNAVAILABLE``.
  - |
    ADP now proxies OTLP/HTTP requests to the Datadog Agent over HTTP, at
    ``data_plane.experimental.otlp.proxy.agent_receiver_http_endpoint``, and OTLP/gRPC requests over gRPC, at
    ``data_plane.experimental.otlp.proxy.agent_receiver_grpc_endpoint``. Proxied OTLP traces go to the same Agent
    endpoints as the other signals, not to ``otlp_config.traces.internal_port``. Before, ADP proxied every request
    over gRPC.
  - |
    ADP no longer proxies OTLP requests to itself. If a signal is proxied and a proxy endpoint reaches one of ADP's
    own OTLP listeners, ADP logs an error and starts no OTLP ingest. The other pipelines keep running.
