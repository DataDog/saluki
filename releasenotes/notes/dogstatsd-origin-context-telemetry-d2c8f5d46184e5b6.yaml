---
features:
  - |
    Enable ``telemetry.dogstatsd_origin`` to report active DogStatsD aggregation contexts through
    ``aggregator.dogstatsd_contexts_by_origin``. The breakdown is limited to 199 origin groups plus one
    ``origin_overflow:true`` series. Contexts without resolved origin tags are skipped; excess groups and
    groups exceeding 32 tags or 4096 source-tag bytes contribute to overflow. Freed slots admit new contexts,
    while existing contexts keep their original assignment until expiry.
