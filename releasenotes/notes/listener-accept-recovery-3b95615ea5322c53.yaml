fixes:
  - |
    Fix network listeners stopping permanently after a transient failure to accept a connection.
    This affects the DogStatsD source as well as every inbound HTTP and gRPC server, including the
    OTLP receivers and the Prometheus scrape endpoint. A failure specific to a single connection is
    now retried, and a system-wide shortage such as running out of file descriptors is retried with
    a backoff, rather than either one taking the listener out of service for the lifetime of the
    process.
  - |
    A DogStatsD listener that stops for an unrecoverable reason now stops the DogStatsD source
    along with it, rather than leaving the source running while it silently accepts nothing.
