features:
  - |
    Add ``data_plane.experimental.stateful_metrics.additional_endpoints`` to the experimental
    stateful metrics path. Each listed plaintext gRPC intake receives every
    stateful payload using the primary API key. Batches an endpoint could not
    carry are retried only to that endpoint, from a per-endpoint retry lane, so
    an outage on one endpoint does not delay delivery to the others.
    Removing an additional endpoint discards its saved retries at startup with
    a warning, while preserving retries for endpoints that remain configured.
