fixes:
  - |
    Fix HTTP URL obfuscation of trace spans in two cases. With
    ``apm_config.obfuscation.http.remove_paths_with_digits`` enabled, a path segment holding a
    percent-encoded digit such as ``%32`` is now redacted. A relative URL such as
    ``/users/123/profile`` now has its digit segments redacted instead of being replaced with ``?``,
    so the endpoint survives in the trace.
  - |
    A URL that cannot be parsed is no longer replaced with ``?`` when only userinfo removal applies.
    It now keeps everything but its credentials, which are always removed.
  - |
    Obfuscated MongoDB, Elasticsearch, and OpenSearch queries now keep the key order of the query
    they came from, instead of sorting keys alphabetically.
issues:
  - |
    HTTP URL obfuscation of trace spans decodes a percent-escaped unreserved character in the path,
    so a URL such as ``https://example.com/a/%2E%2E/b`` is rewritten to
    ``https://example.com/a/../b`` even when no obfuscation option is enabled. The URL is otherwise
    unaltered and nothing sensitive is exposed.
  - |
    With ``apm_config.obfuscation.http.remove_query_string`` or
    ``apm_config.obfuscation.http.remove_paths_with_digits`` enabled, a URL containing ``[`` or
    ``]`` in its path or fragment is replaced with ``?`` in full, so the endpoint is lost from the
    trace.
