---
security:
  - |
    ADP no longer accepts TLS connections on the OTLP receiver and then proxies the data to the Datadog Agent
    without TLS. If a ``tls`` setting under ``otlp_config.receiver.protocols.grpc`` or
    ``otlp_config.receiver.protocols.http`` has a value, and any of
    ``data_plane.experimental.otlp.proxy.logs``, ``data_plane.experimental.otlp.proxy.metrics``, or
    ``data_plane.experimental.otlp.proxy.traces`` is ``true``, ADP logs an error and starts no OTLP ingest. The other
    pipelines keep running. To start OTLP ingest, remove ``tls`` from the receiver, or set each proxy setting to
    ``false``.
