---
fixes:
  - |
    OTLP logs handled natively now use the ``datadog.log.source`` attribute as the log source, as the Datadog Agent
    does. The value applies when it's a non-empty string after resource and scope attributes overwrite log attributes.
    Resource and scope values of any type count, because they become strings. Otherwise the source stays
    ``otlp_log_ingestion``. The attribute also stays in the log.
