---
upgrade:
  - |
    ADP now listens for OTLP on the addresses in ``otlp_config.receiver.protocols.grpc.endpoint`` and
    ``otlp_config.receiver.protocols.http.endpoint``. Before, ADP ignored these settings. The defaults are
    ``localhost:4317`` and ``localhost:4318``, so the default OTLP ports change from ``localhost:6317`` and
    ``localhost:6318``. An empty endpoint in ``datadog.yaml`` or the Agent configuration stream turns off the receiver
    for that protocol. An empty environment variable counts as unset. If both endpoints are empty, ADP exits at
    startup with an error. To keep the old ports, set ``otlp_config.receiver.protocols.grpc.endpoint`` to
    ``localhost:6317`` and ``otlp_config.receiver.protocols.http.endpoint`` to ``localhost:6318``.
