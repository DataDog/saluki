# OTLP correctness test configuration for summary quantile reporting.
hostname: "correctness-testing"
api_key: dummy-api-key-correctness-testing
health_port: 5555
otlp_config:
  metrics:
    summaries:
      mode: noquantiles
  receiver:
    protocols:
      grpc:
        # No endpoint here. A value in this file reaches ADP over the Agent's configuration stream and
        # overrides the endpoint that the case sets in its environment.
        max_recv_msg_size_mib: 4
