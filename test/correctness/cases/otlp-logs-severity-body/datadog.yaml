# OTLP logs correctness test configuration, shared by the core Agent and Agent Data Plane.
# Using a fixed hostname is both required to avoid errors, and also will ensure consistent tags.
hostname: "correctness-testing"

# Dummy API key.
api_key: dummy-api-key-correctness-testing

# We have to specifically configure the health port to use.
health_port: 5555

# The Agent only builds its OTLP logs pipeline when both the logs agent and OTLP logs are enabled. Set both
# explicitly on both sides rather than relying on defaults.
logs_enabled: true

# Send the Agent's logs to the datadog-intake service over HTTP. The logs agent collects nothing else, since no log
# sources are configured.
logs_config:
  logs_dd_url: "{{ self.connections.intake.host }}:{{ self.connections.intake.port }}"
  logs_no_ssl: true
  force_use_http: true
  # The rules apply to the rendered content of each log, in order. The last three masks match differently in the
  # Agent and ADP, and their differences are listed in the case's known differences.
  processing_rules:
    - type: exclude_at_match
      name: exclude_healthchecks
      pattern: "healthcheck"
    - type: include_at_match
      name: include_kept
      pattern: "keep"
    - type: mask_sequences
      name: mask_cards
      pattern: "card=[0-9]{4}-[0-9]{4}"
      replace_placeholder: "card=[masked]"
    - type: mask_sequences
      name: mask_users
      pattern: "(user=)[a-z]+"
      replace_placeholder: "${1}[masked]"
    - type: mask_sequences
      name: mask_tokens
      pattern: '"token":"[a-z0-9-]+"'
      replace_placeholder: '"token":"[masked]"'
    - type: mask_sequences
      name: mask_words
      pattern: 'word=\w+'
      replace_placeholder: "word=[masked]"
    - type: mask_sequences
      name: mask_refs
      pattern: "(ref=)[a-z]+"
      replace_placeholder: "$01[masked]"
    - type: mask_sequences
      name: mask_bold_tags
      pattern: '\\u003cb\\u003e'
      replace_placeholder: "[tag]"

otlp_config:
  receiver:
    protocols:
      grpc:
        max_recv_msg_size_mib: 4
  logs:
    enabled: true
