description: >-
  ADP's OTLP receiver and the Agent's each receive OTLP logs with every severity and body shape over gRPC, and their
  intakes must hold the same logs, apart from known differences.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      # Handle OTLP logs natively in ADP rather than relaying them to the core Agent. Per-signal proxy flags aren't
      # honored yet, so this turns off the proxy for every signal.
      DD_DATA_PLANE_OTLP_PROXY_ENABLED: "false"
      # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
      # once endpoint ownership prevents both processes from attempting to bind the same ports.
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_http.port }}"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.otlp_grpc, baseline_target: agent.agent_otlp_grpc}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they received while the load stays up.
  - {step: process_stable_for, on: load, duration: 32s}
  - step: compare
    telemetry: logs
    comparison: intake-adp
    baseline: intake-agent
    logs:
      # Every record carries a unique `fixture_id`, so records pair even when a gap changes their message or timestamp.
      identity_fields: ["fixture_id"]
      min_count: 93
      # Every difference ADP shows today, tagged with its gap from the OTLP logs parity plan (DataDog/saluki#2966). Remove
      # an entry in the change that fixes its gap.
      known_differences:
        - gap: gap/observed-timestamp
          paths: ["content.@timestamp", "content.otel.timestamp"]
          kinds: [missing]
          when:
            fixture_id: [timestamp-observed-only]
          reason: ADP doesn't fall back to the observed timestamp.
        - gap: gap/bytes-encoding
          paths: ["content.message"]
          kinds: [value]
          when:
            fixture_id: [body-bytes]
          reason: ADP renders a bytes body as JSON-quoted text instead of base64.
        - gap: gap/as-string-coercion
          paths: ["content.message"]
          kinds: [value]
          when:
            fixture_id: [body-empty]
          reason: ADP renders an empty body as "null" instead of "".
        - gap: gap/missing-headers
          paths:
            - headers.dd-protocol
            - headers.dd-evp-origin
            - headers.dd-evp-origin-version
            - headers.dd-message-timestamp
            - headers.dd-current-timestamp
          kinds: [missing]
          reason: >-
            ADP sends none of the `DD-PROTOCOL`, `DD-EVP-ORIGIN`, `DD-EVP-ORIGIN-VERSION`, `dd-message-timestamp`, and
            `dd-current-timestamp` headers on logs requests.
