type: correctness
runtime: docker
analysis_mode: logs
logs:
  # Every record carries a unique `fixture_id`, so records pair even when a gap changes their message or timestamp.
  identity_fields: ["fixture_id"]
  min_count: 93
  # Every difference ADP shows today, tagged with its gap from the OTLP logs parity plan (DataDog/saluki#2966). Remove
  # an entry in the change that fixes its gap.
  known_differences:
    - gap: gap/content-in-message
      paths: ["content.**"]
      kinds: [location]
      reason: ADP puts properties at the top level instead of in the `message` content.
    - gap: gap/content-in-message
      paths: ["content.status", "content.hostname"]
      kinds: [missing]
      reason: ADP's content holds only `message` and `service`.
    - gap: gap/status-strings
      paths: ["envelope.status"]
      kinds: [value]
      when:
        fixture_id:
          - severity-number-1
          - severity-number-4
          - severity-number-5
          - severity-number-8
          - severity-number-9
          - severity-number-12
          - severity-number-13
          - severity-number-16
          - severity-number-17
          - severity-number-20
          - severity-number-21
          - severity-number-24
          - severity-number-25
          - severity-text-over-number
          - severity-attribute
          - timestamp-observed-only
          - timestamp-and-observed
          - timestamp-neither
          - body-int
          - body-double
          - body-large-double
          - body-bool
          - body-bytes
          - body-map
          - body-array
          - body-empty
          - body-missing
      reason: ADP capitalizes the envelope status instead of sending the Agent's raw or lowercase status.
    - gap: gap/envelope-timestamp
      paths: ["envelope.timestamp"]
      kinds: [missing]
      reason: ADP has no encode-time envelope `timestamp`.
    - gap: gap/zero-severity-status
      paths: ["envelope.status"]
      kinds: [value]
      when:
        fixture_id: [severity-number-0]
      reason: ADP maps severity number 0 to `Trace`; the Agent gives no status, so the envelope says `info`.
    - gap: gap/raw-status-strings
      paths: ["envelope.status"]
      kinds: [value]
      when:
        fixture_id: [severity-text-unknown, status-attribute-unknown]
      reason: ADP drops unrecognized statuses instead of passing them through raw.
    - gap: gap/observed-timestamp
      paths: ["content.@timestamp"]
      kinds: [value]
      when:
        fixture_id: [timestamp-observed-only]
      reason: ADP doesn't fall back to the observed timestamp, and injects the current time instead.
    - gap: gap/observed-timestamp
      paths: ["content.otel.timestamp"]
      kinds: [missing]
      when:
        fixture_id: [timestamp-observed-only]
      reason: ADP doesn't fall back to the observed timestamp.
    - gap: gap/envelope-timestamp
      paths: ["envelope_properties.@timestamp"]
      kinds: [extra]
      when:
        fixture_id: [timestamp-neither]
      reason: ADP injects the current time as `@timestamp` when the record has no timestamp.
    - gap: gap/bytes-encoding
      paths: ["content.message"]
      kinds: [value]
      when:
        fixture_id: [body-bytes]
      reason: ADP renders a bytes body as JSON-quoted text instead of base64.
    - gap: gap/as-string-coercion
      paths: ["content.message"]
      kinds: [value]
      when:
        fixture_id: [body-empty]
      reason: ADP renders an empty body as "null" instead of "".
baseline:
  image: saluki-images/datadog-agent:testing-release
  files:
    - datadog.yaml:/etc/datadog-agent/datadog.yaml
  env:
    DD_API_KEY: correctness-test
comparison:
  image: saluki-images/datadog-agent:testing-release
  files:
    - datadog.yaml:/etc/datadog-agent/datadog.yaml
  env:
    DD_API_KEY: correctness-test
    DD_DATA_PLANE_ENABLED: "true"
    DD_DATA_PLANE_STANDALONE_MODE: "false"
    DD_DATA_PLANE_OTLP_ENABLED: "true"
    # Handle OTLP logs natively in ADP rather than relaying them to the core Agent. Per-signal proxy flags aren't
    # honored yet, so this turns off the proxy for every signal.
    DD_DATA_PLANE_OTLP_PROXY_ENABLED: "false"
    # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
    # once endpoint ownership prevents both processes from attempting to bind the same ports.
    ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:54317"
    ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:54318"
