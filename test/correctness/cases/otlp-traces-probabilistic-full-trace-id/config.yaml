description: >-
  ADP's OTLP receiver and the Agent's each receive the same random OTLP traces with full 128-bit trace IDs over gRPC
  with the probabilistic sampler on, and their intakes must hold the same spans.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "true"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      # ADP binds its own receiver; container initialization moves the Core Agent's.
      # TODO(#2177): Replace this ADP-only override with the canonical schema-provided endpoint key
      # once endpoint ownership prevents both processes from attempting to bind the same port.
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      DD_APM_PROBABILISTIC_SAMPLER_ENABLED: "true"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_APM_PROBABILISTIC_SAMPLER_ENABLED: "true"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.otlp_grpc, baseline_target: agent.agent_otlp_grpc}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they received while the load stays up.
  - {step: process_stable_for, on: load, duration: 32s}
  - step: compare
    telemetry: traces
    comparison: intake-adp
    baseline: intake-agent
    otlp_direct_analysis_mode: true
    # ADP emits http.status_code as a numeric (float) metric, matching the DD agent. For
    # string-typed sources the agent additionally keeps a string copy in meta (separate
    # Meta/Metrics maps); ADP holds only the numeric value, so ignore the agent-only meta variant.
    additional_span_ignore_fields:
      - meta.http.status_code
