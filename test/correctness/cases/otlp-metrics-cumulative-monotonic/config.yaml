description: >-
  ADP's OTLP receiver and the Agent's each receive cumulative monotonic OTLP sums over gRPC, and their intakes must hold
  the same metrics. One sum differs in type, and the other sum is still compared by value.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      DD_AGGREGATE_CONTEXT_LIMIT: "500000"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.otlp_grpc, baseline_target: agent.agent_otlp_grpc}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they aggregated. Waiting slightly longer than an aggregation bucket, with the load running,
  # lets the Agent and ADP flush.
  - {step: process_stable_for, on: load, duration: 32s}
  # ADP sends the fixture's metrics itself, and does not proxy them to the Agent.
  - parallel:
      - step: compare
        telemetry: metrics
        comparison: intake-adp
        baseline: intake-agent
        # The first point of each sum is dropped, so `otlp.cumulative.monotonic` counts the difference of its two
        # points.
        metrics:
          min_series: 2
          series:
            - {name: otlp.cumulative.monotonic, metric_type: count, value: 15}
            - {name: raymond.test.cumulative.as.gauge}
          known_differences:
            - gap: gap/otlp-rate-as-gauge-test-name
              issue: 3406
              paths: [type]
              when: {name: [raymond.test.cumulative.as.gauge]}
              reason: ADP reports this sum as a gauge of its rate, and the Agent reports it as a count
      # The known difference takes the gauge sum out of the comparison, so each side's value is checked here. The
      # Agent counts the difference of the two points, and ADP reports its rate over the ten seconds between them.
      - step: intake_has_metric
        on: intake-agent
        name: raymond.test.cumulative.as.gauge
        metric_type: count
        value: 30
        timeout: 1m
      - step: intake_has_metric
        on: intake-adp
        name: raymond.test.cumulative.as.gauge
        metric_type: gauge
        value: 3
        timeout: 1m
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.cumulative.monotonic"}
        sender: adp
        timeout: 1m
