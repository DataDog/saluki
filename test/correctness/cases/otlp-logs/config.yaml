type: correctness
runtime: docker
analysis_mode: logs
logs:
  min_count: 1000
  # Every difference ADP shows today, tagged with its gap from the OTLP logs parity plan (DataDog/saluki#2966). Remove
  # an entry in the change that fixes its gap.
  known_differences:
    - gap: gap/default-hostname
      paths: ["envelope.hostname"]
      kinds: [value]
      reason: ADP sends an empty hostname instead of falling back to the Agent's hostname when the log has none.
    - gap: gap/attribute-key-case
      paths: ["content.*"]
      kinds: [missing]
      reason: ADP lowercases log attribute keys, so a mixed-case key is missing under its original spelling.
    - gap: gap/attribute-key-case
      paths: ["content.*"]
      kinds: [extra]
      reason: ADP lowercases log attribute keys, so a mixed-case key appears under its lowercased spelling.
    - gap: gap/missing-headers
      paths:
        - headers.dd-protocol
        - headers.dd-evp-origin
        - headers.dd-evp-origin-version
        - headers.dd-message-timestamp
        - headers.dd-current-timestamp
      kinds: [missing]
      reason: >-
        ADP sends none of the `DD-PROTOCOL`, `DD-EVP-ORIGIN`, `DD-EVP-ORIGIN-VERSION`, `dd-message-timestamp`, and
        `dd-current-timestamp` headers on logs requests.
baseline:
  image: saluki-images/datadog-agent:testing-release
  files:
    - datadog.yaml:/etc/datadog-agent/datadog.yaml
  env:
    DD_API_KEY: correctness-test
comparison:
  image: saluki-images/datadog-agent:testing-release
  files:
    - datadog.yaml:/etc/datadog-agent/datadog.yaml
  env:
    DD_API_KEY: correctness-test
    DD_DATA_PLANE_ENABLED: "true"
    DD_DATA_PLANE_STANDALONE_MODE: "false"
    DD_DATA_PLANE_OTLP_ENABLED: "true"
    # Handle OTLP logs natively in ADP rather than relaying them to the core Agent. Proxying any signal also proxies
    # logs, so this turns off the proxy for every signal.
    DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_LOGS: "false"
    DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_METRICS: "false"
    DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_TRACES: "false"
    # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
    # once endpoint ownership prevents both processes from attempting to bind the same ports.
    ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:54317"
    ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:54318"
