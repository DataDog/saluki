# E2E correctness test: DDOT (baseline) vs ADP (comparison), both with the same
# OTTL span filtering. Millstone sends the same traces to both; we assert filtered outputs match.
# Baseline uses the Datadog Distribution of OpenTelemetry (DDOT) from the agent -full image.
# Baseline is OTel-based (DDOT); use OTLP-direct analysis (skip stats comparison, do not require baseline SSI).
# OTel baseline vs ADP: load/agent and pipeline add fields that differ or are absent in the other.
timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    connect: {intake: intake-adp.api}
    config:
      files:
        datadog.yaml: {from: datadog_adp.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "true"
        DD_DATA_PLANE_OTLP_ENABLED: "true"
        # ADP must bind the generator's `4317` target; container initialization moves the Core Agent.
        # TODO(#2177): Replace this ADP-only override with the canonical schema-provided endpoint key
        # once endpoint ownership prevents both processes from attempting to bind the same port.
        ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:4317"
  agent:
    type: agent
    connect: {intake: intake-agent.api}
    config:
      files:
        otel-config.yaml: {from: collector.yaml, template: true}
        datadog.yaml: {from: datadog_agent.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
        DD_OTELCOLLECTOR_ENABLED: "true"
        DD_HOSTNAME: correctness-testing
  intake-adp:
    type: datadog-intake
  intake-agent:
    type: datadog-intake
  load:
    type: millstone
    connect:
      target: adp.otlp_grpc
      baseline_target: agent.otel_otlp_grpc
    config:
      files:
        millstone.yaml: {from: millstone.yaml, template: true}
procedure:
  - step: log_contains
    on: load
    process: baseline
    pattern: Millstone finished sending
    timeout: 15m
  - step: log_contains
    on: load
    process: subject
    pattern: Millstone finished sending
    timeout: 15m
  - step: process_stable_for
    on: load
    duration: 32s
  - step: compare
    kind: traces
    subject: intake-adp
    baseline: intake-agent
    otlp_direct: true
    ignore_fields:
      - agent_metadata.target_tps
      - metrics._top_level
      - metrics._dd.measured
