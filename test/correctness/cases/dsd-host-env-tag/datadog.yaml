# Using a fixed hostname is both required to avoid errors, and also will ensure consistent tags between DSD/ADP.
hostname: "correctness-testing"

# Dummy API key.
api_key: dummy-api-key-correctness-testing

# We have to specifically configure the health port to use.
health_port: 5555

# Point ourselves at the datadog-intake service.
dd_url: "http://datadog-intake:2049"

# Turn off UDP and listen on a UDS socket instead.
dogstatsd_port: 0
dogstatsd_socket: /airlock/metrics.sock

dogstatsd_origin_detection: false
dogstatsd_workers_count: 1

# The purpose of this test case: when the Agent has its own `env` and a client sends a point with a different `env`,
# do DSD and ADP both leave the point with only the client's `env`? Neither should copy the Agent's `env`, or the
# `tags` host tags, onto the point: `expected_tags_duration` is left at its default of 0, so host tags are applied by
# the backend, not inline. `dogstatsd_tags` is applied per-packet by the DSD source in both.
tags: ["lab:adp-boundary", "owner:ubuntu"]
env: lab
dogstatsd_tags: ["lab_team:a"]
