# Both sides process traces with the same trace-agent: the comparison side only adds ADP's APM proxy in front of it, so
# any difference in the spans or APM stats that reach the intake comes from the proxy.
timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    connect: {intake: intake-adp.api}
    config:
      files:
        datadog.yaml: {from: datadog.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "true"
        DD_DATA_PLANE_EXPERIMENTAL_APM_ENABLED: "true"
        DD_DATA_PLANE_EXPERIMENTAL_APM_PROXY_DESTINATION: "http://127.0.0.1:8127"
        # ADP takes over the trace-agent's receiver (TCP and UDS), so the trace-agent has to move to the proxy destination.
        # `ADP_DD_*` variables only reach ADP (see `docker/cont-init.d/99-agent-data-plane.sh`), while the plain variable is
        # seen by the trace-agent.
        #
        # ADP gets a distinct socket path rather than an empty one: `s6-envdir` unsets variables whose value is empty, which
        # would put ADP back on the trace-agent's default socket.
        #
        # TODO: Drop these once the Core Agent moves the trace-agent's receiver itself when the APM proxy is enabled.
        DD_APM_RECEIVER_PORT: "8127"
        ADP_DD_APM_RECEIVER_PORT: "8126"
        ADP_DD_APM_RECEIVER_SOCKET: "/var/run/datadog/adp-apm.socket"
  agent:
    type: agent
    connect: {intake: intake-agent.api}
    config:
      files:
        datadog.yaml: {from: datadog.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
  intake-adp:
    type: datadog-intake
  intake-agent:
    type: datadog-intake
  load:
    type: millstone
    connect:
      target: adp.apm_tcp
      baseline_target: agent.apm_tcp
    config:
      files:
        millstone.yaml: {from: millstone.yaml, template: true}
procedure:
  - step: log_contains
    on: load
    process: baseline
    pattern: Millstone finished sending
    timeout: 15m
  - step: log_contains
    on: load
    process: subject
    pattern: Millstone finished sending
    timeout: 15m
  - step: process_stable_for
    on: load
    duration: 32s
  - step: compare
    kind: traces
    subject: intake-adp
    baseline: intake-agent
