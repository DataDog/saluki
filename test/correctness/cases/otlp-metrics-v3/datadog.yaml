# OTLP correctness test configuration for Agent Data Plane and the Core Agent.
# Using a fixed hostname is both required to avoid errors, and also will ensure consistent tags.
hostname: "correctness-testing"

# Dummy API key.
api_key: dummy-api-key-correctness-testing

# We have to specifically configure the health port to use.
health_port: 5555

# Enable OTLP receiver on gRPC
otlp_config:
  receiver:
    protocols:
      grpc:
        max_recv_msg_size_mib: 4

# Send series with the V3 metrics encoding. The intake is not a Datadog URL, so the default `datadog_only` would send
# series with V2.
use_v3_api:
  series:
    enabled: "true"

# Send sketches with the V3 metrics encoding. The list names the intake because ADP does not read
# `use_v3_api.distributions` (#3091).
serializer_experimental_use_v3_api:
  sketches:
    endpoints:
      - "{{ self.connections.intake.url }}"
