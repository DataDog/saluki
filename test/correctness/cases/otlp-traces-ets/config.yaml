description: >-
  ADP's OTLP receiver and the Agent's each receive the same random OTLP traces over gRPC with error tracking standalone
  on, and their intakes must hold the same spans and APM stats.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      DD_APM_ERROR_TRACKING_STANDALONE_ENABLED: "true"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_APM_ERROR_TRACKING_STANDALONE_ENABLED: "true"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.otlp_grpc, baseline_target: agent.agent_otlp_grpc}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they received while the load stays up.
  - {step: process_stable_for, on: load, duration: 32s}
  # ADP sends the spans and their statistics itself, and does not proxy the traces to the Agent.
  - parallel:
      - step: compare
        telemetry: traces
        comparison: intake-adp
        baseline: intake-agent
        # Error Tracking Standalone keeps the traces without an error, marked as dropped. The intake holds all 2000 traces
        # of the load, as in `otlp-traces`.
        traces:
          min_traces: 2000
          min_spans: 4000
          spans:
            - {service: api-gateway, resource: "GET /api/v1/products/{id}"}
            - {service: api-gateway, resource: "GET /api/v1/products"}
            - {service: product-service, resource: ProductService/GetProduct}
            - {service: product-service, resource: ProductService/ListProducts}
          min_stats_groups: 4
          known_differences:
            # Only `api-gateway` sends HTTP spans, and the load gives their status code as a string.
            - gap: gap/otlp-http-status-code-string
              issue: 3433
              paths: [span.meta.http.status_code]
              kinds: [missing]
              when: {service: [api-gateway]}
              reason: The Agent sends a string HTTP status code in `meta` next to the number. ADP sends the number only.
      - step: intake_from
        on: intake-adp
        telemetry: spans
        select: {service: api-gateway}
        sender: adp
        timeout: 1m
      - step: intake_from
        on: intake-adp
        telemetry: trace_stats
        select: {service: api-gateway}
        sender: adp
        timeout: 1m
