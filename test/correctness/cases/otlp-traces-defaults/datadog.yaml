# Using a fixed hostname is both required to avoid errors, and also will ensure consistent tags.
hostname: "correctness-testing"

# Dummy API key.
api_key: dummy-api-key-correctness-testing

# We have to specifically configure the health port to use.
health_port: 5555

log_level: debug

# Disable process and container collection.
process_config:
  process_collection:
    enabled: false
  container_collection:
    enabled: false

# Keep every trace. The case leaves `apm_config.features` and the top-level settings of `otlp_config.traces` at their
# defaults.
apm_config:
  enabled: true
  target_traces_per_second: 1000000

# Enable OTLP receiver on gRPC
otlp_config:
  receiver:
    protocols:
      grpc:
        endpoint: "0.0.0.0:{{ self.endpoints.agent_otlp_grpc.port }}"
