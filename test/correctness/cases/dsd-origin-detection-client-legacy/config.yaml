description: >-
  The origin fields that a client sends decide the origin of DogStatsD metrics in legacy origin detection, which is the
  default. One metric names the sender's pod with the `dd.internal.entity_id` tag, and another names its container with
  a Local Data container ID. UDS origin detection is off, as it is by default. Both sides must tag each metric with the
  entity it names.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    # The client names a pod and a container in it, which the Agent finds through the kubelet.
    realization: {enclosure: kubernetes-pod}
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: "correctness-test"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_DATA_PLANE_REMOTE_AGENT_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      # The defaults, written out: UDS origin detection is off, and the legacy scheme is in use.
      DD_DOGSTATSD_ORIGIN_DETECTION: "false"
      DD_ORIGIN_DETECTION_UNIFIED: "false"
      # The Agent parses `|c:` only with client origin fields on. It reads `dd.internal.entity_id` without them.
      DD_DOGSTATSD_ORIGIN_DETECTION_CLIENT: "true"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: "correctness-test"
      DD_DOGSTATSD_ORIGIN_DETECTION: "false"
      DD_ORIGIN_DETECTION_UNIFIED: "false"
      DD_DOGSTATSD_ORIGIN_DETECTION_CLIENT: "true"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.dogstatsd_uds, baseline_target: agent.dogstatsd_uds}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they aggregated. Waiting slightly longer than an aggregation bucket, with the load running,
  # lets the Agent and ADP resolve the senders while they flush.
  - {step: process_stable_for, on: load, duration: 32s}
  - step: compare
    telemetry: metrics
    comparison: intake-adp
    baseline: intake-agent
    metrics:
      # A pod-level tag shows that the pod UID resolved, and a container-level tag that the container ID did.
      series:
        - {name: client_origin.pod, tags: [probe:client-origin, pod_phase:running]}
        - {name: client_origin.container, tags: [probe:client-origin, kube_container_name:load]}
