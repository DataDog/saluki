type: correctness
runtime: docker
analysis_mode: logs
logs:
  # Every record carries a unique `fixture_id`, so records pair even when a gap changes their message or timestamp.
  identity_fields: ["fixture_id"]
  min_count: 126
  # Every difference ADP shows today, tagged with its gap from the OTLP logs parity plan (DataDog/saluki#2966). Remove
  # an entry in the change that fixes its gap.
  known_differences:
    - gap: gap/content-in-message
      paths: ["content.**"]
      kinds: [location]
      reason: ADP puts properties at the top level instead of in the `message` content.
    - gap: gap/content-in-message
      paths: ["content.status", "content.hostname"]
      kinds: [missing]
      reason: ADP's content holds only `message` and `service`.
    - gap: gap/envelope-timestamp
      paths: ["envelope.timestamp"]
      kinds: [missing]
      reason: ADP has no encode-time envelope `timestamp`.
    - gap: gap/as-string-coercion
      paths:
        - "content.res_int"
        - "content.res_double"
        - "content.res_bool"
        - "content.res_map"
        - "content.res_array"
        - "content.scope_int"
      kinds: [value]
      when:
        fixture_id: [resource-types]
      reason: ADP keeps native types for resource and scope attributes instead of using `AsString`.
    - gap: gap/as-string-coercion
      paths: ["content.container.image.tags"]
      kinds: [value]
      when:
        fixture_id:
          - tags-image-tags-array
          - tags-image-tags-empty-array
          - tags-image-tags-empty-first
          - tags-image-tags-int-first
          - tags-image-tag-then-tags
          - tags-image-tags-then-tag
          - tags-custom-before-semconv
      reason: ADP keeps an array resource attribute native instead of using `AsString`.
    - gap: gap/as-string-coercion
      paths: ["content.host"]
      kinds: [value]
      when:
        fixture_id: [source-literal-host-int, source-literal-host-bool, source-literal-host-double]
      reason: ADP keeps a non-string resource attribute native instead of using `AsString`.
    - gap: gap/as-string-coercion
      paths: ["envelope.hostname"]
      kinds: [value]
      when:
        fixture_id: [source-literal-host-double]
      reason: ADP doesn't render a double literal `host` with `AsString`, so the hostname falls through to `host.name`.
    - gap: gap/as-string-coercion
      paths: ["content.res_empty"]
      kinds: [missing]
      when:
        fixture_id: [resource-types]
      reason: ADP drops an empty resource attribute instead of rendering "".
    - gap: gap/as-string-coercion
      paths: ["content.service.name"]
      kinds: [value]
      when:
        fixture_id: [service-name-int]
      reason: ADP keeps a non-string `service.name` native instead of using `AsString`.
    - gap: gap/as-string-coercion
      paths: ["envelope.service", "content.service"]
      kinds: [missing]
      when:
        fixture_id: [service-name-int]
      reason: ADP only uses a string `service.name` as the service.
    - gap: gap/scope-metadata
      paths: ["content.otel.scope.name", "content.otel.scope.version"]
      kinds: [missing]
      when:
        fixture_id: [resource-types]
      reason: ADP doesn't set the scope name and version.
    - gap: gap/log-source-attribute
      paths: ["envelope.ddsource"]
      kinds: [value]
      when:
        fixture_id: [log-source-record, log-source-resource]
      reason: ADP doesn't use `datadog.log.source` as the source.
    - gap: gap/host-resolution
      paths: ["envelope.hostname", "envelope.service", "content.service"]
      kinds: [missing]
      when:
        fixture_id: [carry-over-second, carry-over-next-scope]
      reason: ADP doesn't carry the record-level host and service fallbacks over to later records of the resource.
    - gap: gap/default-hostname
      paths: ["envelope.hostname"]
      kinds: [missing]
      when:
        fixture_id:
          - no-host
          - host-localhost
          - source-azure-functions
          - source-azure-app-service
          - source-azure-container-apps
          - source-azure-container-apps-no-replica
          - source-gcp-cloud-run
          - source-gcp-cloud-functions
          - source-gcp-cloud-run-incomplete
          - source-gcp-cloud-run-job
      reason: ADP doesn't fall back to the Agent's hostname when the log has none.
    - gap: gap/missing-headers
      paths:
        - headers.dd-protocol
        - headers.dd-evp-origin
        - headers.dd-evp-origin-version
        - headers.dd-message-timestamp
        - headers.dd-current-timestamp
      kinds: [missing]
      reason: >-
        ADP sends none of the `DD-PROTOCOL`, `DD-EVP-ORIGIN`, `DD-EVP-ORIGIN-VERSION`, `dd-message-timestamp`, and
        `dd-current-timestamp` headers on logs requests.
baseline:
  image: saluki-images/datadog-agent:testing-release
  files:
    - datadog.yaml:/etc/datadog-agent/datadog.yaml
  env:
    DD_API_KEY: correctness-test
comparison:
  image: saluki-images/datadog-agent:testing-release
  files:
    - datadog.yaml:/etc/datadog-agent/datadog.yaml
  env:
    DD_API_KEY: correctness-test
    DD_DATA_PLANE_ENABLED: "true"
    DD_DATA_PLANE_STANDALONE_MODE: "false"
    DD_DATA_PLANE_OTLP_ENABLED: "true"
    # Handle OTLP logs natively in ADP rather than relaying them to the core Agent. Per-signal proxy flags aren't
    # honored yet, so this turns off the proxy for every signal.
    DD_DATA_PLANE_OTLP_PROXY_ENABLED: "false"
    # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
    # once endpoint ownership prevents both processes from attempting to bind the same ports.
    ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:54317"
    ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:54318"
