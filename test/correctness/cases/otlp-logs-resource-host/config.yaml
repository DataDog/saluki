description: >-
  ADP's OTLP receiver and the Agent's each receive OTLP logs whose resource names a host in different ways over gRPC,
  and their intakes must hold the same logs, apart from known differences.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      # Handle OTLP logs natively in ADP rather than relaying them to the core Agent. Per-signal proxy flags aren't
      # honored yet, so this turns off the proxy for every signal.
      DD_DATA_PLANE_OTLP_PROXY_ENABLED: "false"
      # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
      # once endpoint ownership prevents both processes from attempting to bind the same ports.
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_http.port }}"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.otlp_grpc, baseline_target: agent.agent_otlp_grpc}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they received while the load stays up.
  - {step: process_stable_for, on: load, duration: 32s}
  - step: compare
    telemetry: logs
    comparison: intake-adp
    baseline: intake-agent
    logs:
      # Every record carries a unique `fixture_id`, so records pair even when a gap changes their message or timestamp.
      identity_fields: ["fixture_id"]
      min_count: 51
      # Every difference ADP shows today, tagged with its gap from the OTLP logs parity plan (DataDog/saluki#2966). Remove
      # an entry in the change that fixes its gap.
      known_differences:
        - gap: gap/as-string-coercion
          paths:
            - "content.res_int"
            - "content.res_double"
            - "content.res_bool"
            - "content.res_map"
            - "content.res_array"
            - "content.scope_int"
          kinds: [value]
          when:
            fixture_id: [resource-types]
          reason: ADP keeps native types for resource and scope attributes instead of using `AsString`.
        - gap: gap/as-string-coercion
          paths: ["content.res_empty"]
          kinds: [missing]
          when:
            fixture_id: [resource-types]
          reason: ADP drops an empty resource attribute instead of rendering "".
        - gap: gap/as-string-coercion
          paths: ["content.service.name"]
          kinds: [value]
          when:
            fixture_id: [service-name-int]
          reason: ADP keeps a non-string `service.name` native instead of using `AsString`.
        - gap: gap/as-string-coercion
          paths: ["envelope.service"]
          kinds: [value]
          when:
            fixture_id: [service-name-int]
          reason: ADP only uses a string `service.name` as the service, so it sends an empty service.
        - gap: gap/as-string-coercion
          paths: ["content.service"]
          kinds: [missing]
          when:
            fixture_id: [service-name-int]
          reason: ADP only uses a string `service.name` as the service.
        - gap: gap/scope-metadata
          paths: ["content.otel.scope.name", "content.otel.scope.version"]
          kinds: [missing]
          when:
            fixture_id: [resource-types]
          reason: ADP doesn't set the scope name and version.
        - gap: gap/log-source-attribute
          paths: ["envelope.ddsource"]
          kinds: [value]
          when:
            fixture_id: [log-source-record, log-source-resource]
          reason: ADP doesn't use `datadog.log.source` as the source.
        - gap: gap/host-resolution
          paths: ["envelope.hostname", "envelope.service"]
          kinds: [value]
          when:
            fixture_id: [carry-over-second, carry-over-next-scope]
          reason: ADP doesn't carry the record-level host and service fallbacks over to later records of the resource.
        - gap: gap/host-resolution
          paths: ["content.hostname", "content.service"]
          kinds: [missing]
          when:
            fixture_id: [carry-over-second, carry-over-next-scope]
          reason: ADP doesn't carry the record-level host and service fallbacks over to later records of the resource.
        - gap: gap/host-resolution
          paths: ["envelope.hostname"]
          kinds: [value]
          when:
            fixture_id: [host-datadog-over-host-name, host-aws-host-id, host-localhost]
          reason: ADP's logs host resolution only knows ECS Fargate and `host.name`, and doesn't filter `localhost`.
        - gap: gap/host-resolution
          paths: ["content.hostname"]
          kinds: [value]
          when:
            fixture_id: [host-datadog-over-host-name, host-aws-host-id]
          reason: ADP's logs host resolution only knows ECS Fargate and `host.name`.
        - gap: gap/host-resolution
          paths: ["content.hostname"]
          kinds: [extra]
          when:
            fixture_id: [host-localhost]
          reason: ADP's logs host resolution doesn't filter `localhost`.
        - gap: gap/host-resolution
          paths: ["envelope.hostname"]
          kinds: [value]
          when:
            fixture_id: [host-k8s-node-and-cluster, host-id-only]
          reason: ADP's logs host resolution doesn't know `k8s.node.name` or `host.id`.
        - gap: gap/host-resolution
          paths: ["content.hostname"]
          kinds: [missing]
          when:
            fixture_id: [host-k8s-node-and-cluster, host-id-only]
          reason: ADP's logs host resolution doesn't know `k8s.node.name` or `host.id`.
        - gap: gap/missing-headers
          paths:
            - headers.dd-protocol
            - headers.dd-evp-origin
            - headers.dd-evp-origin-version
            - headers.dd-message-timestamp
            - headers.dd-current-timestamp
          kinds: [missing]
          reason: >-
            ADP sends none of the `DD-PROTOCOL`, `DD-EVP-ORIGIN`, `DD-EVP-ORIGIN-VERSION`, `dd-message-timestamp`, and
            `dd-current-timestamp` headers on logs requests.
