description: >-
  ADP and the Agent each receive the same random DogStatsD metrics over a Unix datagram socket with origin detection on,
  seeing the host as legacy containers did, and their intakes must hold the same metrics.
timeout: 8m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    # Origin detection is under test, so each container keeps the environment legacy gave it: the host's PID
    # namespace, and the host view the Agent resolves a sender's container from.
    realization: {enclosure: linux-container, options: {host_pid: true}}
    with: {host_view: true}
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_REMOTE_AGENT_ENABLED: "false"
      DD_DATA_PLANE_USE_NEW_CONFIG_STREAM_ENDPOINT: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_AGGREGATE_CONTEXT_LIMIT: "500000"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    realization: {enclosure: linux-container, options: {host_pid: true}}
    with: {host_view: true}
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    realization: {enclosure: linux-container, options: {host_pid: true}}
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.dogstatsd_uds, baseline_target: agent.dogstatsd_uds}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they aggregated. Waiting slightly longer than an aggregation bucket, with the load running,
  # lets the Agent and ADP resolve the senders while they flush.
  - {step: process_stable_for, on: load, duration: 32s}
  - {step: compare, telemetry: metrics, comparison: intake-adp, baseline: intake-agent}
