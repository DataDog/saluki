timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    connect: {intake: intake-adp.api}
    config:
      files:
        datadog.yaml: {from: datadog.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_REMOTE_AGENT_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
  agent:
    type: agent
    connect: {intake: intake-agent.api}
    config:
      files:
        datadog.yaml: {from: datadog.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
  intake-adp:
    type: datadog-intake
  intake-agent:
    type: datadog-intake
  load:
    type: millstone
    connect:
      target: adp.dogstatsd_uds
      baseline_target: agent.dogstatsd_uds
    config:
      files:
        millstone.yaml: {from: millstone.yaml, template: true}
procedure:
  - step: log_contains
    on: load
    process: baseline
    pattern: Millstone finished sending
    timeout: 15m
  - step: log_contains
    on: load
    process: subject
    pattern: Millstone finished sending
    timeout: 15m
  - step: process_stable_for
    on: load
    duration: 32s
  - step: compare
    kind: metrics
    subject: intake-adp
    baseline: intake-agent
