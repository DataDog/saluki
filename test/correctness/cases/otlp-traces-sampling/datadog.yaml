# OTLP correctness test configuration for Agent Data Plane
# Using a fixed hostname is both required to avoid errors, and also will ensure consistent tags.
hostname: "correctness-testing"

# Dummy API key.
api_key: dummy-api-key-correctness-testing

# We have to specifically configure the health port to use.
health_port: 5555

log_level: debug

# Disable process and container collection.
process_config:
  process_collection:
    enabled: false
  container_collection:
    enabled: false

# Let the samplers decide: no limit on the errors they keep. `max_traces_per_second` is the deprecated name of
# `target_traces_per_second`, and sets the rate of the trace sampler. The analyzed span turns the spans of the
# fixture with this service and name into events.
apm_config:
  enabled: true
  max_traces_per_second: 42
  errors_per_second: 1000000
  analyzed_spans:
    "probe-analytics|otlpprobe.tsamp.038.fixed": 1
  features: ["enable_otlp_compute_top_level_by_span_kind"]

# Enable OTLP receiver on gRPC, and let it keep half of the traces.
otlp_config:
  receiver:
    protocols:
      grpc:
        endpoint: "0.0.0.0:{{ self.endpoints.agent_otlp_grpc.port }}"
  traces:
    enable_otlp_compute_top_level_by_span_kind: true
    probabilistic_sampler:
      sampling_percentage: 50
