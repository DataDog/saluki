description: >-
  ADP's APM proxy in front of the trace-agent and the Agent's trace-agent alone each receive the same random traces
  over a Unix socket, and their intakes must hold the same spans and APM stats.
timeout: 8m
subject_os: [linux]
# Same as `apm-trace`, but traces travel over Unix domain sockets: millstone sends to the trace-agent's socket on the
# baseline side and to ADP's APM proxy socket on the comparison side, and the proxy forwards to the trace-agent's
# socket. Both sides process traces with the same trace-agent, so any difference in the spans or APM stats that reach
# the intake comes from the proxy.
#
# The trace-agent and ADP find a tracer's container from its socket peer credentials, so every container keeps the
# environment legacy gave it: the host's PID namespace, and the host view on both sides.
participants:
  adp:
    type: agent-adp
    subject: true
    realization: {enclosure: linux-container, options: {host_pid: true}}
    with: {host_view: true}
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      # Not standalone: ADP needs the Core Agent's workload data to find the container of a tracer from its socket peer
      # credentials, as the trace-agent does on the baseline side. The same settings as `dsd-origin-detection`.
      DD_DATA_PLANE_REMOTE_AGENT_ENABLED: "false"
      DD_DATA_PLANE_USE_NEW_CONFIG_STREAM_ENDPOINT: "false"
      DD_DATA_PLANE_EXPERIMENTAL_APM_ENABLED: "true"
      DD_DATA_PLANE_EXPERIMENTAL_APM_PROXY_DESTINATION: "unix:///var/run/datadog/apm.socket"
      # ADP takes over the trace-agent's receiver, so the two have to listen on different sockets. `ADP_DD_*` variables
      # only reach ADP (see `docker/cont-init.d/99-agent-data-plane.sh`): the trace-agent keeps its default socket,
      # which ADP proxies to, and ADP takes the shared socket that millstone sends to.
      #
      # The trace-agent's socket is deliberately left unset rather than set with the plain variable: ADP reads the Core
      # Agent's configuration, where an explicitly set `apm_config.receiver_socket` overrides ADP's own.
      #
      # ADP's TCP listener is disabled so it leaves the trace-agent's port alone. `0` is non-empty, so `s6-envdir`
      # keeps it.
      #
      # TODO: Drop these once the Core Agent moves the trace-agent's receiver itself when the APM proxy is enabled.
      ADP_DD_APM_RECEIVER_SOCKET: "{{ self.endpoints.apm_uds.path }}"
      ADP_DD_APM_RECEIVER_PORT: "0"
    files:
      datadog.yaml: datadog.yaml
    connect: {intake: intake-adp.api}
  agent:
    type: agent
    realization: {enclosure: linux-container, options: {host_pid: true}}
    with: {host_view: true}
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      # Listen on the case's shared volume, where millstone can reach the socket.
      DD_APM_RECEIVER_SOCKET: "{{ self.endpoints.apm_uds.path }}"
    files:
      datadog.yaml: datadog.yaml
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}
  load:
    type: millstone
    realization: {enclosure: linux-container, options: {host_pid: true}}
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.apm_uds, baseline_target: agent.apm_uds}
procedure:
  - {step: log_contains, on: load, process: comparison, pattern: Millstone finished sending, timeout: 5m}
  - {step: log_contains, on: load, process: baseline, pattern: Millstone finished sending, timeout: 1m}
  # Both sides flush what they received while the load stays up.
  - {step: process_stable_for, on: load, duration: 32s}
  - {step: compare, telemetry: traces, comparison: intake-adp, baseline: intake-agent}
