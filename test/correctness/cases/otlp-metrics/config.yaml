timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    connect: {intake: intake-adp.api}
    config:
      files:
        datadog.yaml: {from: datadog.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_OTLP_ENABLED: "true"
        # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
        # once endpoint ownership prevents both processes from attempting to bind the same ports.
        ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:54317"
        ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:54318"
        DD_AGGREGATE_CONTEXT_LIMIT: "500000"
  agent:
    type: agent
    connect: {intake: intake-agent.api}
    config:
      files:
        datadog.yaml: {from: datadog-baseline.yaml, template: true}
      env:
        DD_API_KEY: correctness-test
  intake-adp:
    type: datadog-intake
  intake-agent:
    type: datadog-intake
  load:
    type: millstone
    connect:
      target: adp.otlp_grpc
      baseline_target: agent.agent_otlp_grpc
    config:
      files:
        millstone.yaml: {from: millstone.yaml, template: true}
procedure:
  - step: log_contains
    on: load
    process: baseline
    pattern: Millstone finished sending
    timeout: 15m
  - step: log_contains
    on: load
    process: subject
    pattern: Millstone finished sending
    timeout: 15m
  - step: process_stable_for
    on: load
    duration: 32s
  - step: compare
    kind: metrics
    subject: intake-adp
    baseline: intake-agent
