[package]
name = "antithesis-intake"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[[bin]]
name = "antithesis-intake"
path = "src/bin/intake.rs"

[features]
# The two differential oracle routes and their assertions. Off by default because the SDK catalogues an
# assertion at link time through a `linkme` distributed slice, so a call site compiled into a binary is
# catalogued whether or not it ever runs, and a catalogued assertion nothing hits reds the run. The general
# scenario builds this same binary and posts to neither oracle, so those call sites must not be linked in.
differential = []

[lints]
workspace = true

[dependencies]
antithesis_sdk = { workspace = true, features = ["full"] }
anyhow = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { workspace = true, features = ["derive", "env", "error-context", "help", "std", "usage"] }
datadog-protos = { workspace = true }
harness = { path = "../harness" }
headers = { workspace = true }
http-body-util = { workspace = true }
mime = { workspace = true }
protobuf = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
] }
tower = { workspace = true }
tower-http = { workspace = true, features = [
  "decompression-deflate",
  "decompression-gzip",
  "decompression-zstd",
  "limit",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "ansi",
  "env-filter",
  "fmt",
  "local-time",
  "registry",
  "std",
  "tracing-log",
] }

[dev-dependencies]
async-compression = { workspace = true, features = ["zstd", "tokio"] }
proptest = { workspace = true }
tower = { workspace = true, features = ["util"] }
zstd = { workspace = true }
