name: saluki

services:
  intake:
    container_name: intake
    hostname: intake
    platform: linux/amd64
    init: true
    build:
      context: ../../../..
      dockerfile: test/antithesis/scenarios/general/Dockerfile
      target: intake
    image: intake:${ANTITHESIS_IMAGE_TAG:-latest}
    environment:
      NO_COLOR: "1"
    healthcheck:
      # antithesis-intake serves HTTP on :2049. /dev/tcp avoids needing curl in the image.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2049'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Single SUT: converged Datadog Agent with the data plane ON, so the embedded
  # instrumented ADP owns DogStatsD. The workload points the liveness check at
  # `agent` via ADP_API_ADDR.
  agent:
    container_name: agent
    hostname: agent
    platform: linux/amd64
    build:
      context: ../../../..
      dockerfile: test/antithesis/scenarios/general/Dockerfile
      target: datadog-agent
    image: datadog-agent:${ANTITHESIS_IMAGE_TAG:-latest}
    environment:
      NO_COLOR: "1"
      DD_API_KEY: "antithesis-test-api-key"
      DD_DD_URL: "http://intake:2049"
      ADP_DD_DD_URL: "http://intake:2049"
      DD_HOSTNAME: "antithesis-adp"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      AGENT_CONFIG_DIR: "/agent-config"
      DD_IPC_CERT_FILE_PATH: "/ipc-auth/ipc_cert.pem"
    volumes:
      - dogstatsd-socket:/var/run/datadog
      # first_sample_config writes the sampled config, driver metadata, and ready sentinel last. The Agent's init waits
      # for that sentinel before startup, so it only needs read access to this workload-owned volume.
      - agent-config:/agent-config:ro
      # The Agent supports ipc_cert_file_path and creates or retrieves the IPC certificate and private key at this path.
      - ipc-auth:/ipc-auth
    depends_on:
      intake:
        condition: service_healthy

  workload:
    container_name: workload
    hostname: workload
    platform: linux/amd64
    init: true
    build:
      context: ../../../..
      dockerfile: test/antithesis/scenarios/general/Dockerfile
      target: workload
    image: workload:${ANTITHESIS_IMAGE_TAG:-latest}
    environment:
      NO_COLOR: "1"
      ADP_DOGSTATSD_SOCKET: "/var/run/datadog/dsd.socket"
      INTAKE_ADDR: "intake:2049"
      ADP_API_ADDR: "agent:5100"
      # Privileged API where /dogstatsd/stats lives, authenticated with the shared IPC mTLS identity.
      ADP_SECURE_API_ADDR: "agent:5101"
      IPC_CERT_PATH: "/ipc-auth/ipc_cert.pem"
    volumes:
      - dogstatsd-socket:/var/run/datadog
      - agent-config:/agent-config
      # The IPC identity can appear after setup, so polling records false readiness observations until it exists. The
      # workload may read its certificate/private key but cannot modify it; auth_token is not stored in this volume.
      - ipc-auth:/ipc-auth:ro
    depends_on:
      intake:
        condition: service_healthy

volumes:
  dogstatsd-socket:
  agent-config:
  ipc-auth:
