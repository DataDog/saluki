# Issue #1331: bind_host support — test 2 of 3 (bind_host is used)
#
# The core agent reads `bind_host` from config to determine which address
# DogStatsD binds to. When bind_host is set and non_local_traffic is false,
# the core agent binds to the specified address instead of localhost.
#
# ADP must match this behavior. This test sets bind_host to the container's
# own address (`with.own_ip` writes it into DD_BIND_HOST at startup) and
# verifies the listener binds to that address. The container's address is
# guaranteed to be neither 127.0.0.1 nor 0.0.0.0, which proves bind_host was
# actually read from config and used — not just coincidentally matching a
# hardcoded default.

description: "Verifies DogStatsD binds to the address specified by bind_host"
timeout: 120s
# Not run on macOS: a host process has no address of its own to bind to.
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-dsd-bind-host"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
    with:
      own_ip: {env: [DD_BIND_HOST]}

procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"udp://{{ adp.ip }}:{{ adp.endpoints.dogstatsd_udp.port }}"'
    timeout: 60s
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 10s}
