# Issue #1331: bind_host support — bind_host is used.
# The participant resolves its own container IP before either product starts.
# Binding that non-loopback address proves ADP reads bind_host rather than a default.

name: "dogstatsd-bind-host"
description: "Verifies DogStatsD binds to the address specified by bind_host"
timeout: 120s
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-bind-host"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_BIND_HOST: "{{ self.late.ip }}"

procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"udp://{{ adp.late.ip }}:58125"'
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
