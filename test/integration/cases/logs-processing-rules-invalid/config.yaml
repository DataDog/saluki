# Verify that ADP doesn't start when the logs agent is enabled and a logs processing rule is invalid, as the core
# Agent doesn't.
#
# The rules are set through the environment, which also covers the JSON form of `logs_config.processing_rules`.

type: integration
name: "logs-processing-rules-invalid"
description: "Verify ADP exits on an invalid logs processing rule when the logs agent is enabled"
timeout: 120s
runtimes: [linux, mac, windows]

env:
  DD_API_KEY: "00000000000000000000000000000000"
  DD_HOSTNAME: "integration-test-logs-processing-rules-invalid"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "true"
  DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
  DD_LOGS_ENABLED: "true"
  DD_LOGS_CONFIG_PROCESSING_RULES: '[{"type": "exclude_at_match", "name": "no_pattern"}]'

procedure:
  - assertion: log_contains
    pattern: "Invalid processing rules: no pattern provided for processing rule: no_pattern"
    timeout: 60s
  - assertion: adp_exits_with
    expected_code: 1
    timeout: 60s
