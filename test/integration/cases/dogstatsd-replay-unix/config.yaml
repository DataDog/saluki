name: "dogstatsd-replay-unix"
description: "Verifies Unix DogStatsD capture and replay through a Unix datagram socket"
timeout: 150s
subject_os: [linux, macos]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-replay-unix"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DOGSTATSD_PORT: "0"
        DD_DOGSTATSD_SOCKET: "{{ self.facts.shared_dir }}/dsd.sock"

procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"unixgram://{{ adp.facts.shared_dir }}/dsd.sock"'
    timeout: 30s
  - step: dogstatsd_replay
    on: adp
    endpoint: dogstatsd_uds
    # Separate sends exercise capture across connections, with a one-second gap.
    payloads:
      - data: "integration.replay.unix.one:1|c"
      - data: "integration.replay.unix.two:1|c"
        after: 1s
    capture_duration: 3s
    stats_duration: 3s
    expected_metrics:
      - "integration.replay.unix.one"
      - "integration.replay.unix.two"
    timeout: 30s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
