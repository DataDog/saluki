name: "liveness-container-tags"
description: "Verifies connected ADP forwards container-tagged liveness telemetry to intake"
timeout: 180s
subject_os: [linux]

# The fake Docker API supplies metadata only for ADP's container ID. Sharing the host cgroup
# namespace lets ADP discover that ID from /proc/self/cgroup, while the Agent's remote tagger
# supplies the container tags. The intake receives the real v1-series and gzip payloads.
participants:
  intake:
    type: datadog-intake
  # ADP is created first to supply its ID, then waits for this fixture's socket before starting.
  docker-api:
    type: fixture
    config:
      files: {files/: fixture}
      params:
        command: [python3, "{{ self.facts.files_dir }}/fake_docker.py",
                  "{{ adp.late.container_id }}", "{{ self.facts.shared_dir }}/docker.sock"]
        endpoints: {api: {unix: "{{ self.facts.shared_dir }}/docker.sock"}}
  adp:
    type: agent-adp
    subject: true
    realization: {kind: linux-container, options: {host_cgroup_namespace: true}}
    connect: {intake: intake.api, docker_api: docker-api.api}
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-liveness-container-tags"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_BASIC_TELEMETRY_ADD_CONTAINER_TAGS: "true"
        DD_USE_V2_API_SERIES: "false"
        DD_SERIALIZER_COMPRESSOR_KIND: "gzip"

procedure:
  - step: exec
    on: docker-api
    argv: [python3, "{{ docker-api.facts.files_dir }}/test_fake_docker.py"]
    timeout: 30s
  - step: intake_has_metric
    on: intake
    name: datadog.agent_data_plane.running
    metric_type: gauge
    value: 1
    tags: ["host:integration-test-liveness-container-tags", "docker_image:example/adp-liveness:1.0", "env:liveness-fake"]
    tag_patterns: ["^version:.+"]
    # Value and freshness must come from the same latest gauge point, without excessive future skew.
    max_age: 30s
    timeout: 60s
  - step: intake_has_service_check
    on: intake
    name: datadog.agent_data_plane.up
    status: 0
    hostname: integration-test-liveness-container-tags
    tags: ["docker_image:example/adp-liveness:1.0", "env:liveness-fake"]
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
