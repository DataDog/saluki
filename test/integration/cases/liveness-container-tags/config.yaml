description: "Verifies connected ADP forwards container-tagged liveness telemetry to intake"
timeout: 120s
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    # Under test: ADP resolves its own container ID from `/proc/self/cgroup`, which names the
    # container only in the host's cgroup namespace.
    realization: {enclosure: linux-container, options: {host_cgroup_namespace: true}}
    command:
      - "/opt/datadog-agent/embedded/bin/python3"
      - "/liveness-container-tags/run_liveness_test.py"
    # The script replaces the image's entrypoint and starts s6 itself, so s6 still writes ADP's and
    # the Agent's exit records and logs.
    processes:
      - {name: script, exit: container, output: container}
      - {name: adp, exit: {record: data-plane}, output: {file: adp.log}}
      - {name: agent, exit: {record: agent}, output: {file: agent.log}}
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-liveness-container-tags"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_BASIC_TELEMETRY_ADD_CONTAINER_TAGS: "true"
      # The script's own Docker API and intake, which the case connects to no participant.
      DOCKER_HOST: "unix:///tmp/adp-liveness-docker.sock"
      DD_DD_URL: "http://127.0.0.1:18080"
      DD_USE_V2_API_SERIES: "false"
      DD_SERIALIZER_COMPRESSOR_KIND: "gzip"
    files:
      /liveness-container-tags/run_liveness_test.py: run_liveness_test.py
      /liveness-container-tags/test_run_liveness_test.py: test_run_liveness_test.py

procedure:
  - step: exec
    on: adp
    command:
      - "/opt/datadog-agent/embedded/bin/python3"
      - "/liveness-container-tags/test_run_liveness_test.py"
    timeout: 30s
  - step: file_contains
    on: adp
    path: "/tmp/adp-liveness-running-validated"
    pattern: "validated"
    timeout: 60s
  - step: file_contains
    on: adp
    path: "/tmp/adp-liveness-up-validated"
    pattern: "validated"
    timeout: 60s
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 10s}
