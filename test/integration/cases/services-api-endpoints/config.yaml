type: integration
name: "services-api-endpoints"
description: "Verifies the APM relay serves the legacy /services endpoints"
timeout: 120s
runtimes: [linux, mac, windows]

env:
  DD_API_KEY: "00000000000000000000000000000000"
  DD_HOSTNAME: "integration-test-services"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_EXPERIMENTAL_APM_ENABLED: "true"
  DD_APM_ENABLED: "false"
  DD_APM_NON_LOCAL_TRAFFIC: "true"

container:
  exposed_ports:
    - "58126/tcp"

procedure:
  - parallel:
      - assertion: process_stable_for
        duration: 60s
      - assertion: http_check
        endpoint: "http://localhost:58126/services"
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - assertion: http_check
        endpoint: "http://localhost:58126/v0.1/services"
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - assertion: http_check
        endpoint: "http://localhost:58126/v0.2/services"
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - assertion: http_check
        endpoint: "http://localhost:58126/v0.3/services"
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - assertion: http_check
        endpoint: "http://localhost:58126/v0.4/services"
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 60s

