description: "Verifies the APM relay serves the legacy /services endpoints"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-services"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_EXPERIMENTAL_APM_ENABLED: "true"
      DD_APM_ENABLED: "false"
      DD_APM_NON_LOCAL_TRAFFIC: "true"

procedure:
  - parallel:
      - step: process_stable_for
        on: adp
        process: adp
        duration: 10s
      - step: http_check
        on: adp
        endpoint: apm_tcp
        path: /services
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: apm_tcp
        path: /v0.1/services
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: apm_tcp
        path: /v0.2/services
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: apm_tcp
        path: /v0.3/services
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: apm_tcp
        path: /v0.4/services
        status:
          equal: 200
        body:
          equal: "OK\n"
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
