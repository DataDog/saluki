type: integration
name: "privileged-api-endpoints"
description: "Executes privileged API routes through the ADP CLI to verify authenticated mTLS access after the workers assert them dynamically."
timeout: 120s
runtimes: [linux, mac, windows]

env:
  DD_API_KEY: "00000000000000000000000000000000"
  DD_HOSTNAME: "integration-test-privileged-api"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "false"
  DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"

container:
  exposed_ports:
    - "55101/tcp"

procedure:
  # Docker's host proxy can accept connections before the target ADP is ready. Wait for ADP's
  # completed startup before invoking its CLI against the privileged API.
  - assertion: log_contains
    pattern: "Agent Data Plane running."
    timeout: 60s

  # The ADP CLI loads the target's configuration and IPC certificate, so these commands
  # authenticate with mTLS and execute each privileged route instead of probing route registration.
  - action: adp_cli
    args: ["config"]
    timeout: 30s
  - action: adp_cli
    args: ["debug", "set-log-level", "--filter-directives", "INFO", "--duration-secs", "30"]
    timeout: 30s
  - action: adp_cli
    args: ["debug", "reset-log-level"]
    timeout: 30s
  - action: adp_cli
    args: ["debug", "set-metric-level", "--level", "INFO", "--duration-secs", "30"]
    timeout: 30s
  - action: adp_cli
    args: ["debug", "reset-metric-level"]
    timeout: 30s

  # The supervision tree is served from the privileged API and rendered by the CLI. Asserting on the root
  # supervisor's name proves the whole path worked: the route was asserted, mTLS succeeded, a snapshot was taken, and
  # it decoded into something renderable.
  - action: adp_cli
    args: ["debug", "runtime", "show-processes"]
    output_contains: "Supervision tree for 'adp-root'"
    timeout: 30s

  # The topology runs inside a worker that drives its own supervisor, so its subtree is only reachable if that
  # attachment works. Its absence is the difference between reporting the whole process and reporting a fraction of
  # it, so assert on a process that can only appear through it.
  - action: adp_cli
    args: ["debug", "runtime", "show-processes"]
    output_contains: "topology.primary"
    timeout: 30s

  # The dedicated-runtime control plane lives on its own OS thread, so it is only visible if the tree can be read
  # across that boundary.
  - action: adp_cli
    args: ["debug", "runtime", "show-processes"]
    output_contains: "ctrl-pln"
    timeout: 30s

  - action: adp_cli
    args: ["debug", "runtime", "show-processes", "--json"]
    output_contains: "\"resource_tracking_enabled\":true"
    timeout: 30s

  - action: adp_cli
    args: ["debug", "runtime", "show-processes", "--format", "dot"]
    output_contains: "digraph supervision_tree"
    timeout: 30s

  - parallel:
      - assertion: process_stable_for
        duration: 10s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 10s
