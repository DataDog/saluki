name: "dogstatsd-top"
description: "Verifies retained DogStatsD contexts through the privileged API, online CLI, and offline Agent-compatible artifact"
timeout: 180s
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dogstatsd-top"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      # Produced by Datadog Agent 7.80.3 `dogstatsd dump-contexts`; the NDJSON file is the exact
      # decompressed content of the zstd artifact.
      files: {files/: files}

procedure:
  - parallel:
      - step: log_contains
        on: adp
        pattern: 'listen_addr:"udp://[^"]+:58125" \| DogStatsD listener started\.'
        regex: true
        timeout: 60s
      - step: log_contains
        on: adp
        pattern: "Agent Data Plane running."
        timeout: 60s
  - step: exec
    on: adp
    argv:
      - "/opt/datadog-agent/embedded/bin/python3"
      - "{{ adp.facts.files_dir }}/run_dogstatsd_top_test.py"
    timeout: 90s
  - step: file_contains
    on: adp
    path: "/tmp/dogstatsd-top-integration-result"
    pattern: "passed"
    timeout: 10s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
