description: "Verifies retained DogStatsD contexts through the privileged API, online CLI, and offline Agent-compatible artifact"
timeout: 180s
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-dogstatsd-top"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
    os:
      linux:
        files:
          # Produced by Datadog Agent 7.80.3 `dogstatsd dump-contexts`; the NDJSON file is the exact
          # decompressed content of the zstd artifact.
          /dogstatsd-top/: linux/
      windows:
        files:
          "C:/dogstatsd-top/": windows/

procedure:
  - parallel:
      - step: log_contains
        on: adp
        process: adp
        pattern: ':{{ adp.endpoints.dogstatsd_udp.port }}" | DogStatsD listener started.'
        timeout: 60s
      - {step: log_contains, on: adp, pattern: "Agent Data Plane running.", timeout: 60s}
  - step: exec
    on: adp
    env:
      DOGSTATSD_PORT: "{{ adp.endpoints.dogstatsd_udp.port }}"
    timeout: 90s
    os:
      linux:
        command: [/opt/datadog-agent/embedded/bin/python3, /dogstatsd-top/run_dogstatsd_top_test.py]
      windows:
        command: [pwsh, -NoProfile, -NonInteractive, -File, 'C:\dogstatsd-top\run_dogstatsd_top_test.ps1']
  - step: file_contains
    on: adp
    pattern: "passed"
    timeout: 10s
    os:
      linux: {path: /tmp/dogstatsd-top-integration-result}
      windows: {path: 'C:\dogstatsd-top-result'}
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 10s}
