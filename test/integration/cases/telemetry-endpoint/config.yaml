description: "Verifies only the internal metrics route is exposed on the unprivileged API endpoint"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-telemetry"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"

procedure:
  # Make sure the process becomes healthy and serves only the metrics route on the unprivileged API.
  - parallel:
      - step: process_stable_for
        on: adp
        process: adp
        duration: 10s
      - step: port_listening
        on: adp
        endpoint: api
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: api
        path: /metrics
        status:
          equal: 200
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: api
        path: /compat/metrics
        status:
          equal: 404
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
