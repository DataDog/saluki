type: integration
name: "dogstatsd-replay-windows"
description: "Verifies Windows DogStatsD named-pipe capture and replay"
timeout: 150s
runtimes: [windows]

env:
  DD_API_KEY: "00000000000000000000000000000000"
  DD_HOSTNAME: "integration-test-dsd-replay-windows"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "false"
  DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
  DD_DOGSTATSD_PORT: "0"
  DD_DOGSTATSD_PIPE_NAME: "datadog-dogstatsd-replay-integration"
  DD_DOGSTATSD_EOL_REQUIRED: "named_pipe"

procedure:
  - assertion: log_contains
    pattern: 'listen_addr:"npipe://datadog-dogstatsd-replay-integration"'
    timeout: 30s
  - action: dogstatsd_replay
    sender:
      - "pwsh"
      - "-NoProfile"
      - "-NonInteractive"
      - "-Command"
      - |
        $ErrorActionPreference = "Stop"
        Set-StrictMode -Version 3.0

        $pipe = [System.IO.Pipes.NamedPipeClientStream]::new(
          ".",
          "datadog-dogstatsd-replay-integration",
          [System.IO.Pipes.PipeDirection]::Out
        )
        try {
          $pipe.Connect(30000)
          $payload = [System.Text.Encoding]::UTF8.GetBytes(
            "integration.replay.windows.one:1|c`nintegration.replay.windows.two:1|c`n"
          )
          $pipe.Write($payload, 0, $payload.Length)
          $pipe.Flush()
        } finally {
          $pipe.Dispose()
        }
    capture_duration: 3s
    stats_duration_secs: 3
    expected_metrics:
      - "integration.replay.windows.one"
      - "integration.replay.windows.two"
    timeout: 30s
  - parallel:
      - assertion: process_stable_for
        duration: 10s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 10s
