# Issue #1331: bind_host support — hostname resolution test
#
# The core agent passes `bind_host` through net.ResolveUDPAddr, which accepts
# either an IP literal or a hostname (resolved via /etc/hosts + DNS). ADP must
# match this: bind_host="agent.internal" should resolve via DNS at startup and
# bind to the resolved IP.
#
# This test proves the hostname path works end-to-end:
#   1. `with.own_ip.hosts` adds an entry to the container's hosts file mapping
#      "foo.local" to the container's own address, before anything starts.
#   2. DD_BIND_HOST is "foo.local" — a hostname, not an IP.
#   3. ADP's resolve_bind_host calls lookup_host, which consults the hosts
#      file and gets the container's address.
#   4. The listener binds to that address, logged as listen_addr.
#   5. The step matches the same address, `{{ adp.ip }}`.
#
# If bind_host were only accepting IP literals, the test would fail at step 3
# because "foo.local" doesn't parse as an IP.

description: "Verifies DogStatsD resolves a custom hostname in bind_host via DNS"
timeout: 120s
# Not run on macOS: a host process has no address of its own to bind to.
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-dsd-bind-host-hostname"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_BIND_HOST: "foo.local"
    with:
      own_ip: {hosts: [foo.local]}

procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"udp://{{ adp.ip }}:{{ adp.endpoints.dogstatsd_udp.port }}"'
    timeout: 60s
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 10s}
