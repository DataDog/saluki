# Issue #1331: bind_host support — hostname resolution.
# extra_hosts maps foo.local to the participant's own container IP before startup.
# ADP must resolve the hostname and bind that address, not require an IP literal.

name: "dogstatsd-bind-custom-hostname"
description: "Verifies DogStatsD resolves a custom hostname in bind_host via DNS"
timeout: 120s
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-bind-host-hostname"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_BIND_HOST: foo.local
      params:
        extra_hosts: {foo.local: self}

procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"udp://{{ adp.late.ip }}:58125"'
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
