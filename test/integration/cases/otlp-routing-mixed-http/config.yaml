description: >-
  With ADP proxying OTLP metrics to the Agent and handling OTLP traces and logs itself, each signal sent over HTTP
  reaches the intake from its own sender: the metrics from the Agent, and the traces, their statistics and the logs
  from ADP. The Agent answers the proxied metrics at a relocation address that is not the default.
timeout: 5m
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-otlp-routing-mixed-http"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_METRICS: "true"
      # The Agent and ADP both read these. Proxied metrics reaching the intake from the Agent shows that ADP uses the
      # HTTP address, and an Agent that starts without a relocation conflict shows that the gRPC address is valid.
      DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_AGENT_RECEIVER_GRPC_ENDPOINT: "127.0.0.1:34319"
      DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_AGENT_RECEIVER_HTTP_ENDPOINT: "127.0.0.1:34320"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake.api}
  intake: {type: datadog-intake}
  send-metrics-http:
    image: saluki-images/correctness-tools:latest
    command: [/usr/local/bin/millstone, /etc/millstone/sender.yaml, --completion-file, /tmp/sent]
    files:
      /etc/millstone/sender.yaml: {from: millstone-metrics-http.yaml, template: true}
    connect: {otlp: adp.otlp_http}
  send-traces-http:
    image: saluki-images/correctness-tools:latest
    command: [/usr/local/bin/millstone, /etc/millstone/sender.yaml, --completion-file, /tmp/sent]
    files:
      /etc/millstone/sender.yaml: {from: millstone-traces-http.yaml, template: true}
    connect: {otlp: adp.otlp_http}
  send-logs-http:
    image: saluki-images/correctness-tools:latest
    command: [/usr/local/bin/millstone, /etc/millstone/sender.yaml, --completion-file, /tmp/sent]
    files:
      /etc/millstone/sender.yaml: {from: millstone-logs-http.yaml, template: true}
    connect: {otlp: adp.otlp_http}

procedure:
  # ADP listens, and the Agent moves its receivers to the relocation addresses.
  - parallel:
      - step: log_contains
        on: adp
        process: adp
        pattern: 'listen_addr:"tcp://0.0.0.0:{{ adp.endpoints.otlp_http.port }}",tls_enabled:false | HTTP server started.'
        timeout: 60s
      - step: log_contains
        on: adp
        process: agent
        pattern: 'Relocating Agent OTLP/http receiver from "0.0.0.0:{{ adp.endpoints.otlp_http.port }}" to "127.0.0.1:34320"'
        timeout: 60s
      - step: log_contains
        on: adp
        process: agent
        pattern: 'Relocating Agent OTLP/grpc receiver from "[^"]*" to "127\.0\.0\.1:34319"'
        regex: true
        timeout: 60s
  - parallel:
      - {step: log_contains, on: send-metrics-http, pattern: "Millstone finished sending", timeout: 2m}
      - {step: log_contains, on: send-traces-http, pattern: "Millstone finished sending", timeout: 2m}
      - {step: log_contains, on: send-logs-http, pattern: "Millstone finished sending", timeout: 2m}
  - parallel:
      - step: intake_from
        on: intake
        telemetry: metrics
        select: {name_prefix: "otlp.routing.mixed-http.http."}
        sender: agent
        count: 3
        timeout: 2m
      - step: intake_from
        on: intake
        telemetry: spans
        select: {service: otlp-routing-mixed-http-http}
        sender: adp
        count: 3
        timeout: 2m
      - step: intake_from
        on: intake
        telemetry: trace_stats
        select: {service: otlp-routing-mixed-http-http}
        sender: adp
        timeout: 2m
      - step: intake_from
        on: intake
        telemetry: logs
        select: {service: otlp-routing-mixed-http-http}
        sender: adp
        count: 3
        timeout: 2m
  - parallel:
      - {step: process_stable_for, on: adp, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 10s}
