description: "Verifies ADP writes to the platform-default log file path (/var/log/datadog/agent-data-plane.log on Linux) when no override is provided"
timeout: 120s
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-default-log"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_USE_NEW_CONFIG_STREAM_ENDPOINT: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"

procedure:
  # Wait for ADP to receive its initial configuration from the Core Agent and reload logging.
  - step: log_contains
    on: adp
    pattern: "Initial configuration received."
    timeout: 30s
    os:
      windows: {timeout: 60s}
  # The default per-subagent log file path is used.
  - step: file_contains
    on: adp
    pattern: DATAPLANE
    timeout: 30s
    os:
      linux: {path: /var/log/datadog/agent-data-plane.log}
      windows: {path: 'C:\ProgramData\Datadog\logs\agent-data-plane.log', timeout: 60s}
