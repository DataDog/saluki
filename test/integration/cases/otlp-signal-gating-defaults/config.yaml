# Verify that ADP, like the Datadog Agent's OTLP receiver, only serves the OTLP signals it accepts.
#
# With the defaults, OTLP metrics and traces are enabled, but OTLP logs aren't: they need both `logs_enabled` and
# `otlp_config.logs.enabled`, which default to `false`. A served route answers a GET with 405, since it only accepts
# POST, and a route that isn't served answers with 404.

type: integration
name: "otlp-signal-gating-defaults"
description: "Verifies that ADP doesn't serve OTLP logs unless they're enabled"
timeout: 120s
runtimes: [linux]

env:
  DD_API_KEY: "test-api-key"
  DD_HOSTNAME: "integration-test-otlp-signal-gating-defaults"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "true"
  DD_DATA_PLANE_OTLP_ENABLED: "true"
  # Bind ADP to framework-isolated addresses reachable through the container port mapping.
  DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:46417"
  DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:46418"

container:
  exposed_ports:
    - "46417/tcp"
    - "46418/tcp"

procedure:
  - assertion: http_check
    endpoint: "http://localhost:46418/v1/metrics"
    status:
      equal: 405
    timeout: 60s
  - assertion: http_check
    endpoint: "http://localhost:46418/v1/traces"
    status:
      equal: 405
    timeout: 10s
  - assertion: http_check
    endpoint: "http://localhost:46418/v1/logs"
    status:
      equal: 404
    timeout: 10s
  - parallel:
      - assertion: process_stable_for
        duration: 10s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 10s
