description: "Verifies a Core Agent runtime config mutation propagates through translation to ADP's /config/runtime endpoint."
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-dynamic-config-runtime"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_USE_NEW_CONFIG_STREAM_ENDPOINT: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_LOG_LEVEL: "info"

procedure:
  - step: config_key_equals
    on: adp
    view: runtime
    key: control.logging.level
    value: info
    timeout: 60s
  - step: config_set
    on: adp
    key: log_level
    value: debug
    timeout: 30s
  - step: config_key_equals
    on: adp
    view: runtime
    key: control.logging.level
    value: debug
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        process: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "Error while reading config event stream"
        during: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
