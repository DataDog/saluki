# Verify that ADP's OTLP relay, in proxy mode, only serves the OTLP signals ADP accepts, as in native mode.
#
# Proxying OTLP traces turns on proxy mode. OTLP logs aren't enabled, so the relay doesn't serve them, rather than
# accepting them and having the core Agent reject them. A served route answers a GET with 405, since it only accepts
# POST, and a route that isn't served answers with 404.

type: integration
name: "otlp-signal-gating-proxy"
description: "Verifies that ADP's OTLP relay doesn't serve OTLP logs unless they're enabled"
timeout: 120s
runtimes: [linux]

env:
  DD_API_KEY: "test-api-key"
  DD_HOSTNAME: "integration-test-otlp-signal-gating-proxy"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "true"
  DD_DATA_PLANE_OTLP_ENABLED: "true"
  DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_TRACES: "true"
  # Bind ADP to framework-isolated addresses reachable through the container port mapping.
  DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:46437"
  DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:46438"

container:
  exposed_ports:
    - "46437/tcp"
    - "46438/tcp"

procedure:
  - assertion: log_contains
    pattern: "OTLP proxy mode enabled"
    timeout: 60s
  - assertion: http_check
    endpoint: "http://localhost:46438/v1/traces"
    status:
      equal: 405
    timeout: 60s
  - assertion: http_check
    endpoint: "http://localhost:46438/v1/logs"
    status:
      equal: 404
    timeout: 10s
  - parallel:
      - assertion: process_stable_for
        duration: 10s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 10s
