description: >-
  ADP's OTLP/HTTP receiver and the Agent's each answer the same requests. An `http_request` step for each request and
  each receiver checks the status, headers and body of the answer. The requests that each receiver accepts then reach
  its intake. A `known` entry of an ADP step holds a difference of ADP, with a gap and an issue.
timeout: 5m
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-otlp-rcv-http"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      # ADP and the Agent read this. The endpoint is the harness's, not the default one. ADP handles every signal itself,
      # because it proxies none of them to the Agent by default.
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_http.port }}"
    connect: {intake: intake-adp.api}
  # The Agent on its own, with the receiver that its default environment binds at `agent_otlp_http`.
  agent:
    type: agent
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-otlp-rcv-http"
    connect: {intake: intake-agent.api}
  intake-adp: {type: datadog-intake}
  intake-agent: {type: datadog-intake}

procedure:
  # ADP listens, and its Agent leaves OTLP to ADP. The independent Agent starts its own OTLP pipeline. No request goes
  # out before all three hold.
  - parallel:
      - step: log_contains
        on: adp
        process: adp
        pattern: 'listen_addr:"tcp://0.0.0.0:{{ adp.endpoints.otlp_http.port }}",tls_enabled:false | HTTP server started.'
        timeout: 60s
      - step: log_contains
        on: adp
        process: agent
        pattern: "Not starting the OTLP ingest pipeline because the data plane handles OTLP ingest"
        timeout: 60s
      - step: log_contains
        on: agent
        process: agent
        pattern: "Everything is ready. Begin running and processing data."
        timeout: 60s
  # Each scenario sends the same request to ADP and to the Agent. A step sends its request once, and judges the one
  # answer. The Agent must meet `expect`. ADP must meet `expect` or its `known` entry, which names the gap and the issue
  # that track the difference. A `known` entry fails the step when ADP meets a part of `expect` that the entry replaces,
  # so the entry cannot outlive its gap. A transport error fails the step in every case. The requests that the receivers
  # accept come first, and then the requests that they refuse.
  # metrics-protobuf: A protobuf metrics request that accepts gzip. Neither receiver compresses its answer.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf, Accept-Encoding: gzip}
      body: {file: bodies/metrics_protobuf.pb}
    expect:
      status: 200
      headers: {content-type: application/x-protobuf, content-encoding: null}
      body: {base64: CgA=}
    known:
      gap: gap/otlp-http-response-format
      issue: 3482
      reason: >-
        ADP answers a success with the plain text `OK`. The OTLP specification asks for a serialized response message in
        the content type of the request, which is what the Agent sends.
      expect:
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: OK}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf, Accept-Encoding: gzip}
      body: {file: bodies/metrics_protobuf.pb}
    expect:
      status: 200
      headers: {content-type: application/x-protobuf, content-encoding: null}
      body: {base64: CgA=}
    timeout: 10s
  # traces-protobuf: A protobuf traces request.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/traces
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/traces.pb}
    expect:
      status: 200
      headers: {content-type: application/x-protobuf}
      body: {base64: CgA=}
    known:
      gap: gap/otlp-http-response-format
      issue: 3482
      reason: >-
        ADP answers a success with the plain text `OK`. The OTLP specification asks for a serialized response message in
        the content type of the request, which is what the Agent sends.
      expect:
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: OK}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/traces
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/traces.pb}
    expect:
      status: 200
      headers: {content-type: application/x-protobuf}
      body: {base64: CgA=}
    timeout: 10s
  # metrics-protobuf-charset: A protobuf metrics request whose content type has a charset parameter.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: "application/x-protobuf; charset=utf-8"}
      body: {file: bodies/metrics_protobuf_charset.pb}
    expect:
      status: 200
      headers: {content-type: application/x-protobuf}
      body: {base64: CgA=}
    known:
      gap: gap/otlp-http-response-format
      issue: 3482
      reason: >-
        ADP answers a success with the plain text `OK`. The OTLP specification asks for a serialized response message in
        the content type of the request, which is what the Agent sends.
      expect:
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: OK}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: "application/x-protobuf; charset=utf-8"}
      body: {file: bodies/metrics_protobuf_charset.pb}
    expect:
      status: 200
      headers: {content-type: application/x-protobuf}
      body: {base64: CgA=}
    timeout: 10s
  # metrics-json: A JSON metrics request.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/json}
      body: {file: bodies/metrics_json.json}
    expect:
      status: 200
      headers: {content-type: application/json}
      body: {text: '{"partialSuccess":{}}'}
    known:
      gap: gap/otlp-http-content-type
      issue: 3480
      reason: >-
        ADP ignores the content type and decodes every body as protobuf, so it fails a JSON body with status 500. The
        Agent decodes the JSON.
      expect:
        status: 500
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: Internal processing error}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/json}
      body: {file: bodies/metrics_json.json}
    expect:
      status: 200
      headers: {content-type: application/json}
      body: {text: '{"partialSuccess":{}}'}
    timeout: 10s
  # traces-json: A JSON traces request.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/traces
      headers: {Content-Type: application/json}
      body: {file: bodies/traces.json}
    expect:
      status: 200
      headers: {content-type: application/json}
      body: {text: '{"partialSuccess":{}}'}
    known:
      gap: gap/otlp-http-content-type
      issue: 3480
      reason: >-
        ADP ignores the content type and decodes every body as protobuf, so it fails a JSON body with status 500. The
        Agent decodes the JSON.
      expect:
        status: 500
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: Internal processing error}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/traces
      headers: {Content-Type: application/json}
      body: {file: bodies/traces.json}
    expect:
      status: 200
      headers: {content-type: application/json}
      body: {text: '{"partialSuccess":{}}'}
    timeout: 10s
  # metrics-gzip: A protobuf metrics request with a gzip body and the matching `Content-Encoding`.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/metrics_gzip.pb}
      content_encoding: gzip
    expect:
      status: 200
      headers: {content-type: application/x-protobuf}
      body: {base64: CgA=}
    known:
      gap: gap/otlp-http-content-encoding
      issue: 3481
      reason: >-
        ADP ignores `Content-Encoding` and decodes the compressed body as protobuf, so it fails with status 500. The
        Agent decompresses the body.
      expect:
        status: 500
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: Internal processing error}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/metrics_gzip.pb}
      content_encoding: gzip
    expect:
      status: 200
      headers: {content-type: application/x-protobuf}
      body: {base64: CgA=}
    timeout: 10s
  # metrics-br: A protobuf metrics request that names an encoding that no receiver supports. The body is not compressed.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf, Content-Encoding: br}
      body: {file: bodies/metrics_br.pb}
    expect:
      status: 400
      headers: {content-type: application/x-protobuf}
      body_contains: {text: "unsupported Content-Encoding: br"}
    known:
      gap: gap/otlp-http-content-encoding
      issue: 3481
      reason: >-
        ADP ignores `Content-Encoding`, so it accepts the body. The Agent refuses an encoding that it does not know,
        with status 400.
      expect:
        status: 200
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: OK}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf, Content-Encoding: br}
      body: {file: bodies/metrics_br.pb}
    expect:
      status: 400
      headers: {content-type: application/x-protobuf}
      body_contains: {text: "unsupported Content-Encoding: br"}
    timeout: 10s
  # metrics-text-plain: A protobuf metrics request with the content type `text/plain`.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: text/plain}
      body: {file: bodies/metrics_text_plain.pb}
    expect:
      status: 415
      headers: {content-type: text/plain}
      body: {text: "415 unsupported media type, supported: [application/json, application/x-protobuf]"}
    known:
      gap: gap/otlp-http-content-type
      issue: 3480
      reason: >-
        ADP ignores the content type, so it accepts the body. The Agent refuses a content type that is not JSON or
        protobuf, with status 415.
      expect:
        status: 200
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: OK}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: text/plain}
      body: {file: bodies/metrics_text_plain.pb}
    expect:
      status: 415
      headers: {content-type: text/plain}
      body: {text: "415 unsupported media type, supported: [application/json, application/x-protobuf]"}
    timeout: 10s
  # metrics-no-content-type: A protobuf metrics request with no content type.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      body: {file: bodies/metrics_no_content_type.pb}
    expect:
      status: 415
      headers: {content-type: text/plain}
      body: {text: "415 unsupported media type, supported: [application/json, application/x-protobuf]"}
    known:
      gap: gap/otlp-http-content-type
      issue: 3480
      reason: >-
        ADP ignores the content type, so it accepts the body. The Agent refuses a request with no content type, with
        status 415.
      expect:
        status: 200
        headers: {content-type: "text/plain; charset=utf-8"}
        body: {text: OK}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      body: {file: bodies/metrics_no_content_type.pb}
    expect:
      status: 415
      headers: {content-type: text/plain}
      body: {text: "415 unsupported media type, supported: [application/json, application/x-protobuf]"}
    timeout: 10s
  # metrics-garbage: A protobuf metrics request whose body is the byte 0x0f, a tag with the invalid wire type 7.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf}
      body: {base64: Dw==}
    expect:
      status: 400
      headers: {content-type: application/x-protobuf}
    known:
      gap: gap/otlp-http-response-format
      issue: 3482
      reason: >-
        ADP answers a body that it cannot decode with status 500 and plain text. The Agent answers with status 400 and a
        `google.rpc.Status` message, as the OTLP specification says.
      expect:
        status: 500
        headers: {content-type: "text/plain; charset=utf-8"}
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics
      headers: {Content-Type: application/x-protobuf}
      body: {base64: Dw==}
    expect:
      status: 400
      headers: {content-type: application/x-protobuf}
    timeout: 10s
  # metrics-get: A GET to the metrics path. The bodies of the two receivers differ, and that is not a gap.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: GET
      path: /v1/metrics
    expect:
      status: 405
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: GET
      path: /v1/metrics
    expect:
      status: 405
    timeout: 10s
  # unknown-path: A POST to a path that no signal uses.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/unknown
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/unknown_path.pb}
    expect:
      status: 404
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/unknown
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/unknown_path.pb}
    expect:
      status: 404
    timeout: 10s
  # trailing-slash: A POST to the metrics path with a trailing slash.
  - step: http_request
    on: adp
    endpoint: otlp_http
    request:
      method: POST
      path: /v1/metrics/
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/trailing_slash.pb}
    expect:
      status: 404
    timeout: 10s
  - step: http_request
    on: agent
    endpoint: agent_otlp_http
    request:
      method: POST
      path: /v1/metrics/
      headers: {Content-Type: application/x-protobuf}
      body: {file: bodies/trailing_slash.pb}
    expect:
      status: 404
    timeout: 10s
  # Each request that a receiver accepts reaches the intake from its own sender, and a request that it refuses does not.
  # The metric of each metrics body has the name of the body, so each step selects one request. The exact totals show
  # that no other request delivered. The counts follow from the known differences of ADP: when one goes stale, its count
  # changes first.
  - parallel:
      # The Agent delivers the four metrics requests that it accepts, and both traces requests.
      - step: intake_from
        on: intake-agent
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_protobuf."}
        sender: agent
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-agent
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_protobuf_charset."}
        sender: agent
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-agent
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_json."}
        sender: agent
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-agent
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_gzip."}
        sender: agent
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-agent
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http."}
        sender: agent
        count: 4
        timeout: 2m
      - step: intake_from
        on: intake-agent
        telemetry: spans
        select: {service: otlp-rcv-http}
        sender: trace-agent
        count: 2
        timeout: 2m
      # ADP delivers the five metrics requests that it accepts, and the protobuf traces request. It decodes a JSON body
      # as protobuf, and fails it.
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_protobuf."}
        sender: adp
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_protobuf_charset."}
        sender: adp
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_br."}
        sender: adp
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_text_plain."}
        sender: adp
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http.metrics_no_content_type."}
        sender: adp
        count: 1
        timeout: 2m
      - step: intake_from
        on: intake-adp
        telemetry: metrics
        select: {name_prefix: "otlp.rcv.http."}
        sender: adp
        count: 5
        timeout: 2m
      - step: intake_from
        on: intake-adp
        telemetry: spans
        select: {service: otlp-rcv-http}
        sender: adp
        count: 1
        timeout: 2m
  - parallel:
      - {step: process_stable_for, on: adp, duration: 10s}
      - {step: process_stable_for, on: agent, duration: 10s}
      # The errors that ADP logs for a body that it cannot decode are expected, so only a crash fails the case.
      - {step: log_not_contains, on: adp, pattern: "panicked at|panic: |PANIC", regex: true, during: 10s}
      - {step: log_not_contains, on: agent, pattern: "panicked at|panic: |PANIC", regex: true, during: 10s}
