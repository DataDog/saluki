# Verify that ADP serves OTLP logs once both `logs_enabled` and `otlp_config.logs.enabled` are set, and stops serving
# OTLP metrics once `otlp_config.metrics.enabled` is `false`, as the Datadog Agent's OTLP receiver does.
#
# A served route answers a GET with 405, since it only accepts POST, and a route that isn't served answers with 404.

type: integration
name: "otlp-signal-gating-enabled-logs"
description: "Verifies that ADP serves exactly the OTLP signals that are enabled"
timeout: 120s
runtimes: [linux]

env:
  DD_API_KEY: "test-api-key"
  DD_HOSTNAME: "integration-test-otlp-signal-gating-enabled-logs"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "true"
  DD_DATA_PLANE_OTLP_ENABLED: "true"
  DD_LOGS_ENABLED: "true"
  DD_OTLP_CONFIG_LOGS_ENABLED: "true"
  DD_OTLP_CONFIG_METRICS_ENABLED: "false"
  # Bind ADP to framework-isolated addresses reachable through the container port mapping.
  DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:46427"
  DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:46428"

container:
  exposed_ports:
    - "46427/tcp"
    - "46428/tcp"

procedure:
  - assertion: http_check
    endpoint: "http://localhost:46428/v1/logs"
    status:
      equal: 405
    timeout: 60s
  - assertion: http_check
    endpoint: "http://localhost:46428/v1/traces"
    status:
      equal: 405
    timeout: 10s
  - assertion: http_check
    endpoint: "http://localhost:46428/v1/metrics"
    status:
      equal: 404
    timeout: 10s
  - parallel:
      - assertion: process_stable_for
        duration: 10s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 10s
