name: "dogstatsd-named-pipe-windows"
description: "Verifies Windows DogStatsD named-pipe intake accepts client writes and decodes frames"
timeout: 120s
subject_os: [windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-named-pipe"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DOGSTATSD_PORT: "0"
        DD_DOGSTATSD_PIPE_NAME: "datadog-dogstatsd-integration"
        DD_DOGSTATSD_EOL_REQUIRED: "named_pipe"

# Each send opens a connection. Retries may duplicate input, so assertions check distinct
# strings for presence or absence rather than counting deliveries.
procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"npipe://datadog-dogstatsd-integration"'
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_pipe
    payload: "integration.named_pipe.invalid\n"
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_pipe
    payload: "integration.named_pipe.with_eol.invalid\n"
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_pipe
    payload: "integration.named_pipe.no_eol.invalid"
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_pipe
    payload: "integration.named_pipe.multi_one.invalid\nintegration.named_pipe.multi_two.invalid\n"
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_pipe
    payload: "x"
    repeat: 10000
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_pipe
    payload: "integration.named_pipe.after_oversize.invalid\n"
    timeout: 30s
  - step: log_contains
    on: adp
    pattern: "integration.named_pipe.invalid"
    timeout: 30s
  - step: log_contains
    on: adp
    pattern: "integration.named_pipe.with_eol.invalid"
    timeout: 30s
  - step: log_not_contains
    on: adp
    pattern: "integration.named_pipe.no_eol.invalid"
    during: 10s
  - step: log_contains
    on: adp
    pattern: "integration.named_pipe.multi_one.invalid"
    timeout: 30s
  - step: log_contains
    on: adp
    pattern: "integration.named_pipe.multi_two.invalid"
    timeout: 30s
  - step: log_contains
    on: adp
    pattern: "integration.named_pipe.after_oversize.invalid"
    timeout: 30s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
