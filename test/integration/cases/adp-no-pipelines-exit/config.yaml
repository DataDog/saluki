name: "adp-no-pipelines-exit"
description: "Verify ADP exits with error when no data pipelines enabled"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "false"
        DD_DATA_PLANE_OTLP_ENABLED: "false"

procedure:
  # ADP should log that no pipelines are enabled and exit.
  - step: log_contains
    on: adp
    pattern: "No data pipelines are enabled. Exiting."
    timeout: 60s
  - step: exits_with
    on: adp
    process: adp
    code: 1
    timeout: 60s
