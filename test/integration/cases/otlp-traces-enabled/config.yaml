description: "Verifies OTLP pipeline starts with native trace handling, metrics proxied to the Agent, and logs refused because OTLP logs are disabled"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "test-api-key"
      DD_HOSTNAME: "integration-test-dsd"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "true"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_LOGS: "true"
      DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_METRICS: "true"
      DD_DATA_PLANE_EXPERIMENTAL_OTLP_PROXY_TRACES: "false"
      # Bind ADP to addresses of the harness's own, which the endpoints name.
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_http.port }}"

procedure:
  # Make sure the process becomes healthy, and stays up without errors, listening for OTLP (HTTP and gRPC),
  # for ~10 seconds after.
  - parallel:
      - step: process_stable_for
        on: adp
        process: adp
        duration: 10s
      - step: port_listening
        on: adp
        endpoint: otlp_grpc
        timeout: 60s
      - step: port_listening
        on: adp
        endpoint: otlp_http
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panicked at|panic: |PANIC"
        regex: true
        during: 10s
