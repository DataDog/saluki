name: "unprivileged-api-endpoints"
description: "Verifies the /ready, /live, and /memory/status endpoints are accessible on the unprivileged API"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-health"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"

procedure:
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: http_check
        on: adp
        endpoint: api
        path: /ready
        status:
          equal: 200
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: api
        path: /live
        status:
          equal: 200
        timeout: 60s
      - step: http_check
        on: adp
        endpoint: api
        path: /memory/status
        status:
          equal: 200
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
