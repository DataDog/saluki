# `dogstatsd_require_listener` — test 3 of 3 (one listener fails, another succeeds)
#
# The UDS socket path is below `/dev/null`, which isn't a directory, so that listener can't be
# created, but the UDP listener can. Like the core agent, ADP must log the failed listener and keep
# running with the UDP one, even though a listener is required.

name: "dogstatsd-skip-failed-listener"
description: "Verifies ADP skips a DogStatsD listener that can't be created and keeps the others"
timeout: 120s
subject_os: [linux, macos]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-skip-failed-listener"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DOGSTATSD_SOCKET: "/dev/null/saluki-dogstatsd-skip-failed-listener.sock"
        DD_DOGSTATSD_REQUIRE_LISTENER: "true"

procedure:
  - step: log_contains
    on: adp
    pattern: "Can't create DogStatsD unixgram listener."
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      # The log confirms UDP is bound; a UDP probe only connects a local socket.
      - step: log_contains
        on: adp
        process: adp
        pattern: 'listen_addr:"udp://[^"]+" \| DogStatsD listener started\.'
        regex: true
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "Could not start DogStatsD.|panic|PANIC"
        regex: true
        during: 10s
