description: "Verifies OTLP receiver serves TLS over gRPC and HTTP with cert_file and key_file"
timeout: 120s
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "test-api-key"
      DD_HOSTNAME: "integration-test-otlp-tls"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "true"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      # Bind ADP to the harness's OTLP endpoints, reachable through the container port mapping.
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:{{ self.endpoints.otlp_http.port }}"
      # The mounted test PEM contains both the certificate and its private key.
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_TLS_CERT_FILE: "/tmp/otlp-tls/server.pem"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_TLS_KEY_FILE: "/tmp/otlp-tls/server.pem"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_TLS_CERT_FILE: "/tmp/otlp-tls/server.pem"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_TLS_KEY_FILE: "/tmp/otlp-tls/server.pem"
    files:
      /tmp/otlp-tls/server.pem: server.pem

procedure:
  # HTTP succeeds over TLS. Certificate verification is intentionally skipped because the mounted
  # test certificate is self-signed. A 405 response confirms the TLS handshake completed and the
  # server responded (GET is not allowed on /v1/metrics, only POST).
  - step: http_check
    on: adp
    endpoint: otlp_http
    path: /v1/metrics
    status:
      equal: 405
    insecure_skip_verify: true
    timeout: 60s
  # gRPC completes a TLS handshake. We use openssl s_client to verify the server's certificate
  # chain and confirm the handshake succeeds.
  - step: exec
    on: adp
    command:
      - sh
      - -c
      - >-
        printf '' | openssl s_client -connect 127.0.0.1:{{ adp.endpoints.otlp_grpc.port }} -alpn h2
        -CAfile /tmp/otlp-tls/server.pem -verify_return_error 2>&1 |
        grep -q 'Verify return code: 0 (ok)'
    timeout: 30s
  # Ensure the process stays healthy and doesn't panic.
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panicked at|panic: |PANIC", regex: true, during: 10s}
