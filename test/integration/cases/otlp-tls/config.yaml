name: "otlp-tls"
description: "Verifies OTLP receiver serves TLS over gRPC and HTTP with cert_file and key_file"
timeout: 120s
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "test-api-key"
        DD_HOSTNAME: "integration-test-otlp-tls"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "true"
        DD_DATA_PLANE_OTLP_ENABLED: "true"
        # Bind ADP to framework-isolated addresses reachable through the container port mapping.
        DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:56317"
        DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:56318"
        # The test PEM under files/ contains both the certificate and its private key.
        DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_TLS_CERT_FILE: "{{ self.facts.files_dir }}/server.pem"
        DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_TLS_KEY_FILE: "{{ self.facts.files_dir }}/server.pem"
        DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_TLS_CERT_FILE: "{{ self.facts.files_dir }}/server.pem"
        DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_TLS_KEY_FILE: "{{ self.facts.files_dir }}/server.pem"
      files: {files/: files}

procedure:
  # Skip verification for the self-signed test certificate. A 405 response confirms the TLS
  # handshake completed and the server answered GET on its POST-only metrics route.
  - step: http_check
    on: adp
    endpoint: otlp_http
    path: /v1/metrics
    status:
      equal: 405
    insecure_skip_verify: true
    timeout: 60s
  # gRPC completes a TLS handshake. We use openssl s_client to verify the server's certificate
  # chain and confirm the handshake succeeds.
  - step: exec
    on: adp
    argv:
      - sh
      - -c
      - >-
        printf '' | openssl s_client -connect 127.0.0.1:56317 -alpn h2
        -CAfile {{ adp.facts.files_dir }}/server.pem -verify_return_error 2>&1 |
        grep -q 'Verify return code: 0 (ok)'
    timeout: 30s
  # Ensure the process stays healthy and doesn't panic.
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
