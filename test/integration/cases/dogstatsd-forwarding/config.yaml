name: "dogstatsd-forwarding"
description: "Verifies DogStatsD message forwarding mirrors framed payloads and preserves ingestion"
timeout: 180s
subject_os: [linux]

participants:
  intake:
    type: datadog-intake
  adp:
    type: agent-adp
    subject: true
    connect:
      dogstatsd_forward: intake.dogstatsd_forward
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-forwarding"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DOGSTATSD_TCP_PORT: "9126"
        DD_DOGSTATSD_SOCKET: "/tmp/dsd-forwarding.sock"
        DD_DOGSTATSD_STREAM_SOCKET: "/tmp/dsd-forwarding-stream.sock"
        DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"

procedure:
  - step: log_contains
    on: adp
    pattern: "DogStatsD packet forwarding enabled"
    timeout: 60s
  # UDP sends need a bound listener; a UDP probe cannot establish that it is listening.
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"udp://[^"]+" \| DogStatsD listener started\.'
    regex: true
    timeout: 60s
  - step: send
    on: adp
    endpoint: dogstatsd_udp
    payload: "this is not dogstatsd"
    timeout: 10s
  - step: send
    on: adp
    endpoint: dogstatsd_udp
    payload: "adp.forwarding.integration:1|c|#source:integration"
    timeout: 10s
  # Stream listeners read a four-byte little-endian length followed by the payload: 0x3c = 60 bytes.
  - step: send
    on: adp
    endpoint: dogstatsd_tcp
    payload: "\x3c\0\0\0adp.forwarding.stream_one:1|c\nadp.forwarding.stream_two:2|c\n"
    timeout: 30s
  - step: send
    on: adp
    endpoint: dogstatsd_uds
    payload: "adp.forwarding.uds_datagram:1|c"
    timeout: 30s
  # 0x1e = 30 bytes, including the final newline.
  - step: send
    on: adp
    endpoint: dogstatsd_uds_stream
    payload: "\x1e\0\0\0adp.forwarding.uds_stream:1|c\n"
    timeout: 30s
  # Match each expected forwarded packet byte for byte, including the malformed input.
  - step: intake_has_forwarded_packets
    on: intake
    contains: ["this is not dogstatsd"]
    timeout: 30s
  - step: intake_has_forwarded_packets
    on: intake
    contains: ["adp.forwarding.integration:1|c|#source:integration"]
    timeout: 30s
  - step: intake_has_forwarded_packets
    on: intake
    contains: ["adp.forwarding.stream_one:1|c"]
    timeout: 30s
  - step: intake_has_forwarded_packets
    on: intake
    contains: ["adp.forwarding.stream_two:2|c"]
    timeout: 30s
  - step: intake_has_forwarded_packets
    on: intake
    contains: ["adp.forwarding.uds_datagram:1|c"]
    timeout: 30s
  - step: intake_has_forwarded_packets
    on: intake
    contains: ["adp.forwarding.uds_stream:1|c"]
    timeout: 30s
  # Forwarding must preserve ingestion: the UDP metric increments parsed-metric telemetry.
  - step: http_check
    on: adp
    endpoint: api
    path: /metrics
    status: {equal: 200}
    pattern: '(?m)^adp__component_events_received_total\{[^}\n]*(listener_type="udp"[^}\n]*message_type="metrics"|message_type="metrics"[^}\n]*listener_type="udp")[^}\n]*\} [1-9]'
    regex: true
    timeout: 30s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: port_listening
        on: adp
        endpoint: dogstatsd_tcp
        timeout: 10s
      - step: log_not_contains
        on: adp
        pattern: "Unsupported configuration key|panic|PANIC"
        regex: true
        during: 10s
