name: "adp-rc-no-products"
description: "Verifies ADP starts no Remote Configuration worker, and emits no remote_config metrics when Remote Configuration is disabled"
timeout: 180s
# Validate on macOS and Windows before enabling those runtimes.
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-rc-no-products"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_OTLP_ENABLED: "true"
        DD_DATA_PLANE_OTLP_PROXY_ENABLED: "false"
        DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:56317"
        DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:56318"
        # Disable Remote Configuration globally while keeping the trace pipeline enabled.
        DD_REMOTE_CONFIGURATION_ENABLED: "false"
        # If the worker starts polling, it logs a Remote Configuration metric at debug level.
        DD_LOG_LEVEL: "debug"

procedure:
  - step: config_key_equals
    on: adp
    key: domains.remote_configuration.enabled
    value: false
    view: runtime
    timeout: 60s
  # Confirm the OTLP listener started before checking for unwanted RC activity.
  - step: port_listening
    on: adp
    endpoint: otlp_http
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "DATAPLANE.*(remote_config|remote-config|Remote Configuration)"
        regex: true
        during: 20s
