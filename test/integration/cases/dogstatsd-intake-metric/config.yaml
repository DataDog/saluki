description: "Sends a UDP DogStatsD counter twice from millstone through Agent+ADP and asserts its total reaches datadog-intake"
timeout: 300s
subject_os: [linux, macos, windows]

participants:
  intake:
    type: datadog-intake
  # Waits for ADP's declared UDP listener, then sends the counter and exits.
  sender:
    type: millstone-sender
    files:
      millstone.yaml: {from: millstone.yaml, template: true}
    connect:
      target: adp.dogstatsd_udp
  adp:
    type: agent-adp
    subject: true
    connect:
      intake: intake.api
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-intake-metric"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_ORIGIN_DETECTION: "false"

procedure:
  # The sender starts once ADP has bound its UDP listener. Exit 0 shows that millstone submitted its datagrams, and a
  # UDP send can succeed when the datagram is dropped. Only the intake assertion below shows delivery.
  - step: exits_with
    on: sender
    process: main
    code: 0
    timeout: 60s
  # Polls to cover the aggregation and flush window rather than sleeping for it.
  #
  # DogStatsD counters leave the aggregate transform as rates, so the exported value is the
  # payload count divided by the aggregation window (10s by default). The two sends total 6, or
  # 0.6 per second, whether they land in one flush or are split across two.
  - step: intake_has_metric
    on: intake
    name: "integration.intake.counter"
    metric_type: rate
    value: 0.6
    tags: ["source:integration-test"]
    timeout: 120s
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 5s}
      - {step: log_not_contains, on: adp, pattern: "panicked at|panic: |PANIC", regex: true, during: 5s}
