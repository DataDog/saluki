description: "Sends a UDP DogStatsD counter twice through Agent+ADP and asserts its total reaches datadog-intake"
timeout: 180s
subject_os: [linux]

participants:
  intake:
    type: datadog-intake
  adp:
    type: agent-adp
    subject: true
    connect:
      intake: intake.api
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-intake-metric"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_ORIGIN_DETECTION: "false"

procedure:
  # Readiness gate: the listener logs this only once it is bound, and steps run in order, so
  # nothing is sent early.
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"udp://0.0.0.0:{{ adp.endpoints.dogstatsd_udp.port }}" | DogStatsD listener started.'
    timeout: 60s
  - step: send
    on: adp
    endpoint: dogstatsd_udp
    payload: "integration.intake.counter:3|c|#source:integration-test"
    repeat: 2
    timeout: 10s
  # Polls to cover the aggregation and flush window rather than sleeping for it.
  #
  # DogStatsD counters leave the aggregate transform as rates, so the exported value is the
  # payload count divided by the aggregation window (10s by default). The two sends total 6, or
  # 0.6 per second, whether they land in one flush or are split across two.
  - step: intake_has_metric
    on: intake
    name: "integration.intake.counter"
    metric_type: rate
    value: 0.6
    tags: ["source:integration-test"]
    timeout: 120s
  - parallel:
      - {step: process_stable_for, on: adp, process: adp, duration: 5s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 5s}
