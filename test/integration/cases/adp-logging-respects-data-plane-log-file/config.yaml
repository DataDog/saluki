description: "Verifies ADP honors the per-subagent `data_plane.log_file` setting when explicitly configured"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-data-plane-log-override"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_USE_NEW_CONFIG_STREAM_ENDPOINT: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
    os:
      linux:
        env:
          DD_DATA_PLANE_LOG_FILE: "{{ self.dir }}/adp-custom.log"
      macos:
        env:
          DD_DATA_PLANE_LOG_FILE: "{{ self.dir }}/adp-custom.log"
      windows:
        env:
          DD_DATA_PLANE_LOG_FILE: 'C:\adp\adp-custom.log'

procedure:
  # Wait for ADP to receive its initial configuration from the Core Agent and reload logging.
  - step: log_contains
    on: adp
    pattern: "Initial configuration received."
    timeout: 30s
    os:
      windows: {timeout: 60s}
  # ADP writes to the explicitly-configured per-subagent path.
  - step: file_contains
    on: adp
    pattern: DATAPLANE
    timeout: 30s
    os:
      linux: {path: "{{ adp.dir }}/adp-custom.log"}
      macos: {path: "{{ adp.dir }}/adp-custom.log"}
      windows: {path: 'C:\adp\adp-custom.log', timeout: 60s}
  # The log file outlives ADP, so check that it has not exited, as before the file was read.
  - {step: process_stable_for, on: adp, process: adp, duration: 1s}
