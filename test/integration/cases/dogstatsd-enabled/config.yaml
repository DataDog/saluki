name: "dogstatsd-enabled"
description: "Verifies DogStatsD pipeline starts and listens on UDP port, and that a fatal OTLP TLS config does not crash ADP when OTLP is disabled"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
        # Set a fatal OTLP TLS config (cert_file without key_file) to verify that ADP does not bail when
        # OTLP is not enabled. If a regression causes ADP to validate OTLP TLS config even when OTLP is off,
        # this test will catch it.
        DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_TLS_CERT_FILE: "/nonexistent/cert.pem"
        # Set an unsupported high-severity OTLP TLS config to verify that ADP does not bail when OTLP is
        # not enabled. Unsupported keys with high severity should only be fatal when the OTLP pipeline is
        # active; when OTLP is off, they must not affect the DogStatsD pipeline.
        DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_TLS_TPM_OWNER_AUTH: "unused-test-value"

procedure:
  # Make sure the process becomes healthy, and stays up without errors, listening for DSD (UDP),
  # for ~10 seconds after.
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_contains
        on: adp
        process: adp
        pattern: 'listen_addr:"udp://[^"]+" \| DogStatsD listener started\.'
        regex: true
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
