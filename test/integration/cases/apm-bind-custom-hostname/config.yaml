# Issue #1331: bind_host support — hostname resolution for the APM proxy.
# extra_hosts maps foo.local to the participant's own container IP before startup.
# ADP must resolve the hostname and bind that address.

name: "apm-bind-custom-hostname"
description: "Verifies APM proxy resolves a custom hostname in bind_host via DNS"
timeout: 120s
subject_os: [linux, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-apm-bind-host-hostname"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_BIND_HOST: foo.local
        DD_DATA_PLANE_EXPERIMENTAL_APM_ENABLED: "true"
        DD_APM_NON_LOCAL_TRAFFIC: "false"
        # Avoid port collision by disabling the go trace-agent
        DD_APM_ENABLED: "false"
      params:
        extra_hosts: {foo.local: self}

procedure:
  - step: log_contains
    on: adp
    pattern: 'listen_addr:"tcp://{{ adp.late.ip }}:58126"'
    timeout: 60s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
