name: "dogstatsd-top-windows"
description: "Verifies the privileged DogStatsD top workflow and context artifact replacement on Windows"
timeout: 180s
subject_os: [windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dogstatsd-top-windows"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      files: {files/: files}

procedure:
  - parallel:
      # The log proves UDP bound successfully; a UDP connect alone cannot.
      - step: log_contains
        on: adp
        pattern: 'listen_addr:"udp://[^"]+:58125" \| DogStatsD listener started\.'
        regex: true
        timeout: 60s
      - step: log_contains
        on: adp
        pattern: "Agent Data Plane running."
        timeout: 60s
  - step: exec
    on: adp
    argv: [pwsh, -NoProfile, -NonInteractive, -File, '{{ adp.facts.files_dir }}\run_dogstatsd_top_test.ps1']
    timeout: 90s
  - step: file_contains
    on: adp
    path: "C:\\dogstatsd-top-result"
    pattern: "passed"
    timeout: 10s
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
