# `dogstatsd_require_listener` — test 2 of 3 (no listener, listener not required)
#
# The UDP listener is disabled, and the UDS socket path is below `/dev/null`, which isn't a
# directory, so no DogStatsD listener can be created. With `dogstatsd_require_listener` disabled,
# the core agent logs the failure and keeps running without DogStatsD. ADP must do the same.

type: integration
name: "dogstatsd-no-listener-continues"
description: "Verifies ADP keeps running when no DogStatsD listener can be created and none is required"
timeout: 120s
runtimes: [linux, mac]

env:
  DD_API_KEY: "00000000000000000000000000000000"
  DD_HOSTNAME: "integration-test-dsd-no-listener-continues"
  DD_DATA_PLANE_ENABLED: "true"
  DD_DATA_PLANE_STANDALONE_MODE: "false"
  DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
  DD_DOGSTATSD_PORT: "0"
  DD_DOGSTATSD_SOCKET: "/dev/null/saluki-dogstatsd-no-listener.sock"
  DD_DOGSTATSD_REQUIRE_LISTENER: "false"

procedure:
  - assertion: log_contains
    pattern: "Can't create DogStatsD unixgram listener."
    timeout: 60s
  - assertion: log_contains
    pattern: "Could not start DogStatsD."
    timeout: 60s
  - parallel:
      - assertion: process_stable_for
        duration: 10s
      - assertion: log_not_contains
        pattern: "panic|PANIC"
        regex: true
        during: 10s
