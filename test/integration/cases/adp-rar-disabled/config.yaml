# Linux only: in the Agent image, s6 restarts ADP after every exit. With RAR disabled, ADP logs the
# registration failure, then fails to bootstrap and exits, and s6 restarts it. So `process_stable_for`
# watches the Agent, whose exit stops the container, as the legacy case watched the container. The
# mac runtime has no supervisor; run this there once the test asserts on retry behavior directly.

description: "Verify ADP gracefully handles RAR being disabled on the Core Agent"
timeout: 120s
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-rar-disabled"
      # Core Agent setting to disable RAR
      DD_REMOTE_AGENT_REGISTRY_ENABLED: "false"
      # ADP settings - enable RAR integration (which will fail gracefully)
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_REMOTE_AGENT_ENABLED: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"

procedure:
  # ADP should report registration failure (Core Agent returns error when RAR disabled). Allow 15s
  # (matching adp-cmd-port): the failure is only reported once the Core Agent's CMD/IPC API server is
  # reachable, which can take ~10s to come up on slower hosts.
  - step: log_contains
    on: adp
    pattern: "Failed to register with the Datadog Agent. Registration will be retried periodically in the background."
    timeout: 15s
  # Make sure the container stays up without errors for ~10 seconds after.
  - parallel:
      - {step: process_stable_for, on: adp, process: agent, duration: 10s}
      - {step: log_not_contains, on: adp, pattern: "panic|PANIC", regex: true, during: 10s}
