name: "adp-rar-disabled"
description: "Verify the Agent stays running while ADP restarts when Remote Agent Registry is disabled"
timeout: 120s
subject_os: [linux]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-rar-disabled"
        DD_REMOTE_AGENT_REGISTRY_ENABLED: "false"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_REMOTE_AGENT_ENABLED: "true"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"

procedure:
  # The registration warning precedes the bootstrap failure and supervised restart.
  - step: log_contains
    on: adp
    process: adp
    pattern: "Failed to register with the Datadog Agent. Registration will be retried periodically in the background."
    timeout: 15s
  - parallel:
      # ADP exits when registration fails and s6 restarts it; the Agent must stay running.
      - step: process_stable_for
        on: adp
        process: agent
        duration: 10s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
