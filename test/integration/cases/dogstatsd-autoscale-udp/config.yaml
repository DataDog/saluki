description: "Verifies DogStatsD UDP listener autoscaling (SO_REUSEPORT) starts cleanly on Linux"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    env:
      DD_API_KEY: "00000000000000000000000000000000"
      DD_HOSTNAME: "integration-test-dsd-autoscale"
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_AUTOSCALE_UDP_LISTENERS: "true"

procedure:
  # Make sure the process becomes healthy and stays up without errors when autoscale is enabled,
  # and that the UDP listener still binds to the configured port.
  - parallel:
      - step: process_stable_for
        on: adp
        process: adp
        duration: 10s
      - step: log_contains
        on: adp
        process: adp
        pattern: ':{{ adp.endpoints.dogstatsd_udp.port }}" | DogStatsD listener started.'
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
      - step: log_contains
        on: adp
        pattern: "DogStatsD listener started"
        timeout: 60s
