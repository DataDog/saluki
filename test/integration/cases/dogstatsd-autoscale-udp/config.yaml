name: "dogstatsd-autoscale-udp"
description: "Verifies DogStatsD starts a UDP listener and stays stable with autoscaling enabled"
timeout: 120s
subject_os: [linux, macos, windows]

participants:
  adp:
    type: agent-adp
    subject: true
    config:
      env:
        DD_API_KEY: "00000000000000000000000000000000"
        DD_HOSTNAME: "integration-test-dsd-autoscale"
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
        DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
        DD_DOGSTATSD_AUTOSCALE_UDP_LISTENERS: "true"

procedure:
  # Require a UDP listener and stable processes with autoscaling enabled.
  - parallel:
      - step: process_stable_for
        on: adp
        duration: 10s
      - step: log_contains
        on: adp
        process: adp
        pattern: 'listen_addr:"udp://[^"]+" \| DogStatsD listener started\.'
        regex: true
        timeout: 60s
      - step: log_not_contains
        on: adp
        pattern: "panic|PANIC"
        regex: true
        during: 10s
