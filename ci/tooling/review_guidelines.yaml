# Layout of the generated `codereview_guideline.md` files. See "Edit the guidelines" in docs/development/code-review.md.
#
# Each entry under `files` is one generated file:
#
# - `path`: where the file goes. The root file applies to every pull request. A file in a subdirectory applies only to
#   pull requests that change files under that directory.
# - `title`: the `##` heading at the top of the file. The review action joins every file that applies in path order, so
#   the root file can come before or after a scoped file, and each file needs a heading of its own.
# - `sections`: the regions to include, in order. `region` is `<page>.md#<name>`, for a region of a page in
#   docs/development. With `level`, a heading of that level comes before the region: its text is `heading`, or the
#   heading above the region in the docs page when `heading` isn't set.
#
# `ignore_names` lists Rust names that the guidelines mention on purpose even though they don't exist in the code, such
# as examples of names to avoid. `check` doesn't warn about them.

ignore_names:
  - EventPriority

files:
  - path: codereview_guideline.md
    title: Saluki review guidelines
    sections:
      - region: how-we-review.md#preamble
      - region: how-we-review.md#writing-findings
        level: 2
        heading: How to write a finding
      - region: how-we-review.md#severity
        level: 2
      - region: how-we-review.md#do-not-flag
        level: 2
        heading: What not to flag
      - region: code-review.md#checklist-intro
        level: 2
        heading: Project-specific review checklist
      - region: style-guide.md#layering
        level: 3
        heading: Saluki and ADP layering
      - region: conventions.md#generated-files
        level: 3
        heading: Generated and vendored files
      - region: conventions.md#agent-parity
        level: 3
        heading: Matching the Datadog Agent
      - region: conventions.md#reuse
        level: 3
        heading: Reuse what exists
      - region: conventions.md#api-routes
        level: 3
        heading: API routes and control plane workers
      - region: conventions.md#hot-paths
        level: 3
        heading: Hot paths and memory
      - region: conventions.md#concurrency
        level: 3
        heading: Concurrency and lifecycle
      - region: style-guide.md#error-handling
        level: 3
        heading: Error handling
      - region: style-guide.md#log-messages
        level: 3
        heading: Log messages
      - region: conventions.md#telemetry
        level: 3
        heading: Internal telemetry
      - region: conventions.md#numbers
        level: 3
        heading: Numbers and identity
      - region: conventions.md#security
        level: 3
        heading: Security
      - region: style-guide.md#api-design
        level: 3
        heading: API design and naming
      - region: style-guide.md#nits
        level: 3
        heading: Nits
      - region: testing-patterns.md#review-checklist
        level: 3
        heading: Tests
      - region: testing-patterns.md#process-wide-state
        level: 4
      - region: testing-patterns.md#ports
        level: 4
      - region: testing-patterns.md#timing
        level: 4
      - region: style-guide.md#comments-and-docs
        level: 3
        heading: Comments and documentation
      - region: conventions.md#build-plumbing
        level: 3
        heading: Build and release plumbing
      - region: contributing.md#scope
        level: 3
        heading: Scope

  - path: lib/datadog-agent/config/codereview_guideline.md
