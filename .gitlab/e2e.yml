build-correctness-tools-image:
  stage: e2e
  image: ${DOCKER_BUILD_IMAGE}
  needs: []
  retry: 2
  timeout: 10m
  script:
    - docker buildx build
      --platform linux/amd64
      --file ./docker/Dockerfile.correctness-tools
      --tag ${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA}
      --build-arg BUILD_IMAGE=${PUBLIC_BASE_IMAGE}
      --build-arg APP_IMAGE=${PUBLIC_BASE_IMAGE}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .

build-bundled-agent-adp-image:
  stage: e2e
  image: ${DOCKER_BUILD_IMAGE}
  needs:
    - build-adp-image
  retry: 2
  timeout: 10m
  script:
    - |
      DD_AGENT_IMAGE=$(jq -er '.integration.linux.image' .datadog-agent-version.json) || exit 1
      echo "Agent $(jq -er '.integration.version' .datadog-agent-version.json): ${DD_AGENT_IMAGE}"
      if [ "${AGENT_NIGHTLY}" = "true" ]; then # for nightly run, use latest Agent
        DD_AGENT_IMAGE="${NIGHTLY_AGENT_IMAGE:-datadog/agent-dev:master-py3-full}"
        AGENT_IMAGE_REPO="${DD_AGENT_IMAGE%:*}"
        echo "Nightly Agent image config/labels (for debugging):"
        docker buildx imagetools inspect "$DD_AGENT_IMAGE" --format '{{json .Image}}' | jq .
        AGENT_IMAGE_DIGEST=$(docker buildx imagetools inspect "$DD_AGENT_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
        DD_AGENT_IMAGE="${AGENT_IMAGE_REPO}@${AGENT_IMAGE_DIGEST}"
        echo "Pinned nightly Agent image to digest: $DD_AGENT_IMAGE"
      fi
      echo "Building converged image on DD_AGENT_IMAGE=${DD_AGENT_IMAGE}"
    # AGENT_NIGHTLY changes the image contents; schedules sharing a commit need separate tags.
    - docker buildx build
      --platform linux/amd64
      --file ./docker/Dockerfile.datadog-agent
      --tag ${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA}-${CI_PIPELINE_ID}
      --build-arg DD_AGENT_IMAGE="${DD_AGENT_IMAGE}"
      --build-arg ADP_IMAGE=${ADP_FULL_IMAGE_TAG}
      --build-arg BUILD_PROFILE=release
      --label agent.image="${DD_AGENT_IMAGE}"
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .

# Compile panoramic and the static courier once. The dynamically generated child pipeline below
# pulls this artifact instead of rebuilding per test.
build-panoramic-binary:
  extends: .build-common-variables
  stage: e2e
  tags: ["arch:amd64"]
  needs: []
  retry: 2
  timeout: 30m
  image: "${SALUKI_BUILD_CI_IMAGE}"
  artifacts:
    expire_in: 1 day
    paths: [target/release/panoramic, target/x86_64-unknown-linux-musl/release/courier]
  script:
    - make build-panoramic
    - make build-courier COURIER_TARGET=x86_64-unknown-linux-musl

# Scan test/correctness/cases/ and emit a child-pipeline YAML with one job per test
# directory. Each emitted job extends mixins from .gitlab/correctness-mixins.yml.
generate-correctness-pipeline:
  stage: e2e
  image: "${SALUKI_BUILD_CI_IMAGE}"
  needs:
    - build-bundled-agent-adp-image
    - build-correctness-tools-image
    - build-panoramic-binary
  script:
    - bash ci/tooling/generate-correctness-pipeline.sh > generated-correctness.yml
  artifacts:
    paths: [generated-correctness.yml]

# Run the generated child pipeline.
run-correctness-tests:
  stage: e2e
  needs:
    - generate-correctness-pipeline
  variables:
    # Child pipelines inherit the parent's global YAML variables by default,
    # so SALUKI_* are already available. PARENT_PIPELINE_ID is renamed from
    # CI_PIPELINE_ID so the child's `needs:[pipeline: ..., job: ...]` can
    # reference the parent pipeline (in the child, $CI_PIPELINE_ID is its own).
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    # The bundled image uses the parent's Agent selection. Schedule variables don't pass to the child by default.
    PARENT_AGENT_NIGHTLY: $AGENT_NIGHTLY
  trigger:
    include:
      # this is the file we generated in the previous step
      - artifact: generated-correctness.yml
        job: generate-correctness-pipeline
    # folds child status into the parent
    strategy: depend

test-integration:
  stage: e2e
  tags: ["docker-in-docker:amd64"]
  needs:
    - build-bundled-agent-adp-image
    - build-correctness-tools-image
    - build-panoramic-binary
  retry: 2
  timeout: 20m
  image: "${SALUKI_BUILD_CI_IMAGE}"
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  artifacts:
    expire_in: 1 week
    reports:
      junit: $PANORAMIC_LOG_DIR/panoramic.xml
    paths:
      - $PANORAMIC_LOG_DIR/
    when: always
  variables:
    # Bound reporting separately so GitLab still has time to collect the XML and raw logs.
    RUNNER_SCRIPT_TIMEOUT: 15m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 2m
    PANORAMIC_LOG_DIR: integration-logs/${CI_JOB_ID}
    BUNDLED_IMAGE: ${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA}-${CI_PIPELINE_ID}
  before_script:
    # The upload runs in a separate shell. Keep its credentials out of the test processes.
    - unset DD_STS_OIDC_TOKEN DD_API_KEY
  script:
    # Copy the images we built to the local Docker instance, under the tags the Makefile builds locally, so we can
    # share the integration test configurations between CI and local test runs. The correctness-tools image runs the
    # intake participant.
    - docker pull "$BUNDLED_IMAGE"
    - docker inspect --format 'Bundled Agent image {{ index .Config.Labels "agent.image" }}' "$BUNDLED_IMAGE"
    - docker tag "$BUNDLED_IMAGE" saluki-images/datadog-agent:testing-devel
    - docker pull ${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA}
    - docker tag ${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA} saluki-images/correctness-tools:latest
    # Run the panoramic binary and the courier that build-panoramic-binary published, from the repository root.
    - target/release/panoramic run -d $(pwd)/test/integration/cases
  after_script:
    - bash ci/tooling/report-panoramic-results.sh convert integration
    - bash ci/tooling/report-panoramic-results.sh upload

# Runs the integration cases that declare macOS directly on a bare-metal macOS runner. No
# Docker, no virtualization: panoramic spawns ADP (and the Core Agent for converged cases) as
# real macOS processes under /tmp/panoramic, one case at a time. The Datadog Agent is
# installed into a sandbox under /tmp/saluki-dda by the Makefile target (idempotent: re-uses
# the install across runs if the pinned version is already present). The sandbox install never
# touches /opt/datadog-agent, so any system install on the runner is left alone.
.test-integration-macos-base:
  stage: e2e
  needs: []
  retry: 2
  timeout: 38m
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  artifacts:
    expire_in: 1 week
    reports:
      junit: $PANORAMIC_LOG_DIR/panoramic.xml
    paths:
      - $PANORAMIC_LOG_DIR/
    when: always
  variables:
    RUNNER_SCRIPT_TIMEOUT: 30m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    PANORAMIC_LOG_DIR: integration-logs/${CI_JOB_ID}
  before_script:
    - unset DD_STS_OIDC_TOKEN DD_API_KEY
    # Defensive: clean up any leftover Agent/ADP processes from prior runs on this shared
    # runner. All test-Agent ports are shifted out of the canonical range (see `DEFAULT_ENV` in
    # bin/correctness/panoramic/src/participants/datadog_agent.rs), so we don't need to touch a system
    # install at /opt/datadog-agent. We do need to sweep:
    #   - our own Core Agent sandbox under /tmp/saluki-dda (trace-agent / process-agent
    #     children that survived a non-graceful job termination still hold our shifted ports)
    #   - any stranded agent-data-plane process from a prior pipeline (built into
    #     $CI_PROJECT_DIR/target/<profile>/, holds UDP 48125 / TCP 45100–45102 etc. across runs).
    #     Both profiles are swept because BUILD_PROFILE flows from .gitlab-ci.yml workflow
    #     rules: `release` on dev pipelines, `optimized-release` on tagged release pipelines.
    #   - stale Datadog Agent DMG mounts from interrupted installs; these runners persist across jobs.
    #   - the state directory of participant cases, which panoramic refuses to start with while it exists.
    - sudo pkill -9 -f /tmp/saluki-dda/ || true
    - bash ci/tooling/cleanup-macos-dda-mounts.sh || true
    - sudo pkill -9 -f /target/release/agent-data-plane || true
    - sudo pkill -9 -f /target/optimized-release/agent-data-plane || true
    - sudo rm -rf /tmp/panoramic
  script:
    - make test-integration-macos-ci
  after_script:
    # Write the JUnit report first. It needs no network, and a stale mount can stall the diagnostics below.
    - bash ci/tooling/report-panoramic-results.sh convert integration
    # Collect host-level diagnostics into the artifact so we have something to debug from
    # when something fails outside panoramic's per-test log capture (bootstrap-Agent failures,
    # system state, stranded processes from this run). Runs whether the test step passed or
    # failed.
    - mkdir -p "$PANORAMIC_LOG_DIR/host-diag"
    - sw_vers > "$PANORAMIC_LOG_DIR/host-diag/sw_vers.txt" 2>&1 || true
    - uname -a > "$PANORAMIC_LOG_DIR/host-diag/uname.txt" 2>&1 || true
    - mount > "$PANORAMIC_LOG_DIR/host-diag/mount.txt" 2>&1 || true
    - df -h > "$PANORAMIC_LOG_DIR/host-diag/df.txt" 2>&1 || true
    - ps -axo pid,ppid,user,command > "$PANORAMIC_LOG_DIR/host-diag/ps.txt" 2>&1 || true
    - cp /tmp/saluki-agent-bootstrap.log "$PANORAMIC_LOG_DIR/host-diag/saluki-agent-bootstrap.log" 2>/dev/null || true
    - ls -la /tmp/saluki-dda/datadog-agent/etc/ > "$PANORAMIC_LOG_DIR/host-diag/sandbox-etc.txt" 2>&1 || true
    - bash ci/tooling/cleanup-macos-dda-mounts.sh || true
    - bash ci/tooling/report-panoramic-results.sh upload

test-integration-macos-arm64:
  extends:
    - .macos-arm64-test-job
    - .test-integration-macos-base

test-integration-macos-amd64:
  extends:
    - .macos-amd64-test-job
    - .test-integration-macos-base
