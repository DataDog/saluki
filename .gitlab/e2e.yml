build-correctness-tools-image:
  stage: e2e
  image: ${DOCKER_BUILD_IMAGE}
  needs: []
  retry: 2
  timeout: 10m
  script:
    - docker buildx build
      --platform linux/amd64
      --file ./docker/Dockerfile.correctness-tools
      --tag ${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA}
      --build-arg BUILD_IMAGE=${PUBLIC_BASE_IMAGE}
      --build-arg APP_IMAGE=${PUBLIC_BASE_IMAGE}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .

build-bundled-agent-adp-image:
  stage: e2e
  image: ${DOCKER_BUILD_IMAGE}
  needs:
    - build-adp-image
  retry: 2
  timeout: 10m
  script:
    - |
      DD_AGENT_IMAGE="registry.datadoghq.com/agent:${PUBLIC_DD_AGENT_VERSION}"
      if [ "${AGENT_NIGHTLY}" = "true" ]; then # for nightly run, use latest Agent
        DD_AGENT_IMAGE="${NIGHTLY_AGENT_IMAGE:-datadog/agent-dev:master-py3-full}"
        AGENT_IMAGE_REPO="${DD_AGENT_IMAGE%:*}"
        echo "Nightly Agent image config/labels (for debugging):"
        docker buildx imagetools inspect "$DD_AGENT_IMAGE" --format '{{json .Image}}' | jq .
        AGENT_IMAGE_DIGEST=$(docker buildx imagetools inspect "$DD_AGENT_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
        DD_AGENT_IMAGE="${AGENT_IMAGE_REPO}@${AGENT_IMAGE_DIGEST}"
        echo "Pinned nightly Agent image to digest: $DD_AGENT_IMAGE"
      fi
      echo "Building converged image on DD_AGENT_IMAGE=${DD_AGENT_IMAGE}"
    # AGENT_NIGHTLY changes the image contents; schedules sharing a commit need separate tags.
    - docker buildx build
      --platform linux/amd64
      --file ./docker/Dockerfile.datadog-agent
      --tag ${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA}-${CI_PIPELINE_ID}
      --build-arg DD_AGENT_IMAGE="${DD_AGENT_IMAGE}"
      --build-arg ADP_IMAGE=${ADP_FULL_IMAGE_TAG}
      --build-arg BUILD_PROFILE=release
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .

# Compile panoramic and the static Linux courier once for Linux integration and correctness jobs.
build-panoramic-binary:
  extends: .build-common-variables
  stage: e2e
  tags: ["arch:amd64"]
  needs: []
  retry: 2
  timeout: 30m
  image: "${SALUKI_BUILD_CI_IMAGE}"
  artifacts:
    expire_in: 1 day
    paths:
      - target/release/panoramic
      - target/x86_64-unknown-linux-musl/release/panoramic-courier
  script:
    - make build-panoramic
    - make build-courier-linux

# Scan test/correctness/cases/ and emit a child-pipeline YAML with one job per test
# directory. Each emitted job extends mixins from .gitlab/correctness-mixins.yml.
generate-correctness-pipeline:
  stage: e2e
  image: "${SALUKI_BUILD_CI_IMAGE}"
  needs:
    - build-bundled-agent-adp-image
    - build-correctness-tools-image
    - build-panoramic-binary
  script:
    - bash ci/tooling/generate-correctness-pipeline.sh > generated-correctness.yml
  artifacts:
    paths: [generated-correctness.yml]

# Run the generated child pipeline.
run-correctness-tests:
  stage: e2e
  needs:
    - generate-correctness-pipeline
  variables:
    # Child pipelines inherit the parent's global YAML variables by default,
    # so SALUKI_* are already available. PARENT_PIPELINE_ID is renamed from
    # CI_PIPELINE_ID so the child's `needs:[pipeline: ..., job: ...]` can
    # reference the parent pipeline (in the child, $CI_PIPELINE_ID is its own).
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    include:
      # this is the file we generated in the previous step
      - artifact: generated-correctness.yml
        job: generate-correctness-pipeline
    # folds child status into the parent
    strategy: depend

test-container-daemon:
  stage: e2e
  tags: ["docker-in-docker:amd64"]
  image: "${SALUKI_BUILD_CI_IMAGE}"
  needs: []
  retry: {max: 2, when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure, api_failure]}
  timeout: 15m
  variables:
    # Daemon tests require a preloaded image.
    AIRLOCK_TEST_IMAGE: registry.ddbuild.io/alpine:latest
    PANORAMIC_TEST_IMAGE: registry.ddbuild.io/alpine:latest
  script:
    - docker pull registry.ddbuild.io/alpine:latest
    # A rootless daemon lists `name=rootless` among its security options.
    - docker info --format 'Docker {{.ServerVersion}} {{.OSType}}/{{.Architecture}} security={{json .SecurityOptions}}'
    - make test-airlock-daemon
    - make test-panoramic-daemon

test-integration:
  stage: e2e
  tags: ["docker-in-docker:amd64"]
  needs:
    - build-bundled-agent-adp-image
    - build-correctness-tools-image
    - job: build-panoramic-binary
      artifacts: true
  retry: 2
  timeout: 15m
  image: "${SALUKI_BUILD_CI_IMAGE}"
  artifacts:
    expire_in: 1 week
    paths:
      - integration-logs/
    when: always
  variables:
    PANORAMIC_LOG_DIR: integration-logs
  script:
    # Bind the pipeline images, permission fix-up image and Linux courier.
    # panoramic and the courier come from build-panoramic-binary.
    - target/release/panoramic artifacts render
      --set agent-adp-linux-image=${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA}-${CI_PIPELINE_ID}
      --set tools-linux-image=${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA}
      --set fixup-image=registry.ddbuild.io/alpine:latest
      --set courier-linux-binary=target/x86_64-unknown-linux-musl/release/panoramic-courier
      --output target/panoramic-artifacts.toml
    - target/release/panoramic artifacts pull -d test/integration/cases --subject-os linux --artifacts target/panoramic-artifacts.toml
    - make run-integration-quick PANORAMIC_ARTIFACTS=target/panoramic-artifacts.toml

# Runs the subset of integration tests that list `macos` in `subject_os`
# directly on a bare-metal macOS runner. No Docker, no virtualization: panoramic spawns ADP
# (and the Core Agent for converged tests) as real macOS processes against a per-test temp
# state directory. The Datadog Agent is installed into a sandbox under /tmp/saluki-dda by
# the Makefile target (idempotent: re-uses the install across runs if the pinned version is
# already present). The sandbox install never touches /opt/datadog-agent, so any system
# install on the runner is left alone.
.test-integration-macos-base:
  stage: e2e
  needs: []
  retry: 2
  timeout: 30m
  artifacts:
    expire_in: 1 week
    paths:
      - integration-logs/
    when: always
  variables:
    PANORAMIC_LOG_DIR: integration-logs
  before_script:
    # Defensive: clean up any leftover Agent/ADP processes from prior runs on this shared
    # runner. Participant listener ports are assigned per case, so we don't need to touch a system
    # install at /opt/datadog-agent. We do need to sweep:
    #   - our own Core Agent sandbox under /tmp/saluki-dda (trace-agent / process-agent
    #     children that survived a non-graceful job termination still hold ports)
    #   - any stranded agent-data-plane process from a prior pipeline (built into
    #     $CI_PROJECT_DIR/target/<profile>/).
    #     Both profiles are swept because BUILD_PROFILE flows from .gitlab-ci.yml workflow
    #     rules: `release` on dev pipelines, `optimized-release` on tagged release pipelines.
    #   - stale Datadog Agent DMG mounts from interrupted installs; these runners persist across jobs.
    - sudo pkill -9 -f /tmp/saluki-dda/ || true
    - bash ci/tooling/cleanup-macos-dda-mounts.sh || true
    - sudo pkill -9 -f /target/release/agent-data-plane || true
    - sudo pkill -9 -f /target/optimized-release/agent-data-plane || true
  script:
    - make test-integration-macos-ci
  after_script:
    # Collect host-level diagnostics into the artifact so we have something to debug from
    # when something fails outside panoramic's per-test log capture (bootstrap-Agent failures,
    # system state, stranded processes from this run). Runs whether the test step passed or
    # failed.
    - mkdir -p integration-logs/host-diag
    - sw_vers > integration-logs/host-diag/sw_vers.txt 2>&1 || true
    - uname -a > integration-logs/host-diag/uname.txt 2>&1 || true
    - mount > integration-logs/host-diag/mount.txt 2>&1 || true
    - df -h > integration-logs/host-diag/df.txt 2>&1 || true
    - ps -axo pid,ppid,user,command > integration-logs/host-diag/ps.txt 2>&1 || true
    - cp /tmp/saluki-agent-bootstrap.log integration-logs/host-diag/saluki-agent-bootstrap.log 2>/dev/null || true
    - ls -la /tmp/saluki-dda/datadog-agent/etc/ > integration-logs/host-diag/sandbox-etc.txt 2>&1 || true
    - bash ci/tooling/cleanup-macos-dda-mounts.sh || true

test-integration-macos-arm64:
  extends:
    - .macos-arm64-test-job
    - .test-integration-macos-base

test-integration-macos-amd64:
  extends:
    - .macos-amd64-test-job
    - .test-integration-macos-base
