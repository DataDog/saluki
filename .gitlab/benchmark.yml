  extends: .build-common-variables
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Build on PRs (development branches) and on the nightly schedule; never on MQ branches.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_smp_nightly, rules, if]
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs: []
  retry: 2
  timeout: 15m
  before_script:
    - *setup-smp-env
  script:
    # Initialize our AWS credentials.
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Resolve the comparison commit and define the relevant variables: the current commit on
    # PRs, or the date-anchored "current nightly" on the schedule. See
    # ci/tooling/compute-smp-sha.sh.
    - export COMPARISON_ADP_SHA=$(./ci/tooling/compute-smp-sha.sh comparison)
    - export COMPARISON_ADP_IMG="${ADP_IMG_BASE}-${COMPARISON_ADP_SHA}"
    - git switch --detach ${COMPARISON_ADP_SHA}
    # Actually build.
