.setup-smp-env: &setup-smp-env
  - export AWS_NAMED_PROFILE=single-machine-performance
  - export SMP_VERSION=0.29.1
  - export RUST_LOG=info,aws_config::profile::credentials=error
  - export SMP_ACCOUNT_ID=$(aws ssm get-parameter --region us-east-1 --name ci.saluki.smp-account-id --with-decryption --query "Parameter.Value" --out text)
  - export SMP_TEAM_ID=$(aws ssm get-parameter --region us-east-1 --name ci.saluki.smp-team-id --with-decryption --query "Parameter.Value" --out text)
  - export SINGLE_MACHINE_PERFORMANCE_API=$(aws ssm get-parameter --region us-east-1 --name ci.saluki.smp-api --with-decryption --query "Parameter.Value" --out text)
  - export SMP_ECR_HOST="${SMP_ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com"
  - export ADP_IMG_BASE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:adp-${CI_PIPELINE_ID}"
  - export ADP_CHECKS_IMG_BASE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:adp-checks-${CI_PIPELINE_ID}"
  - export SMP_IMG_BASE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:agent-adp-${CI_PIPELINE_ID}"
  - git fetch --verbose --deepen=999 origin ${CI_COMMIT_BRANCH} main

# Layer the ADP image at ${ADP_IMG} into the converged Datadog Agent image and push it as
# ${SMP_IMG}. Both the baseline and comparison build jobs end with this.
#
# SMP fixes one target image per job, and the tag filtering experiments need the Core Agent in the
# picture: a `metric_tag_filterlist` is Agent configuration, and only reaches ADP over the config
# stream. So every experiment runs against the converged image; the ones that don't care about the
# Core Agent simply override the command to run ADP by itself, as they always have.
.build-smp-target-image: &build-smp-target-image
  - docker buildx build
    --file ./docker/Dockerfile.datadog-agent
    --tag ${SMP_IMG}
    --build-arg DD_AGENT_IMAGE=registry.datadoghq.com/agent:${PUBLIC_DD_AGENT_VERSION}
    --build-arg ADP_IMAGE=${ADP_IMG}
    --label git.repository=${CI_PROJECT_NAME}
    --label git.branch=${CI_COMMIT_REF_NAME}
    --label git.commit=${CI_COMMIT_SHA}
    --label ci.pipeline_id=${CI_PIPELINE_ID}
    --label ci.job_id=${CI_JOB_ID}
    --push
    .

build-adp-baseline-image:
  extends: .build-common-variables
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Build on PRs (development branches) and on the nightly schedule; never on MQ branches.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_smp_nightly, rules, if]
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs: []
  retry: 2
  timeout: 15m
  before_script:
    - *setup-smp-env
  script:
    # Initialize our AWS credentials.
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Resolve the baseline commit and define the relevant variables.
    #
    # On PRs this is the merge base of the current branch, relative to `main` (so for stacked PRs
    # we benchmark against the base of the stack, not a mid-stack PR — an acceptable tradeoff).
    # On the nightly schedule it is the date-anchored "previous nightly". See
    # ci/tooling/compute-smp-sha.sh.
    - export BASELINE_ADP_SHA=$(./ci/tooling/compute-smp-sha.sh baseline)
    - export BASELINE_ADP_IMG="${ADP_IMG_BASE}-${BASELINE_ADP_SHA}"
    - git switch --detach ${BASELINE_ADP_SHA}
    # Actually build.
    - aws ecr get-login-password --region us-west-2 --profile ${AWS_NAMED_PROFILE} | docker login --username AWS --password-stdin ${SMP_ECR_HOST}
    - docker buildx create --name adp-builder --driver docker-container --use
    - docker buildx build
      --file ./docker/Dockerfile.agent-data-plane
      --tag ${BASELINE_ADP_IMG}
      --build-arg BUILD_PROFILE=release
      --build-arg BUILD_TARGET=x86_64-unknown-linux-gnu
      --build-arg BUILD_IMAGE=${ADP_PUBLIC_BASE_IMAGE}
      --build-arg SPDX_LICENSES_IMAGE=${SPDX_LICENSES_IMAGE}
      --build-arg APP_IMAGE=${GBI_BASE_IMAGE}
      --build-arg APP_GIT_HASH=${BASELINE_ADP_SHA}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .
    # Bundle that ADP build into the converged Datadog Agent image, which is the image SMP
    # actually runs.
    - export ADP_IMG="${BASELINE_ADP_IMG}"
    - export SMP_IMG="${SMP_IMG_BASE}-${BASELINE_ADP_SHA}"
    - *build-smp-target-image
    # Generate our image SHA/path for the runner job to use.
    - echo "BASELINE_ADP_SHA=${BASELINE_ADP_SHA}" >> smp-vars.env
    - echo "BASELINE_ADP_IMG=${BASELINE_ADP_IMG}" >> smp-vars.env
    - echo "BASELINE_SMP_IMG=${SMP_IMG}" >> smp-vars.env
  artifacts:
    reports:
      dotenv: smp-vars.env

