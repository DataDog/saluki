# The git checkout for every SMP job. The jobs need only the files at the pipeline commit, so a
# depth of one is sufficient. To find the baseline commit or the nightly commits,
# ci/tooling/compute-smp-sha.sh fetches the history that it needs into a separate repository.
# That history fetch takes some seconds. A full checkout (`GIT_DEPTH: "0"`) takes about 50
# seconds on the image job runners.
#
# We also disable the runner's git cache. When the cache is not on the runner, the runner first
# clones the full repository into it, which takes about 30 seconds. When the cache is on the
# runner, the checkout from the cache takes about a minute on the image job runners. A shallow
# checkout without the cache takes some seconds.
.smp-checkout:
  variables:
    GIT_DEPTH: "1"
    DISABLE_GIT_CACHE: "true"

# The settings that every SMP job needs, to get the SMP CLI and to configure AWS credentials.
.setup-smp-cli-env: &setup-smp-cli-env
  - export AWS_NAMED_PROFILE=single-machine-performance
  - export SMP_VERSION=0.30.0
  - export RUST_LOG=info,aws_config::profile::credentials=error

# The settings for the jobs that build images, or that talk to the SMP API.
.setup-smp-env: &setup-smp-env
  - *setup-smp-cli-env
  # The Cargo profile for the SMP baseline and comparison images. We use the profile we ship, so that SMP and the
  # binary size analysis measure the production binary. The correctness tests build with `release` and cover debug
  # assertions.
  - export SMP_BUILD_PROFILE=optimized-release
  - export SMP_ACCOUNT_ID=$(aws ssm get-parameter --region us-east-1 --name ci.saluki.smp-account-id --with-decryption --query "Parameter.Value" --out text)
  - export SMP_TEAM_ID=$(aws ssm get-parameter --region us-east-1 --name ci.saluki.smp-team-id --with-decryption --query "Parameter.Value" --out text)
  - export SINGLE_MACHINE_PERFORMANCE_API=$(aws ssm get-parameter --region us-east-1 --name ci.saluki.smp-api --with-decryption --query "Parameter.Value" --out text)
  - export SMP_ECR_HOST="${SMP_ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com"
  - export ADP_IMG_BASE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:adp-${CI_PIPELINE_ID}"
  - export ADP_CHECKS_IMG_BASE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:adp-checks-${CI_PIPELINE_ID}"
  - export SMP_IMG_BASE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:agent-adp-${CI_PIPELINE_ID}"

# Layer the ADP image at ${ADP_IMG} into the converged Datadog Agent image at ${SMP_AGENT_IMAGE}, and
# push it as ${SMP_IMG}. Both the baseline and comparison build jobs end with this.
#
# SMP fixes one target image per job, and the tag filtering experiments need the Core Agent in the
# picture: a `metric_tag_filterlist` is Agent configuration, and only reaches ADP over the config
# stream. So every experiment runs against the converged image; the ones that don't care about the
# Core Agent simply override the command to run ADP by itself, as they always have.
.build-smp-target-image: &build-smp-target-image
  - docker buildx build
    --file ./docker/Dockerfile.datadog-agent
    --tag ${SMP_IMG}
    --build-arg DD_AGENT_IMAGE=${SMP_AGENT_IMAGE}
    --build-arg ADP_IMAGE=${ADP_IMG}
    --label git.repository=${CI_PROJECT_NAME}
    --label git.branch=${CI_COMMIT_REF_NAME}
    --label git.commit=${CI_COMMIT_SHA}
    --label ci.pipeline_id=${CI_PIPELINE_ID}
    --label ci.job_id=${CI_JOB_ID}
    --push
    .

# Resolve, and build if needed, the slim SMP build image at ${SMP_BUILD_IMAGE} (see
# ci/images/definitions/smp-build/Dockerfile). Pulling it costs much less time than pulling all of `build-ci`.
#
# The tag is a hash of the image inputs: the Dockerfile and the digests of the two images it starts from. Thus a job
# builds and pushes the image only when an input changes, and other jobs reuse it. This must run before a job switches
# to the commit that it builds. Thus the image always comes from the Dockerfile of the pipeline commit. It needs the ECR
# login and the `adp-builder` builder.
.resolve-smp-build-image: &resolve-smp-build-image
  - SMP_BUILD_BASE_DIGEST=$(docker buildx imagetools inspect ${SMP_BUILD_BASE_IMAGE} --format '{{json .Manifest}}' | jq -er .digest) || exit 1
  - SMP_BUILD_TOOLCHAIN_DIGEST=$(docker buildx imagetools inspect ${ADP_BUILD_IMAGE} --format '{{json .Manifest}}' | jq -er .digest) || exit 1
  - SMP_BUILD_INPUTS_HASH=$( (cat ci/images/definitions/smp-build/Dockerfile; echo ${SMP_BUILD_BASE_DIGEST} ${SMP_BUILD_TOOLCHAIN_DIGEST}) | sha256sum | cut -c1-16)
  - export SMP_BUILD_IMAGE="${SMP_ECR_HOST}/${SMP_TEAM_ID}-saluki:smp-build-${SMP_BUILD_INPUTS_HASH}"
  # The repositories of the two source images, without a tag or a digest. We pin each one to the digest from above.
  - SMP_BUILD_BASE_REPO=${SMP_BUILD_BASE_IMAGE%%@*}
  - SMP_BUILD_BASE_REPO=${SMP_BUILD_BASE_REPO%:*}
  - SMP_BUILD_TOOLCHAIN_REPO=${ADP_BUILD_IMAGE%%@*}
  - SMP_BUILD_TOOLCHAIN_REPO=${SMP_BUILD_TOOLCHAIN_REPO%:*}
  - echo "SMP build image is ${SMP_BUILD_IMAGE} (base ${SMP_BUILD_BASE_DIGEST}, toolchain ${SMP_BUILD_TOOLCHAIN_DIGEST})"
  - |
    if docker buildx imagetools inspect ${SMP_BUILD_IMAGE} > /dev/null 2>&1; then
      echo "Reusing the existing SMP build image."
    else
      echo "Building the SMP build image."
      docker buildx build \
        --file ./ci/images/definitions/smp-build/Dockerfile \
        --build-arg BASE_IMAGE=${SMP_BUILD_BASE_REPO}@${SMP_BUILD_BASE_DIGEST} \
        --build-arg TOOLCHAIN_IMAGE=${SMP_BUILD_TOOLCHAIN_REPO}@${SMP_BUILD_TOOLCHAIN_DIGEST} \
        --tag ${SMP_BUILD_IMAGE} \
        --output type=registry,compression=zstd,force-compression=true,oci-mediatypes=true \
        --provenance=false \
        ci/images/definitions/smp-build
    fi

# Shared settings for the SMP baseline and comparison image builds. They build on the slim SMP build image (see
# `.resolve-smp-build-image`), with the same shared compiler cache as the shipped artifacts (see
# `.build-adp-definition`). `.build-amd64-variables` gives DinD the larger loopback volume: with the default 20G
# volume, the final LTO link fails with "No space left on device".
.smp-adp-image-build:
  extends: [.build-common-variables, .build-amd64-variables, .buildcache-variables]
  variables:
    # The base of the slim SMP build image. It is a separate variable so that it can change independently of the base
    # of the shipped app image (`ADP_PUBLIC_BASE_IMAGE`).
    SMP_BUILD_BASE_IMAGE: "${PUBLIC_BASE_IMAGE}"

build-adp-baseline-image:
  extends: [.smp-adp-image-build, .smp-checkout]
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Build on PRs (development branches) and on the nightly schedule; never on MQ branches.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_smp_nightly, rules, if]
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs: []
  retry: 2
  # Fat LTO with a single codegen unit (`optimized-release`) takes roughly 15 minutes to build.
  timeout: 30m
  before_script:
    - *setup-smp-env
  script:
    # Initialize our AWS credentials.
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Resolve the baseline commit and define the relevant variables.
    #
    # On PRs this is the merge base of the current branch, relative to `main` (so for stacked PRs
    # we benchmark against the base of the stack, not a mid-stack PR — an acceptable tradeoff).
    # On the nightly schedule it is the date-anchored "previous nightly". See
    # ci/tooling/compute-smp-sha.sh.
    #
    # The assignment and the export are separate commands. `export` would hide the exit code of
    # the script, and the job would then build the pipeline commit as the baseline.
    - BASELINE_ADP_SHA=$(./ci/tooling/compute-smp-sha.sh baseline)
    - export BASELINE_ADP_SHA
    - export BASELINE_ADP_IMG="${ADP_IMG_BASE}-${BASELINE_ADP_SHA}"
    # Both sides run the Agent from the pipeline commit's `.datadog-agent-version.json`, read before the switch, so
    # the comparison measures only the ADP change. The baseline commit may predate the file.
    - SMP_AGENT_IMAGE=$(jq -er '.integration.linux.image' .datadog-agent-version.json) || exit 1
    - export SMP_AGENT_IMAGE
    - aws ecr get-login-password --region us-west-2 --profile ${AWS_NAMED_PROFILE} | docker login --username AWS --password-stdin ${SMP_ECR_HOST}
    - docker buildx create --name adp-builder --driver docker-container --use
    - *resolve-smp-build-image
    - git switch --detach ${BASELINE_ADP_SHA}
    # Actually build.
    # Temporary credentials (from the runner's own IAM role, not the SMP profile) for the shared build cache.
    - ci/tooling/get-temporary-aws-credentials.sh
    # We don't pass `APP_GIT_HASH`. `saluki-metadata` embeds it, so a new value on each commit invalidates that crate
    # and every crate that depends on it in the build cache, including `saluki-components`. The binary then reports
    # an unknown Git hash. The image tag still identifies the built commit.
    - docker buildx build
      --file ./docker/Dockerfile.agent-data-plane
      --tag ${BASELINE_ADP_IMG}
      --build-arg BUILD_PROFILE=${SMP_BUILD_PROFILE}
      --build-arg BUILD_TARGET=${BUILD_TARGET}
      --build-arg BUILD_IMAGE=${SMP_BUILD_IMAGE}
      --build-arg BUILD_BASE=build-prepped
      --build-arg BUILDCACHE_IMAGE=${SALUKI_BUILDCACHE_CI_IMAGE}
      --build-arg BUILDCACHE_REMOTE=s3://s3.${BUILDCACHE_S3_REGION}.amazonaws.com/${BUILDCACHE_S3_BUCKET}
      --secret id=aws-creds,src=/tmp/temporary-aws-credentials.sh
      --build-arg SPDX_LICENSES_IMAGE=${SPDX_LICENSES_IMAGE}
      --build-arg APP_IMAGE=${GBI_BASE_IMAGE}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .
    # Bundle that ADP build into the converged Datadog Agent image, which is the image SMP
    # actually runs.
    - export ADP_IMG="${BASELINE_ADP_IMG}"
    - export SMP_IMG="${SMP_IMG_BASE}-${BASELINE_ADP_SHA}"
    - *build-smp-target-image
    # Generate our image SHA/path for the runner job to use.
    - echo "BASELINE_ADP_SHA=${BASELINE_ADP_SHA}" >> smp-vars.env
    - echo "BASELINE_ADP_IMG=${BASELINE_ADP_IMG}" >> smp-vars.env
    - echo "BASELINE_SMP_IMG=${SMP_IMG}" >> smp-vars.env
  artifacts:
    reports:
      dotenv: smp-vars.env

build-adp-comparison-image:
  extends: [.smp-adp-image-build, .smp-checkout]
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Build on PRs (development branches) and on the nightly schedule; never on MQ branches.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_smp_nightly, rules, if]
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs: []
  retry: 2
  # Fat LTO with a single codegen unit (`optimized-release`) takes roughly 15 minutes to build.
  timeout: 30m
  before_script:
    - *setup-smp-env
  script:
    # Initialize our AWS credentials.
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Resolve the comparison commit and define the relevant variables: the current commit on
    # PRs, or the date-anchored "current nightly" on the schedule. See
    # ci/tooling/compute-smp-sha.sh.
    #
    # The assignment and the export are separate commands, as in build-adp-baseline-image.
    - COMPARISON_ADP_SHA=$(./ci/tooling/compute-smp-sha.sh comparison)
    - export COMPARISON_ADP_SHA
    - export COMPARISON_ADP_IMG="${ADP_IMG_BASE}-${COMPARISON_ADP_SHA}"
    # The same Agent as the baseline: see build-adp-baseline-image.
    - SMP_AGENT_IMAGE=$(jq -er '.integration.linux.image' .datadog-agent-version.json) || exit 1
    - export SMP_AGENT_IMAGE
    - aws ecr get-login-password --region us-west-2 --profile ${AWS_NAMED_PROFILE} | docker login --username AWS --password-stdin ${SMP_ECR_HOST}
    - docker buildx create --name adp-builder --driver docker-container --use
    - *resolve-smp-build-image
    - git switch --detach ${COMPARISON_ADP_SHA}
    # Actually build.
    # Temporary credentials (from the runner's own IAM role, not the SMP profile) for the shared build cache.
    - ci/tooling/get-temporary-aws-credentials.sh
    # We don't pass `APP_GIT_HASH`, to keep the build cache warm: see build-adp-baseline-image.
    - docker buildx build
      --file ./docker/Dockerfile.agent-data-plane
      --tag ${COMPARISON_ADP_IMG}
      --build-arg BUILD_PROFILE=${SMP_BUILD_PROFILE}
      --build-arg BUILD_TARGET=${BUILD_TARGET}
      --build-arg BUILD_IMAGE=${SMP_BUILD_IMAGE}
      --build-arg BUILD_BASE=build-prepped
      --build-arg BUILDCACHE_IMAGE=${SALUKI_BUILDCACHE_CI_IMAGE}
      --build-arg BUILDCACHE_REMOTE=s3://s3.${BUILDCACHE_S3_REGION}.amazonaws.com/${BUILDCACHE_S3_BUCKET}
      --secret id=aws-creds,src=/tmp/temporary-aws-credentials.sh
      --build-arg SPDX_LICENSES_IMAGE=${SPDX_LICENSES_IMAGE}
      --build-arg APP_IMAGE=${GBI_BASE_IMAGE}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .
    # Bundle that ADP build into the converged Datadog Agent image, which is the image SMP
    # actually runs.
    - export ADP_IMG="${COMPARISON_ADP_IMG}"
    - export SMP_IMG="${SMP_IMG_BASE}-${COMPARISON_ADP_SHA}"
    - *build-smp-target-image
    # Generate our image SHA/path for the runner job to use.
    - echo "COMPARISON_ADP_SHA=${COMPARISON_ADP_SHA}" >> smp-vars.env
    - echo "COMPARISON_ADP_IMG=${COMPARISON_ADP_IMG}" >> smp-vars.env
    - echo "COMPARISON_SMP_IMG=${SMP_IMG}" >> smp-vars.env
  artifacts:
    reports:
      dotenv: smp-vars.env

run-benchmarks-adp:
  extends: .smp-checkout
  stage: benchmark
  # PR gate: run only the quality-gates suite (the experiments with bounds). Runs on PRs
  # (development branches); never on MQ branches. The full suite runs nightly / on-demand below.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
  timeout: 1h
  needs:
    - build-adp-baseline-image
    - build-adp-comparison-image
  image: "${SALUKI_SMP_CI_IMAGE}"
  before_script:
    - *setup-smp-env
  artifacts:
    expire_in: 1 weeks
    paths:
      - submission_metadata # for provenance, debugging
      - outputs/report.v1.json # input of the condensed report, also on S3
    when: always
  script:
    # Do some pre-flight steps like creating directories, installing helper utilities, setting credentials, and so on.
    - mkdir -p outputs
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Download the SMP binary.
    - aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/v${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp && chmod +x smp
    # Trigger the SMP job run.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job submit
      --warmup-seconds 0
      --baseline-image ${BASELINE_SMP_IMG}
      --comparison-image ${COMPARISON_SMP_IMG}
      --baseline-sha ${BASELINE_ADP_SHA}
      --comparison-sha ${COMPARISON_ADP_SHA}
      --target-config-dir ./test/smp/regression/adp/quality-gates/
      --submission-metadata submission_metadata
    # Wait for job to complete.
    #
    # We poll every 20 seconds. On average, the job sees that the SMP job is complete half of a
    # poll interval after it completes, so a short interval keeps that delay to about 10 seconds.
    # Each poll is one small status request.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job status
      --wait
      --wait-delay-seconds 20
      --submission-metadata submission_metadata
    # Pull the analysis report and output it to stdout.
    #
    # The condensed PR comment is posted from the `report-benchmarks-adp`
    # downstream job so we still get a comment even if `job result` below
    # exits non-zero.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job sync
      --submission-metadata submission_metadata
      --output-path outputs
    # Finally, exit 1 if the job signals a regression else 0.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job result
      --submission-metadata submission_metadata

report-benchmarks-adp:
  extends: .smp-checkout
  stage: benchmark
  # Build a condensed report from run-benchmarks-adp's report.v1.json and post it
  # to the linked PR. Runs whether or not `run-benchmarks-adp` succeeded so a
  # comment is posted even when SMP signals a regression (and the parent job
  # exits non-zero).
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
      when: always
  needs:
    - job: run-benchmarks-adp
      artifacts: true
  image: "${SALUKI_SMP_CI_IMAGE}"
  timeout: 5m
  artifacts:
    expire_in: 1 week
    paths:
      - outputs/condensed-report.md
    when: always
  # This job only renders the report and posts it, so it needs only the SMP CLI. It does not
  # build images or call the SMP API.
  before_script:
    - *setup-smp-cli-env
  script:
    # Do some pre-flight steps like creating directories, installing helper utilities, setting credentials, and so on.
    - mkdir -p outputs
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Download the SMP binary.
    - aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/v${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp && chmod +x smp
    - python3 ./ci/tooling/build-smp-report.py
      --report-json outputs/report.v1.json
      --output-report outputs/condensed-report.md
      --smp-binary ./smp
    - cat outputs/condensed-report.md | /usr/local/bin/pr-commenter --for-pr="$CI_COMMIT_REF_NAME" --header="Regression Detector (Agent Data Plane)"

run-benchmarks-adp-full:
  extends: .smp-checkout
  stage: benchmark
  # The full SMP suite (superset of all experiments). Runs automatically on the nightly schedule
  # for long-term trend analysis, and on-demand as a manual job on a PR. This is NOT a PR gate:
  # it does not run `smp job result`, so it never fails the pipeline on a regression. It builds
  # and delivers its own report inline (Slack on the nightly, PR comment on-demand).
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_smp_nightly, rules, if]
    - if: !reference [.on_development_branch, rules, if]
      when: manual
      allow_failure: true
  timeout: 2h
  needs:
    - build-adp-baseline-image
    - build-adp-comparison-image
  image: "${SALUKI_SMP_CI_IMAGE}"
  before_script:
    - *setup-smp-env
  artifacts:
    expire_in: 1 weeks
    paths:
      - submission_metadata # for provenance, debugging
      - outputs/report.v1.json # input of the condensed report, also on S3
      - outputs/condensed-report.md # the posted report, for debugging
    when: always
  script:
    # Do some pre-flight steps like creating directories, installing helper utilities, setting credentials, and so on.
    - mkdir -p outputs
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Download the SMP binary.
    - aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/v${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp && chmod +x smp
    - echo "Running full suite -- baseline ${BASELINE_ADP_SHA}, comparison ${COMPARISON_ADP_SHA}."
    # Trigger the SMP job run against the full suite.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job submit
      --warmup-seconds 0
      --baseline-image ${BASELINE_SMP_IMG}
      --comparison-image ${COMPARISON_SMP_IMG}
      --baseline-sha ${BASELINE_ADP_SHA}
      --comparison-sha ${COMPARISON_ADP_SHA}
      --target-config-dir ./test/smp/regression/adp/full/
      --submission-metadata submission_metadata
    # Wait for job to complete. For the poll interval, see run-benchmarks-adp.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job status
      --wait
      --wait-delay-seconds 20
      --submission-metadata submission_metadata
    # Pull the analysis report, then build and deliver the condensed report. We intentionally do
    # NOT run `job result` here: the full suite is for trend analysis, not gating.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job sync
      --submission-metadata submission_metadata
      --output-path outputs
    # Condense the report and deliver it. Reporting lives in this job (rather than a separate
    # one) because the on-demand run is an optional manual job: a separate `needs`-based report
    # job would run even when the manual job is not triggered, since GitLab does not block
    # dependents on an un-triggered `allow_failure` manual job.
    - python3 ./ci/tooling/build-smp-report.py
      --report-json outputs/report.v1.json
      --output-report outputs/condensed-report.md
      --smp-binary ./smp
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        ./ci/tooling/report-smp-to-slack.sh outputs/condensed-report.md
      else
        cat outputs/condensed-report.md | /usr/local/bin/pr-commenter --for-pr="$CI_COMMIT_REF_NAME" --header="Regression Detector (Agent Data Plane, full suite)"
      fi

binary-size-analysis:
  extends: .smp-checkout
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Don't run binary size analysis unless it's a PR, basically.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs:
    - build-adp-baseline-image
    - build-adp-comparison-image
  timeout: 10m
  before_script:
    - *setup-smp-env
  artifacts:
    expire_in: 1 week
    paths:
      - size-diff.csv
      - size-diff.txt
      - size-report.md
    when: always
  script:
    # Initialize our AWS credentials and login to ECR.
    - ./ci/tooling/configure-smp-aws-credentials.sh
    - aws ecr get-login-password --region us-west-2 --profile ${AWS_NAMED_PROFILE} | docker login --username AWS --password-stdin ${SMP_ECR_HOST}

    # Extract binaries from the container images.
    - mkdir -p binaries
    - docker pull ${BASELINE_ADP_IMG}
    - docker create --name baseline-container ${BASELINE_ADP_IMG}
    - docker cp baseline-container:/usr/local/bin/agent-data-plane binaries/baseline-adp
    - docker rm baseline-container
    - docker pull ${COMPARISON_ADP_IMG}
    - docker create --name comparison-container ${COMPARISON_ADP_IMG}
    - docker cp comparison-container:/usr/local/bin/agent-data-plane binaries/comparison-adp
    - docker rm comparison-container

    # Extract debug info and strip binaries for accurate release size comparison.
    # The strip flags match the flags that the Datadog Agent's Linux packaging applies to ADP, so the stripped size
    # is the size that ships. The separate debug files keep the symbol information for bloaty's analysis. The Agent
    # strips its install directory with omnibus `strip_build`, which runs `strip --strip-debug --strip-unneeded`:
    # https://github.com/DataDog/datadog-agent/blob/ef7d0646bc86573f1c370f866d606d7ad5391179/omnibus/config/projects/agent.rb#L391
    # https://github.com/DataDog/omnibus-ruby/blob/564a6f11686c655771da48765ae65a11c479d625/lib/omnibus/stripper.rb#L95
    - objcopy --only-keep-debug binaries/baseline-adp binaries/baseline-adp.debug
    - objcopy --only-keep-debug binaries/comparison-adp binaries/comparison-adp.debug
    - strip --strip-debug --strip-unneeded binaries/baseline-adp
    - strip --strip-debug --strip-unneeded binaries/comparison-adp

    # Run the analysis script to generate bloaty output, markdown report, and check threshold.
    # The script exits with code 1 if size increased by more than 5%.
    - python3 ./ci/tooling/analyze-binary-size.py
      --baseline-binary binaries/baseline-adp
      --baseline-debug binaries/baseline-adp.debug
      --baseline-sha ${BASELINE_ADP_SHA}
      --comparison-binary binaries/comparison-adp
      --comparison-debug binaries/comparison-adp.debug
      --comparison-sha ${COMPARISON_ADP_SHA}
      --bloaty-path /usr/local/bin/bloaty
      --output-report size-report.md
      --output-csv size-diff.csv
      --output-txt size-diff.txt
      --threshold 5
      --build-profile ${SMP_BUILD_PROFILE}

    # Post the report to the linked PR.
    - cat size-report.md | /usr/local/bin/pr-commenter --for-pr="$CI_COMMIT_REF_NAME" --header="Binary Size Analysis (Agent Data Plane)"
