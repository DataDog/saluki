    - docker buildx create --name adp-builder --driver docker-container --use
    - docker buildx build
      --file ./docker/Dockerfile.agent-data-plane
      --tag ${COMPARISON_ADP_IMG}
      --build-arg BUILD_PROFILE=release
      --build-arg BUILD_TARGET=x86_64-unknown-linux-gnu
      --build-arg BUILD_IMAGE=${ADP_PUBLIC_BASE_IMAGE}
      --build-arg SPDX_LICENSES_IMAGE=${SPDX_LICENSES_IMAGE}
      --build-arg APP_IMAGE=${GBI_BASE_IMAGE}
      --build-arg APP_GIT_HASH=${COMPARISON_ADP_SHA}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .
    # Bundle that ADP build into the converged Datadog Agent image, which is the image SMP
    # actually runs.
    - export ADP_IMG="${COMPARISON_ADP_IMG}"
    - export SMP_IMG="${SMP_IMG_BASE}-${COMPARISON_ADP_SHA}"
    - *build-smp-target-image
    # Generate our image SHA/path for the runner job to use.
    - echo "COMPARISON_ADP_SHA=${COMPARISON_ADP_SHA}" >> smp-vars.env
    - echo "COMPARISON_ADP_IMG=${COMPARISON_ADP_IMG}" >> smp-vars.env
    - echo "COMPARISON_SMP_IMG=${SMP_IMG}" >> smp-vars.env
  artifacts:
    reports:
      dotenv: smp-vars.env

run-benchmarks-adp:
  stage: benchmark
  # PR gate: run only the quality-gates suite (the experiments with bounds). Runs on PRs
  # (development branches); never on MQ branches. The full suite runs nightly / on-demand below.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
  timeout: 1h
  needs:
    - build-adp-baseline-image
    - build-adp-comparison-image
  image: "${SALUKI_SMP_CI_IMAGE}"
  before_script:
    - *setup-smp-env
  artifacts:
    expire_in: 1 weeks
    paths:
      - submission_metadata # for provenance, debugging
      - outputs/report.v1.json # input of the condensed report, also on S3
    when: always
  script:
    # Do some pre-flight steps like creating directories, installing helper utilities, setting credentials, and so on.
    - mkdir -p outputs
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Download the SMP binary.
    - aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/v${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp && chmod +x smp
    # Trigger the SMP job run.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job submit
      --warmup-seconds 0
      --baseline-image ${BASELINE_SMP_IMG}
      --comparison-image ${COMPARISON_SMP_IMG}
      --baseline-sha ${BASELINE_ADP_SHA}
      --comparison-sha ${COMPARISON_ADP_SHA}
      --target-config-dir ./test/smp/regression/adp/quality-gates/
      --submission-metadata submission_metadata
    # Wait for job to complete.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job status
      --wait
      --wait-delay-seconds 60
      --submission-metadata submission_metadata
    # Pull the analysis report and output it to stdout.
    #
    # The condensed PR comment is posted from the `report-benchmarks-adp`
    # downstream job so we still get a comment even if `job result` below
    # exits non-zero.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job sync
      --submission-metadata submission_metadata
      --output-path outputs
    # Finally, exit 1 if the job signals a regression else 0.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job result
      --submission-metadata submission_metadata

report-benchmarks-adp:
  stage: benchmark
  # Build a condensed report from run-benchmarks-adp's report.v1.json and post it
  # to the linked PR. Runs whether or not `run-benchmarks-adp` succeeded so a
  # comment is posted even when SMP signals a regression (and the parent job
  # exits non-zero).
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
      when: always
  needs:
    - job: run-benchmarks-adp
      artifacts: true
  image: "${SALUKI_SMP_CI_IMAGE}"
  timeout: 5m
  artifacts:
    expire_in: 1 week
    paths:
      - outputs/condensed-report.md
    when: always
  before_script:
    - *setup-smp-env
  script:
    # Do some pre-flight steps like creating directories, installing helper utilities, setting credentials, and so on.
    - mkdir -p outputs
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Download the SMP binary.
    - aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/v${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp && chmod +x smp
    - python3 ./ci/tooling/build-smp-report.py
      --report-json outputs/report.v1.json
      --output-report outputs/condensed-report.md
      --smp-binary ./smp
    - cat outputs/condensed-report.md | /usr/local/bin/pr-commenter --for-pr="$CI_COMMIT_REF_NAME" --header="Regression Detector (Agent Data Plane)"

run-benchmarks-adp-full:
  stage: benchmark
  # The full SMP suite (superset of all experiments). Runs automatically on the nightly schedule
  # for long-term trend analysis, and on-demand as a manual job on a PR. This is NOT a PR gate:
  # it does not run `smp job result`, so it never fails the pipeline on a regression. It builds
  # and delivers its own report inline (Slack on the nightly, PR comment on-demand).
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_smp_nightly, rules, if]
    - if: !reference [.on_development_branch, rules, if]
      when: manual
      allow_failure: true
  timeout: 2h
  needs:
    - build-adp-baseline-image
    - build-adp-comparison-image
  image: "${SALUKI_SMP_CI_IMAGE}"
  before_script:
    - *setup-smp-env
  artifacts:
    expire_in: 1 weeks
    paths:
      - submission_metadata # for provenance, debugging
      - outputs/report.v1.json # input of the condensed report, also on S3
      - outputs/condensed-report.md # the posted report, for debugging
    when: always
  script:
    # Do some pre-flight steps like creating directories, installing helper utilities, setting credentials, and so on.
    - mkdir -p outputs
    - ./ci/tooling/configure-smp-aws-credentials.sh
    # Download the SMP binary.
    - aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/v${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp && chmod +x smp
    - echo "Running full suite -- baseline ${BASELINE_ADP_SHA}, comparison ${COMPARISON_ADP_SHA}."
    # Trigger the SMP job run against the full suite.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job submit
      --warmup-seconds 0
      --baseline-image ${BASELINE_SMP_IMG}
      --comparison-image ${COMPARISON_SMP_IMG}
      --baseline-sha ${BASELINE_ADP_SHA}
      --comparison-sha ${COMPARISON_ADP_SHA}
      --target-config-dir ./test/smp/regression/adp/full/
      --submission-metadata submission_metadata
    # Wait for job to complete.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job status
      --wait
      --wait-delay-seconds 60
      --submission-metadata submission_metadata
    # Pull the analysis report, then build and deliver the condensed report. We intentionally do
    # NOT run `job result` here: the full suite is for trend analysis, not gating.
    - ./smp --team-id ${SMP_TEAM_ID} --aws-named-profile ${AWS_NAMED_PROFILE}
      job sync
      --submission-metadata submission_metadata
      --output-path outputs
    # Condense the report and deliver it. Reporting lives in this job (rather than a separate
    # one) because the on-demand run is an optional manual job: a separate `needs`-based report
    # job would run even when the manual job is not triggered, since GitLab does not block
    # dependents on an un-triggered `allow_failure` manual job.
    - python3 ./ci/tooling/build-smp-report.py
      --report-json outputs/report.v1.json
      --output-report outputs/condensed-report.md
      --smp-binary ./smp
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        ./ci/tooling/report-smp-to-slack.sh outputs/condensed-report.md
      else
        cat outputs/condensed-report.md | /usr/local/bin/pr-commenter --for-pr="$CI_COMMIT_REF_NAME" --header="Regression Detector (Agent Data Plane, full suite)"
      fi

# Build the baseline or comparison ADP image with the `optimized-release` profile (fat LTO, one
# codegen unit), which is what we actually ship. The SMP images above use `release` so benchmarks
# keep debug assertions and build quickly, but that profile produces a noticeably larger binary, so
# the size analysis builds its own images to report the size users actually get.
#
# Set `SMP_SHA_ROLE` to `baseline` or `comparison`; the job exports `<ROLE>_ADP_SHA` and
# `<ROLE>_ADP_OPTIMIZED_IMG` for `binary-size-analysis`.
.build-adp-optimized-image:
  extends: .build-common-variables
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Only binary size analysis needs these, so match its rules.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs: []
  retry: 2
  # Fat LTO with a single codegen unit is considerably slower than the `release` profile.
  timeout: 45m
  before_script:
    - *setup-smp-env
  script:
    - ./ci/tooling/configure-smp-aws-credentials.sh
    - export ADP_SHA=$(./ci/tooling/compute-smp-sha.sh ${SMP_SHA_ROLE})
    - export ADP_OPTIMIZED_IMG="${ADP_IMG_BASE}-${ADP_SHA}-optimized"
    - git switch --detach ${ADP_SHA}
    - aws ecr get-login-password --region us-west-2 --profile ${AWS_NAMED_PROFILE} | docker login --username AWS --password-stdin ${SMP_ECR_HOST}
    - docker buildx create --name adp-builder --driver docker-container --use
    - docker buildx build
      --file ./docker/Dockerfile.agent-data-plane
      --tag ${ADP_OPTIMIZED_IMG}
      --build-arg BUILD_PROFILE=optimized-release
      --build-arg BUILD_TARGET=x86_64-unknown-linux-gnu
      --build-arg BUILD_IMAGE=${ADP_PUBLIC_BASE_IMAGE}
      --build-arg SPDX_LICENSES_IMAGE=${SPDX_LICENSES_IMAGE}
      --build-arg APP_IMAGE=${GBI_BASE_IMAGE}
      --build-arg APP_GIT_HASH=${ADP_SHA}
      --label git.repository=${CI_PROJECT_NAME}
      --label git.branch=${CI_COMMIT_REF_NAME}
      --label git.commit=${CI_COMMIT_SHA}
      --label ci.pipeline_id=${CI_PIPELINE_ID}
      --label ci.job_id=${CI_JOB_ID}
      --push
      .
    - export ROLE_PREFIX=$(echo "${SMP_SHA_ROLE}" | tr '[:lower:]' '[:upper:]')
    - echo "${ROLE_PREFIX}_ADP_SHA=${ADP_SHA}" >> size-vars.env
    - echo "${ROLE_PREFIX}_ADP_OPTIMIZED_IMG=${ADP_OPTIMIZED_IMG}" >> size-vars.env
  artifacts:
    reports:
      dotenv: size-vars.env

build-adp-baseline-optimized-image:
  extends: .build-adp-optimized-image
  variables:
    SMP_SHA_ROLE: baseline

build-adp-comparison-optimized-image:
  extends: .build-adp-optimized-image
  variables:
    SMP_SHA_ROLE: comparison

binary-size-analysis:
  stage: benchmark
  tags: ["docker-in-docker:amd64"]
  # Don't run binary size analysis unless it's a PR, basically.
  rules:
    - if: !reference [.on_mq_branch, rules, if]
      when: never
    - if: !reference [.on_development_branch, rules, if]
  image: "${SALUKI_SMP_CI_IMAGE}"
  needs:
    - build-adp-baseline-optimized-image
    - build-adp-comparison-optimized-image
  timeout: 10m
  before_script:
    - *setup-smp-env
  artifacts:
    expire_in: 1 week
    paths:
      - size-diff.csv
      - size-diff.txt
      - size-report.md
    when: always
  script:
    # Initialize our AWS credentials and login to ECR.
    - ./ci/tooling/configure-smp-aws-credentials.sh
    - aws ecr get-login-password --region us-west-2 --profile ${AWS_NAMED_PROFILE} | docker login --username AWS --password-stdin ${SMP_ECR_HOST}

    # Extract binaries from the container images.
    - mkdir -p binaries
    - docker pull ${BASELINE_ADP_OPTIMIZED_IMG}
    - docker create --name baseline-container ${BASELINE_ADP_OPTIMIZED_IMG}
    - docker cp baseline-container:/usr/local/bin/agent-data-plane binaries/baseline-adp
    - docker rm baseline-container
    - docker pull ${COMPARISON_ADP_OPTIMIZED_IMG}
    - docker create --name comparison-container ${COMPARISON_ADP_OPTIMIZED_IMG}
    - docker cp comparison-container:/usr/local/bin/agent-data-plane binaries/comparison-adp
    - docker rm comparison-container

    # Extract debug info and strip binaries for accurate release size comparison.
    # The strip flags match what the Datadog Agent's packaging applies to ADP on Linux, so the
    # stripped size reflects what actually ships, while the separate debug files preserve symbol
    # information for bloaty's analysis.
    - objcopy --only-keep-debug binaries/baseline-adp binaries/baseline-adp.debug
    - objcopy --only-keep-debug binaries/comparison-adp binaries/comparison-adp.debug
    - strip --strip-debug --strip-unneeded binaries/baseline-adp
    - strip --strip-debug --strip-unneeded binaries/comparison-adp

    # Run the analysis script to generate bloaty output, markdown report, and check threshold.
    # The script exits with code 1 if size increased by more than 5%.
    - python3 ./ci/tooling/analyze-binary-size.py
      --baseline-binary binaries/baseline-adp
      --baseline-debug binaries/baseline-adp.debug
      --baseline-sha ${BASELINE_ADP_SHA}
      --comparison-binary binaries/comparison-adp
      --comparison-debug binaries/comparison-adp.debug
      --comparison-sha ${COMPARISON_ADP_SHA}
      --bloaty-path /usr/local/bin/bloaty
      --output-report size-report.md
      --output-csv size-diff.csv
      --output-txt size-diff.txt
      --threshold 5
      --build-profile optimized-release

    # Post the report to the linked PR.
    - cat size-report.md | /usr/local/bin/pr-commenter --for-pr="$CI_COMMIT_REF_NAME" --header="Binary Size Analysis (Agent Data Plane)"
