# Mixins extended by every correctness-test job in the dynamically generated
# child pipeline (see ci/tooling/generate-correctness-pipeline.sh).
#
# Why mixins: the generator emits one stanza per test that is identical except
# for CORRECTNESS_TEST_CASE and (optionally) the baseline-image override.

# Common to every correctness-test job.
.test-correctness-definition:
  stage: test
  tags: ["docker-in-docker:amd64"]
  retry: 2
  timeout: 10m
  image: "${SALUKI_BUILD_CI_IMAGE}"
  artifacts:
    expire_in: 1 week
    paths: [panoramic-logs/]
    when: always
  # Pull panoramic binary built once in the parent pipeline.
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: build-panoramic-binary
      artifacts: true
  variables:
    KUBERNETES_CPU_REQUEST: "24"
    KUBERNETES_MEMORY_REQUEST: "24Gi"
    KUBERNETES_MEMORY_LIMIT: "48Gi"
    DD_LOG_LEVEL: "panoramic=debug,info"
    PANORAMIC_LOG_DIR: "panoramic-logs"
    PANORAMIC_ALPINE_IMAGE: registry.ddbuild.io/alpine:latest
    # Run the cases against the images built for this commit. Panoramic takes one
    # comma-separated list of <container>=<image>; the container names are the ones
    # `panoramic list --json` reports per test.
    PANORAMIC_IMAGE_OVERRIDES: "millstone=${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA},datadog-intake=${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA},comparison=${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA}"
  script:
    - target/release/panoramic run -d $(pwd)/test/correctness/cases -t ${CORRECTNESS_TEST_CASE} --no-tui

# Added when the test's config.yaml names a saluki-images/ baseline (a
# placeholder valid only locally). Replaces it with the CI-built image.
#
# `extends` merges variables one key at a time, so this restates the whole
# override list rather than adding the baseline to it.
.test-correctness-adp-baseline:
  variables:
    PANORAMIC_IMAGE_OVERRIDES: "millstone=${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA},datadog-intake=${SALUKI_IMAGE_REPO_BASE}/correctness-tools:${CI_COMMIT_SHA},comparison=${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA},baseline=${SALUKI_IMAGE_REPO_BASE}/bundled-agent-adp:${CI_COMMIT_SHA}"

# Common to every kind-based correctness-test job. Extends .test-correctness-definition
# with a longer timeout. Cluster creation, image loading, and teardown are managed by
# panoramic itself via the kind lifecycle in k8s.rs.
.test-correctness-kind-definition:
  extends: .test-correctness-definition
  timeout: 20m
