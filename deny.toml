[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # These four advisories relate to bugs in `rustls` where the fixed version would bump our AWS-LC dependency to a version
  # that is not FIPS validated, which is a requirement of our build process. We've evaluated these advisories and
  # determined they have a low practical impact as they don't pose # a risk to the exfiltration of key material or user
  # data.
  #
  # Once AWS-LC 4.x is FIPS validated, we can update `rustls` and remove these exceptions.
  { id = "RUSTSEC-2026-0285", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },
  { id = "RUSTSEC-2026-0346", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },
  { id = "RUSTSEC-2026-0348", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },
  { id = "RUSTSEC-2026-0349", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },

  # These two advisories relate to the compromise of eMudhra/emSign intermediate CA certificates, where the certificates
  # have been revoked and then further distrusted directly in code. We cannot update `rustls-webpki`/`webpki-root-certs`
  # for the same `rustls`/AWS-LC reason as above. However, we've added equivalent SPKI distrust logic to our certificate
  # loader, similar to https://github.com/rustls/webpki/pull/546, which covers RUSTSEC-2026-0382. Likewise,
  # RUSTSEC-2026-0383 only applies on wasm32 targets, which we do not produce builds for.
  #
  # Once AWS-LC 4.x is FIPS validated, we can update `rustls` and remove these exceptions.
  { id = "RUSTSEC-2026-0382", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },
  { id = "RUSTSEC-2026-0383", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },

  # RUSTSEC-2024-0449: unsafe-libyaml (via the deprecated serde_yaml, and lading-payload) is unmaintained. No known
  # vulnerability. Migrating to serde-saphyr needs reworking our serde_yaml::Value usage and coordinating with lading.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained only; no drop-in safe replacement, pending serde-saphyr migration" },
]

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
allow-git = [
  # Git dependency for `lading_payload`, which isn't published on crates.io. We use a tagged version, though, so this
  # is reasonable from our perspective... especially considering the fact that we're the ones who own the repository.
  "https://github.com/DataDog/lading",

  # Datadog-maintained Windows CNG cryptography provider for Rustls. This is pinned to a specific revision in Cargo.toml
  # while the crate is consumed from GitHub directly.
  "https://github.com/DataDog/rustls-cng-crypto",

  # Yet-to-be-published version of incremental Protocol Buffers encoding library.
  "https://github.com/tobz/piecemeal.git",
]
