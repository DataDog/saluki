[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # RUSTSEC-2024-0449: unsafe-libyaml (via the deprecated serde_yaml, and lading-payload) is unmaintained. No known
  # vulnerability. Migrating to serde-saphyr needs reworking our serde_yaml::Value usage and coordinating with lading.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained only; no drop-in safe replacement, pending serde-saphyr migration" },

  # chrono is unmaintained. No known vulnerability. Our own code uses `jiff`, but chrono still arrives through
  # `lading-payload`, which only millstone uses, until lading drops it.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained only; only lading-payload (millstone) still depends on chrono" },

  # heapless 0.8 has several unsoundness advisories. It arrives only through `faster-hex` 0.10, which `gix` uses in the
  # `panoramic` build script through `vergen-gix`. `faster-hex` uses heapless only when its `alloc` feature is off, but
  # Cargo cannot evaluate a feature in a target-specific dependency, so the crate is always in the graph. `gix` enables
  # `alloc`, so no heapless code is used. The latest `gix` still uses `faster-hex` 0.10.
  { id = "RUSTSEC-2026-0574", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0575", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0576", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0577", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0578", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0579", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0580", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0581", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
  { id = "RUSTSEC-2026-0582", reason = "faster-hex 0.10 never uses heapless with alloc on; panoramic build only" },
]

[graph]
# Resolve the dependency graph with FIPS enabled so that bans, licenses, and advisories also cover the crates that
# only appear in FIPS builds (e.g. `aws-lc-fips-sys`).
features = ["fips"]

[bans]
multiple-versions = "allow"
deny = [
  # `aws-lc-fips-sys` bundles the AWS-LC FIPS module. 0.14.x bundles AWS-LC-FIPS 4.x, which is FIPS 140-3 certified.
  # A later version can move to AWS-LC-FIPS 5.x, which is not certified. This ban and `ci/tooling/check-fips-module.sh`
  # keep FIPS builds on a certified module. Lift the ban only after NIST certifies the module that the new version
  # bundles. See the comment next to the `aws-lc-rs` workspace dependency in Cargo.toml.
  { crate = "aws-lc-fips-sys@>=0.15", reason = "may bundle AWS-LC-FIPS 5.x, which is not certified; see aws-lc-rs in Cargo.toml" },
  { crate = "chrono-tz", reason = "unmaintained (RUSTSEC-2026-0555); use saluki_common::time for time zones" },
  { crate = "chrono", wrappers = ["lading-payload"], reason = "unmaintained (RUSTSEC-2026-0543); use saluki_common::time" },
  # Older jiff versions come in through third-party crates, so the ban only covers 1.x.
  { crate = "jiff@>=1", wrappers = ["saluki-common"], reason = "date and time code goes through saluki_common::time" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # MIT No Attribution: OSI approved, and MIT without the attribution clause.
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
# AWS-LC inherits parts of OpenSSL, so the FIPS module crate carries the OpenSSL license alongside ISC/Apache-2.0.
crate = "aws-lc-fips-sys"
allow = ["OpenSSL"]

[sources]
allow-git = [
  # Git dependency for `lading_payload`, which isn't published on crates.io. We use a tagged version, though, so this
  # is reasonable from our perspective... especially considering the fact that we're the ones who own the repository.
  "https://github.com/DataDog/lading",

  # Datadog-maintained Windows CNG cryptography provider for Rustls. This is pinned to a specific revision in Cargo.toml
  # while the crate is consumed from GitHub directly.
  "https://github.com/DataDog/rustls-cng-crypto",

  # Yet-to-be-published version of incremental Protocol Buffers encoding library.
  "https://github.com/tobz/piecemeal.git",

  # Datadog-maintained trace obfuscation crate (`libdd-trace-obfuscation`), shared with Datadog's other trace
  # obfuscation implementations. The version we need is not on crates.io yet, so it is consumed from GitHub and pinned
  # to a specific revision in Cargo.toml.
  "https://github.com/DataDog/libdatadog.git",

  # Unmerged fix for byteorder's AIX alignment assertion; see the `[patch.crates-io]` entry in Cargo.toml for details.
  "https://github.com/amy-kwan/byteorder",
]
