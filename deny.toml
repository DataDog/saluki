[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0285: the fix landed in rustls 0.23.45, but rustls has required aws-lc-rs
  # >=1.18 since 0.23.44 (i.e. that floor predates the security fix, so no rustls release
  # with the fix supports our pinned aws-lc-rs line). aws-lc-rs is intentionally pinned below
  # 1.18 in the workspace Cargo.toml pending FIPS 140-3 certification of AWS-LC-FIPS 4.x (see
  # the comment above the `aws-lc-rs` workspace dependency). The advisory has low practical
  # impact here: it doesn't allow a network attacker to forge or alter a handshake. Revisit
  # once AWS-LC-FIPS 4.x is certified, or if rustls backports the fix to a release built
  # against aws-lc-rs 1.14.
  { id = "RUSTSEC-2026-0285", reason = "blocked on aws-lc-rs FIPS pin; see comment in Cargo.toml" },
]

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # MIT with the attribution requirement dropped, so it asks less of us than MIT. Reached through
  # `libdd-trace-obfuscation` -> `fluent-uri` -> `borrow-or-share`.
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
allow-git = [
  # Git dependency for `lading_payload`, which isn't published on crates.io. We use a tagged version, though, so this
  # is reasonable from our perspective... especially considering the fact that we're the ones who own the repository.
  "https://github.com/DataDog/lading",

  # Datadog-maintained Windows CNG cryptography provider for Rustls. This is pinned to a specific revision in Cargo.toml
  # while the crate is consumed from GitHub directly.
  "https://github.com/DataDog/rustls-cng-crypto",

  # Yet-to-be-published version of incremental Protocol Buffers encoding library.
  "https://github.com/tobz/piecemeal.git",

  # Pinned to a specific revision so we can select our workspace's `rand` version, ahead of a crates.io release that
  # supports it.
  "https://github.com/antithesishq/antithesis-sdk-rust",

  # Datadog-maintained trace obfuscation primitives, shared with the Datadog Agent. Consumed from GitHub, pinned to a
  # specific revision, so that obfuscation behavior can be kept in lockstep with the Agent rather than reimplemented.
  "https://github.com/DataDog/libdatadog",
]
