[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Foldspace's prerelease log-pattern crate is distributed through Datadog's internal testing registry.
ignore = true
# cargo-deny strips one trailing slash while normalizing this sparse registry URL.
ignore-sources = ["https://depot-read-api-rust.us1.ddbuild.io/datadog/rust-testing//"]

[sources]
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://depot-read-api-rust.us1.ddbuild.io/datadog/rust-testing/",
]
allow-git = [
  # Foldspace is revision-pinned while its stateful metrics stack is awaiting publication.
  "https://github.com/DataDog/foldspace",

  # Git dependency for `lading_payload`, which isn't published on crates.io. We use a tagged version, though, so this
  # is reasonable from our perspective... especially considering the fact that we're the ones who own the repository.
  "https://github.com/DataDog/lading",

  # Datadog-maintained Windows CNG cryptography provider for Rustls. This is pinned to a specific revision in Cargo.toml
  # while the crate is consumed from GitHub directly.
  "https://github.com/DataDog/rustls-cng-crypto",

  # Yet-to-be-published version of incremental Protocol Buffers encoding library.
  "https://github.com/tobz/piecemeal.git",
]
