issuer: https://token.actions.githubusercontent.com

subject_pattern: repo:DataDog/saluki:ref:refs/(heads/main|tags/[0-9]+\.[0-9]+\.[0-9]+)

claim_pattern:
  event_name: (release|workflow_dispatch)
  ref: refs/(heads/main|tags/[0-9]+\.[0-9]+\.[0-9]+)
  job_workflow_ref: DataDog/saluki/\.github/workflows/release-notes\.yml@refs/(heads/main|tags/[0-9]+\.[0-9]+\.[0-9]+)

permissions:
  contents: write
