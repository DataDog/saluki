name: Update Agent Release Version

# Proposes newer Datadog Agent RC and stable releases for the release lines in `MAINTAINED_LINES`.
#
# GitHub runs scheduled workflows only from `main`, so this workflow reads each `releases/X.Y.x` branch's
# `.datadog-agent-version.json` from here. For a line that has adopted the file,
# `ci/tooling/update-agent-version/discover_agent_version.py release` looks for the newest complete release within the
# line's `target` minor and never moves backwards. The proposal changes only the file's `integration`: never `target`,
# version gates or code. Each line gets its own bot branch and pull request, and that branch's CI tests the new Agent.
#
# Lines without the file are reported and skipped. They still count as maintained when deciding whether a version gate
# can be removed.
#
# `discover` has a read-only token. `propose` alone exchanges an OIDC token for write access.
#
# Nothing else reports a failed run, so watch this workflow from Slack through the GitHub integration:
# `/github subscribe DataDog/saluki workflows:{name:"Update Agent Release Version" event:"schedule"}`.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-agent-version
  cancel-in-progress: false

env:
  # Space-separated release lines, such as `1.9.x 1.10.x`.
  MAINTAINED_LINES: "1.8.x 1.9.x"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      lines: ${{ steps.discover.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover newer releases for each maintained line
        id: discover
        env:
          # Read-only; raises the GitHub API rate limit for the Agent tag lookups.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          candidates=()
          failed=0
          if [ -z "${MAINTAINED_LINES// }" ]; then
            echo "No maintained release lines are configured." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for line in $MAINTAINED_LINES; do
            if [[ ! "$line" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
              echo "::error::Release line '$line' must look like 1.9.x"
              failed=1
              continue
            fi
            branch="releases/$line"
            if ! git fetch --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error::Could not fetch $branch"
              failed=1
              continue
            fi
            if ! git cat-file -e "origin/$branch:.datadog-agent-version.json" 2>/dev/null; then
              echo "$branch has not adopted .datadog-agent-version.json; skipping it." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi

            current="$RUNNER_TEMP/current/$line.json"
            output="$RUNNER_TEMP/candidates/$line"
            mkdir -p "$(dirname "$current")"
            git show "origin/$branch:.datadog-agent-version.json" > "$current"
            python3 ci/tooling/agent_version.py age --file "$current" | sed "s|^|$branch: |" | tee -a "$GITHUB_STEP_SUMMARY"
            if ! GITHUB_OUTPUT= python3 ci/tooling/update-agent-version/discover_agent_version.py release \
                --merged-file "$current" --base-branch "$branch" --output-dir "$output"; then
              echo "::error::Discovery failed for $branch"
              failed=1
              continue
            fi
            jq -r --arg branch "$branch" '"\($branch): \(.status)" + (if .reason then " (\(.reason))" else "" end)' \
              "$output/summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(jq -r .status "$output/summary.json")" = candidate ]; then
              candidates+=("$line")
            fi
          done
          echo "lines=$(printf '%s\n' "${candidates[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            >> "$GITHUB_OUTPUT"
          exit "$failed"

      - if: ${{ !cancelled() && steps.discover.outputs.lines != '[]' && steps.discover.outputs.lines != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release-candidates
          path: ${{ runner.temp }}/candidates/
          retention-days: 7

  propose:
    needs: discover
    # A failure on one line does not hold back proposals for the others.
    if: ${{ !cancelled() && needs.discover.outputs.lines != '[]' && needs.discover.outputs.lines != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.discover.outputs.lines) }}
    permissions:
      contents: read
      id-token: write
    env:
      LINE: ${{ matrix.line }}
    steps:
      - name: Get access token from dd-octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/saluki
          policy: self.update-agent-version.create-pr

      # Only the tooling is used from this checkout; the write token stays out of git's configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-release-candidates
          path: ${{ runner.temp }}/candidates

      - name: Open or refresh the pull request
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          python3 ci/tooling/update-agent-version/propose_agent_version.py \
            --repository "${{ github.repository }}" \
            --base "releases/$LINE" \
            --branch "ci/update-agent-version-$LINE" \
            --candidate-dir "$RUNNER_TEMP/candidates/$LINE" \
            --label ci/update-agent-version \
            --label automated
