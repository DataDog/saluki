name: Agent pin

# Checks `.agent-pin.json` against the pull request's destination branch: `main` takes a nightly without `target`, and
# a release branch that has adopted the pin keeps it and keeps its `target`. The destination's tip is read separately
# from the proposed tree, so a pull request cannot exempt itself by deleting the pin or `target`. Backport pull requests
# get the same check.

on:
  pull_request:
    branches-ignore:
      - "**/graphite-base/**"
    # `edited` covers a change of destination branch.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the destination branch
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Test the pin tooling
        run: make test-agent-pin

      - name: Validate the pin
        run: make check-agent-pin

      - name: Check the pin against the destination branch
        run: python3 ci/tooling/agent_pin.py check-change --destination "$BASE_REF" --established-ref "origin/$BASE_REF"
