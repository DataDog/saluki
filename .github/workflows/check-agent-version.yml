name: Agent version

# Checks `.datadog-agent-version.json` and `.datadog-agent-release-lines.jsonl` against the pull request's destination
# branch: `main` takes a nightly without `target`, keeps every release-lines entry, and maps its own ADP line. A release
# branch that has adopted the version file keeps it and keeps its `target`, which must match its release-lines entry.
# The destination's tip is read separately from the proposed tree, so a pull request cannot exempt itself by deleting a
# file or `target`. Backport pull requests get the same check.

on:
  pull_request:
    branches-ignore:
      - "**/graphite-base/**"
    # `edited` covers a change of destination branch.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the destination branch
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Test the Agent version tooling
        run: make test-agent-version

      - name: Validate the Agent version file
        run: make check-agent-version

      - name: Check the Agent version file against the destination branch
        run: python3 ci/tooling/agent_version.py check-change --destination "$BASE_REF" --established-ref "origin/$BASE_REF"
