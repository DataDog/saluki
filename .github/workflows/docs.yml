name: docs

permissions:
  contents: write

on: push

jobs:
  generate-docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 23
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23
      - name: Build documentation
        run: |
          yarn install
          yarn run docs:build
      - name: Compress generated documentation assets
        run: tar -C ./docs/.vitepress/dist -c -z -f docs.tar.gz .
      - name: Upload compressed documentation assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs.tar.gz
  generate-api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      # `make generate-api-docs` installs and pins the nightly toolchain it needs (see
      # RUST_NIGHTLY_VERSION in the Makefile); this step just provides a stable Rust and rustup/cargo.
      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - name: Generate API documentation
        run: |
          ls -l .
          ls -l .cargo/config.toml
          make generate-api-docs
      - name: Compress generated API documentation assets
        run: tar -C ./target/doc -c -z -f api-docs.tar.gz .
      - name: Upload compressed API documentation assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: api-docs.tar.gz

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - generate-docs-site
      - generate-api-docs
    permissions:
      id-token: write
    steps:
      - name: Get access token from dd-octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/saluki
          policy: self.docs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-docs
          path: .
      - name: Create extract directory
        run: mkdir -p /tmp/docs/api-docs
      - name: Uncompress generated documentation assets
        run: tar -C /tmp/docs -x -z -f ./docs.tar.gz && rm ./docs.tar.gz
      - name: Uncompress generated API documentation assets
        run: tar -C /tmp/docs/api-docs -x -z -f ./api-docs.tar.gz && rm ./api-docs.tar.gz
      - name: Publish to Github Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: "${{ steps.octo-sts.outputs.token }}"
          publish_dir: /tmp/docs
          commit_message: ${{ github.event.head_commit.message }}
          enable_jekyll: false
          allow_empty_commit: false
