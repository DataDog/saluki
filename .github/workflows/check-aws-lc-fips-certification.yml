name: Check AWS-LC-FIPS 5.x Certification

# FIPS builds use the AWS-LC-FIPS 4.x module, which is FIPS 140-3 certified. A future `aws-lc-rs` release is expected to
# move the `fips` feature to the AWS-LC-FIPS 5.x module (`aws-lc-fips-sys` 0.15+), which has been submitted for FIPS
# 140-3 validation but is not yet certified. The `aws-lc-fips-sys` ban in deny.toml and ci/tooling/check-fips-module.sh
# keep FIPS builds off 5.x until then.
#
# AWS-LC tracks certification status in its FIPS.md, listing certified modules under "Validations". This workflow
# watches for a 5.x entry to appear there and opens an issue so we know when FIPS builds can move to 5.x. FIPS.md can
# lag behind the NIST CMVP site, so check https://csrc.nist.gov/projects/cryptographic-module-validation-program
# directly if an upgrade is urgent.
#
# Retarget this workflow at the next FIPS module once FIPS builds move to 5.x.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check-certification:
    if: github.repository == 'DataDog/saluki'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check AWS-LC FIPS.md for a certified 5.x module
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fipsDocPath = 'crypto/fipsmodule/FIPS.md';
            const fipsDocUrl = `https://github.com/aws/aws-lc/blob/main/${fipsDocPath}`;

            const { data: file } = await github.rest.repos.getContent({
              owner: 'aws',
              repo: 'aws-lc',
              path: fipsDocPath,
              ref: 'main',
            });
            const doc = Buffer.from(file.content, 'base64').toString('utf8');

            // Grab the "## Validations" section, up to the next level-two heading.
            const validationsMatch = doc.match(/^## Validations\s*$([\s\S]*?)(?=^## )/m);

            // Entries are bullets of the form "* <module name>: certificate [#NNNN](...)". Match only the module
            // name, so that certificate numbers such as #5146 don't count.
            const entries = (validationsMatch ? validationsMatch[1] : '')
              .split('\n')
              .filter((line) => line.trim().startsWith('*'));
            const moduleName = (entry) => entry.split(':')[0];

            // Fail loudly if the document no longer looks the way we expect, rather than silently never finding a
            // match. The 3.1 static module has a certificate, so the parsed entries should always include it.
            if (!entries.some((entry) => /AWS-LC-FIPS v3\.1 \(static/.test(moduleName(entry)))) {
              core.setFailed(
                `Could not find the expected "Validations" entries in ${fipsDocUrl}. ` +
                'The document format may have changed; update this workflow to match.'
              );
              return;
            }

            // We ship a static FIPS build, so the static library certificate is the one that matters. AWS-LC names
            // modules both as "AWS-LC-FIPS v5.0 (static library)" and as "AWS-LC 5 Cryptographic Module (static)", so
            // accept either form.
            const certified = entries.filter((entry) => {
              const name = moduleName(entry);
              return /AWS-LC(-FIPS)?\s+v?5(\.\d+)*\b/.test(name) && /\bstatic\b/i.test(name);
            });

            if (certified.length === 0) {
              console.log('AWS-LC-FIPS 5.x (static) is not yet listed under "Validations".');
              return;
            }

            console.log('AWS-LC-FIPS 5.x (static) appears to be certified:');
            certified.forEach((line) => console.log(`  ${line}`));

            const title = 'AWS-LC-FIPS 5.x is FIPS 140-3 certified: allow FIPS builds to use it';

            // Don't open a duplicate if we've already filed one (open or closed).
            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
            });
            if (existing.items.length > 0) {
              console.log(`Issue already exists: ${existing.items[0].html_url}`);
              return;
            }

            const body = [
              `AWS-LC now lists a 5.x module under "Validations" in [FIPS.md](${fipsDocUrl}):`,
              '',
              ...certified,
              '',
              'Verify the certificate on the NIST CMVP site, and read its security policy to find the AWS-LC version ' +
                'it covers. Then, once an `aws-lc-rs` release uses the 5.x module:',
              '',
              '- [ ] Add module `5` and the minimum certified AWS-LC version to ci/tooling/check-fips-module.sh',
              '- [ ] Move the `aws-lc-fips-sys` ban in `deny.toml` to the crate version after the one that bundles 5.x',
              '- [ ] Update the `aws-lc-rs` comment in the workspace `Cargo.toml`',
              '- [ ] Upgrade `aws-lc-rs` and confirm that FIPS builds compile and pass TLS tests on the 5.x module',
              '- [ ] Retarget `.github/workflows/check-aws-lc-fips-certification.yml` at the next FIPS module',
              '',
              '_This issue was automatically opened by the ' +
                `[Check AWS-LC-FIPS 5.x Certification](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                '/blob/main/.github/workflows/check-aws-lc-fips-certification.yml) workflow._',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automated', 'dependencies'],
            });
            console.log(`Opened issue: ${issue.html_url}`);
