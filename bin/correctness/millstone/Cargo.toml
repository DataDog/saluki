[package]
name = "millstone"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[dependencies]
backon = { workspace = true, features = ["tokio-sleep"] }
base64 = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true, features = ["serde"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
lading-payload = { workspace = true }
prost = { workspace = true }
rand = { workspace = true, features = ["std_rng"] }
saluki-common = { workspace = true }
saluki-error = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
simdutf8 = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "ansi",
  "fmt",
  "local-time",
  "registry",
  "std",
  "tracing-log",
] }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
