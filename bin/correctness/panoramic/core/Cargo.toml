[package]
name = "panoramic-core"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
default = []
test-util = []

[dependencies]
airlock = { path = "../../airlock" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["client"] }
rand = { workspace = true, features = ["std", "thread_rng"] }
saluki-error = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(not(windows))'.dev-dependencies]
rustls = { workspace = true, features = ["aws_lc_rs"] }

[target.'cfg(windows)'.dev-dependencies]
rustls-cng-crypto = { workspace = true }
