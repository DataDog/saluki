description: >-
  The subject of the otlp-metrics correctness case: ADP's OTLP receiver beside the Agent's, sending to an intake, with a
  load that sends it OTLP metrics over gRPC.
timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "false"
      DD_DATA_PLANE_OTLP_ENABLED: "true"
      # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys once endpoint
      # ownership prevents both processes from attempting to bind the same ports.
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_grpc.port }}"
      ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:{{ self.endpoints.otlp_http.port }}"
      DD_AGGREGATE_CONTEXT_LIMIT: "500000"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake.api}
  intake:
    type: datadog-intake
  load:
    image: saluki-images/correctness-tools:latest
    command: [/usr/local/bin/millstone, /etc/millstone/millstone.yaml]
    files:
      /etc/millstone/millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.otlp_grpc}
procedure: []
