description: >-
  The subject of the dsd-udp correctness case: ADP beside the Agent, whose datadog.yaml sets the UDP listener's key and
  turns the sockets off, sending to an intake, with a load that sends it DogStatsD over UDP.
timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    image: saluki-images/datadog-agent:testing-release
    env:
      DD_API_KEY: correctness-test
      DD_DATA_PLANE_ENABLED: "true"
      DD_DATA_PLANE_STANDALONE_MODE: "true"
      DD_DATA_PLANE_DOGSTATSD_ENABLED: "true"
      DD_AGGREGATE_CONTEXT_LIMIT: "500000"
    files:
      datadog.yaml: {from: datadog.yaml, template: true}
    connect: {intake: intake.api}
  intake:
    type: datadog-intake
  load:
    image: saluki-images/correctness-tools:latest
    command: [/usr/local/bin/millstone, /etc/millstone/millstone.yaml]
    files:
      /etc/millstone/millstone.yaml: {from: millstone.yaml, template: true}
    connect: {comparison_target: adp.dogstatsd_udp}
procedure: []
