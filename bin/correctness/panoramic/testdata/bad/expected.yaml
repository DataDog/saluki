# Each bad case under this directory, the subject OS it is planned for, and a substring of the error.
create-order-cycle: {subject_os: linux, error: "the create order has a cycle: first -> second -> first"}
file-source-outside-the-suite: {subject_os: linux, error: "is outside the suite directory"}
malformed-reference-in-template-file: {subject_os: linux, error: "is not a reference"}
own-ip-at-create: {subject_os: linux, error: "has a value once participant 'app' starts"}
reserved-path: {subject_os: linux, error: "is reserved by the harness"}
socket-path-too-long: {subject_os: linux, error: "and a Unix socket path on linux holds at most 107"}
supervising-file-replaced: {subject_os: linux, error: "the case replaces '/etc/services.d/agent/finish'"}
two-letter-cases-of-one-windows-path: {subject_os: windows, error: "two files land on"}
two-processes-observed-through-the-container: {subject_os: linux, error: "processes 'main', 'helper' are observed through the container"}
unwired-after-a-dotted-file-key: {subject_os: linux, error: "datadog.yaml sets 'apm_config.receiver_port', so the default DD_APM_RECEIVER_PORT was withdrawn, and nothing references the endpoint.\n  Write: receiver_port: \"{{ self.endpoints.apm_tcp.port }}\" under apm_config in datadog.yaml"}
unwired-after-an-adp-only-key: {subject_os: linux, error: "env sets ADP_DD_DOGSTATSD_PORT, so the default DD_DOGSTATSD_PORT was withdrawn"}
otlp-moved-by-the-image: {subject_os: linux, error: "With DD_DATA_PLANE_OTLP_ENABLED set, the image moves the Agent's OTLP listeners to 127.0.0.1"}
