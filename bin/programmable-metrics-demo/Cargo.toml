[package]
name = "programmable-metrics-demo"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[dependencies]
argh = { workspace = true, features = ["help"] }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
bytes = { workspace = true }
datadog-agent-commons = { workspace = true }
datadog-protos = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
protobuf = { workspace = true }
rcgen = { workspace = true, features = ["crypto", "pem"] }
rustls = { workspace = true }
saluki-common = { workspace = true }
saluki-error = { workspace = true }
saluki-io = { workspace = true }
saluki-metric-plan = { workspace = true }
saluki-metric-plan-syntax = { workspace = true }
saluki-tls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
stele = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { workspace = true, features = [
  "decompression-deflate",
  "decompression-gzip",
  "decompression-zstd",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "ansi",
  "fmt",
  "local-time",
  "registry",
  "std",
  "tracing-log",
] }

[target.'cfg(not(windows))'.dependencies]
rcgen = { workspace = true, features = ["aws_lc_rs"] }

[target.'cfg(windows)'.dependencies]
rcgen = { workspace = true, features = ["ring"] }

[dev-dependencies]
prometheus-exposition = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
zstd = { workspace = true }
