[package]
name = "agent-data-plane"
version = "1.8.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
default = []
fips = ["saluki-app/tls-fips", "saluki-components/fips"]
antithesis = ["saluki-antithesis/antithesis", "dep:antithesis-instrumentation"]
# Compiles the measurement probes of saluki-core and of the DogStatsD source, which the source-fed measurements in
# `programmable_metrics::topology::measurement_tests` read. Not enabled in production builds, nor in the workspace's
# test builds: `make test-measurement` runs the probes' and the harness's own tests with it.
measurement = ["saluki-core/measurement", "saluki-components/measurement"]

[dependencies]
agent-data-plane-config = { workspace = true }
agent-data-plane-config-system = { workspace = true }
antithesis-instrumentation = { workspace = true, optional = true }
arc-swap = { workspace = true }
argh = { workspace = true, features = ["help"] }
async-trait = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
comfy-table = { workspace = true }
datadog-agent-commons = { workspace = true }
datadog-agent-config = { workspace = true }
datadog-protos = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
metrics = { workspace = true }
ottl = { workspace = true }
process-memory = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rustls = { workspace = true }
saluki-antithesis = { workspace = true }
saluki-api = { workspace = true }
saluki-app = { workspace = true }
saluki-common = { workspace = true }
saluki-components = { workspace = true }
saluki-config = { workspace = true }
saluki-core = { workspace = true }
saluki-env = { workspace = true }
saluki-error = { workspace = true }
saluki-io = { workspace = true }
saluki-metadata = { workspace = true }
saluki-metric-kernels = { workspace = true }
saluki-metric-plan = { workspace = true }
saluki-metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stringtheory = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { workspace = true, features = ["taskdump"] }
tikv-jemallocator = { workspace = true, features = [
  "background_threads",
  "unprefixed_malloc_on_supported_platforms",
  "stats",
] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
datadog-agent-config-testing = { workspace = true }
derive-where = { workspace = true }
libc = { workspace = true }
protobuf = { workspace = true }
rcgen = { workspace = true, features = ["crypto", "pem"] }
saluki-components = { workspace = true, features = ["test-util"] }
saluki-config = { workspace = true, features = ["test-util"] }
saluki-core = { workspace = true, features = ["test-util"] }
saluki-metric-plan = { workspace = true, features = ["test-util"] }
saluki-metric-plan-syntax = { workspace = true }
saluki-metrics = { workspace = true, features = ["test"] }
saluki-tls = { workspace = true, features = ["test-util"] }
serde_yaml = { workspace = true }
stele = { workspace = true }
tokio = { workspace = true, features = ["process", "test-util"] }
tower = { workspace = true, features = ["util"] }

[target.'cfg(not(windows))'.dev-dependencies]
rcgen = { workspace = true, features = ["aws_lc_rs"] }

[target.'cfg(windows)'.dev-dependencies]
rcgen = { workspace = true, features = ["ring"] }
